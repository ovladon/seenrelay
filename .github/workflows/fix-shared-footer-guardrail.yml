name: Fix Shared Footer Guardrail

on:
  push:
    branches:
      - site/browser-workload-map-and-shared-footer
    paths:
      - '.github/workflows/fix-shared-footer-guardrail.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: site/browser-workload-map-and-shared-footer
      - name: Relocate semantic guardrail to shared footer component
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/guardrails.test.mjs')
          s=p.read_text()
          old="""  const publicSource = read('src','public.ts');
  const stats = read('src','public-db.ts');"""
          new="""  const publicSource = read('src','public.ts');
  const publicFactsView = read('src','public-facts-view.ts');
  const stats = read('src','public-db.ts');"""
          if old not in s:
              raise SystemExit('guardrail setup marker missing')
          s=s.replace(old,new,1)
          old2="""  assert.match(publicSource, /does not decide truth/);
  assert.match(publicSource, /observations, not universal truth|Recent observations, not universal truth/i);"""
          new2="""  assert.match(publicSource, /does not decide truth/);
  assert.match(publicSource, /siteFooterHtml\\(\\)/);
  assert.match(publicFactsView, /Recent observations, not universal truth/i);"""
          if old2 not in s:
              raise SystemExit('stale footer assertion marker missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --test tests/guardrails.test.mjs tests/site-footer.test.mjs
      - name: Commit guardrail update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/guardrails.test.mjs
          git commit -m 'Keep public trust guardrail on shared footer'
          git push origin HEAD:site/browser-workload-map-and-shared-footer
