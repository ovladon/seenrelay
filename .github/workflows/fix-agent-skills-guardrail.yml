name: Refine Agent Skills guardrail

on:
  push:
    branches:
      - release/client-0.2.7-ambient-frameworks

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message != 'Refine A2A guardrail for Agent Skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Refine only the over-broad A2A assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/guardrails.test.mjs')
          s = p.read_text()
          old = "  assert.doesNotMatch(index, /agent-card|\\.well-known\\/agent|\\/a2a/i);"
          new = "  assert.doesNotMatch(index, /agent-card|\\.well-known\\/agent(?!-skills)|\\/a2a/i);"
          assert s.count(old) == 1, 'expected exactly one legacy A2A assertion'
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check -- tests/guardrails.test.mjs
          git diff -- tests/guardrails.test.mjs

      - name: Commit guardrail refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/guardrails.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Refine A2A guardrail for Agent Skills'
          git push origin HEAD:release/client-0.2.7-ambient-frameworks
