name: SWE-chat full browser overlap OIDC (PRIVATE304)

on:
  pull_request:
    branches:
      - research/browser-natural-swechat-full-oidc-v1
    paths:
      - preregistration/PRIVATE310_SWECHAT_FULL_BROWSER_OVERLAP_DEDUP_ORDER_V1.json
      - scripts/run-private302-swechat-full-overlap.py
      - scripts/prepare-private304-hf-oidc.py
      - scripts/run-private304-swechat-full-overlap.py
      - tests/private302-swechat-full-overlap.test.py
      - tests/private302-swechat-overlap-core.test.mjs
      - tests/private304-hf-oidc.test.py
      - .github/workflows/swechat-full-browser-overlap-oidc.yml

permissions:
  contents: read
  id-token: write

jobs:
  overlap-oidc:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/private310-swechat-dedup-order-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_OIDC_RESOURCE: ${{ secrets.HF_OIDC_RESOURCE }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialize transient Hugging Face cache
        run: echo "HF_HOME=$RUNNER_TEMP/private310-hf" >> "$GITHUB_ENV"

      - name: Install pinned frozen measurement dependencies
        run: python -m pip install --disable-pip-version-check huggingface_hub==0.35.3 pyarrow==21.0.0

      - name: Re-run frozen PRIVATE302 Node tests
        run: node --test tests/private302-swechat-overlap-core.test.mjs

      - name: Run corrected PRIVATE302 extraction tests
        run: python tests/private302-swechat-full-overlap.test.py

      - name: Re-run frozen PRIVATE304 OIDC tests
        run: python tests/private304-hf-oidc.test.py

      - name: Attempt preregistered Hugging Face user OIDC exchange
        run: python scripts/prepare-private304-hf-oidc.py --blocked-output private310-swechat-full-browser-overlap.json

      - name: Execute frozen overlap measurement with PRIVATE310 extraction correction
        if: ${{ env.PRIVATE304_OIDC_READY == 'true' }}
        run: python scripts/run-private304-swechat-full-overlap.py --output private310-swechat-full-browser-overlap.json > "$RUNNER_TEMP/private310-measurement-stdout.txt"

      - name: Enforce aggregate-only PRIVATE310 report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path('private310-swechat-full-browser-overlap.json')
          r = json.loads(path.read_text(encoding='utf-8'))
          EXPECTED_SOURCE = {
              'dataset': 'SALT-NLP/SWE-chat',
              'resolved_revision': 'f66cca95b14caaa4177f7ed5eaa424608dadcffa',
              'filename': 'conversations.parquet',
              'logical_size': 1311422253,
              'git_blob_id': 'e8c76683b25698fc4312baf45fa6cb2297773946',
          }
          BLOCKED_NO_EXCHANGE = {
              'ACCESS_BLOCKED_NO_HF_OIDC_RESOURCE',
              'ACCESS_BLOCKED_OIDC_EXCHANGE_REJECTED',
          }
          BLOCKED_AFTER_EXCHANGE = {'ACCESS_BLOCKED_GATED_DATASET_NOT_ACCESSIBLE'}
          FORBIDDEN_KEYS = {
              'raw_url','raw_prompt','session_id','tool_call_id','turn_id','exact_key','url_key',
              'tool_input_json','content','rows','calls','subject_token','access_token','HF_OIDC_RESOURCE',
              'hf_username','resource'
          }

          def walk(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in FORBIDDEN_KEYS:
                          raise SystemExit(f'forbidden raw/auth field in aggregate report: {key}')
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          if r.get('schema') != 'seenrelay-private304-swechat-full-browser-overlap-oidc-v1':
              raise SystemExit('schema mismatch')
          if r.get('source') != EXPECTED_SOURCE:
              raise SystemExit('source lock mismatch')
          walk(r)

          auth = r.get('authentication', {})
          if set(auth) != {
              'method','oidc_exchange_succeeded','authorized_content_access_succeeded',
              'static_hf_token_used','gate_bypass_attempted','fallback_dataset_used'
          }:
              raise SystemExit('authentication schema mismatch')
          if auth['method'] != 'HUGGING_FACE_USER_CICD_OIDC':
              raise SystemExit('authentication method mismatch')
          if auth['static_hf_token_used'] is not False or auth['gate_bypass_attempted'] is not False or auth['fallback_dataset_used'] is not False:
              raise SystemExit('forbidden authentication behavior')

          expected_privacy = {
              'hf_username_retained','oidc_id_token_retained','hf_access_token_retained',
              'raw_parquet_retained_in_artifact','raw_urls_retained_in_artifact','raw_prompts_retained_in_artifact',
              'session_ids_retained_in_artifact','tool_call_ids_retained_in_artifact',
              'turn_ids_retained_in_artifact','per_key_hashes_retained_in_artifact'
          }
          if set(r.get('privacy', {})) != expected_privacy or any(r['privacy'][k] is not False for k in expected_privacy):
              raise SystemExit('privacy contract mismatch')

          expected_interpretation = {
              'observer_independence_proven','private285_class_pass_authorized','seenrelay_reuse_authorized',
              'production_change_authorized','population_prevalence_claim_authorized','commercial_claim_authorized'
          }
          if set(r.get('interpretation', {})) != expected_interpretation or any(r['interpretation'][k] is not False for k in expected_interpretation):
              raise SystemExit('interpretation contract mismatch')

          status = r.get('status')
          if status in BLOCKED_NO_EXCHANGE:
              if r.get('measurement_performed') is not False or auth['oidc_exchange_succeeded'] is not False or auth['authorized_content_access_succeeded'] is not False:
                  raise SystemExit('pre-exchange blocked flags mismatch')
              if set(r) != {'schema','status','measurement_performed','source','authentication','interpretation','privacy'}:
                  raise SystemExit('blocked report has unexpected fields')
              raise SystemExit(0)

          if status in BLOCKED_AFTER_EXCHANGE:
              if r.get('measurement_performed') is not False or auth['oidc_exchange_succeeded'] is not True or auth['authorized_content_access_succeeded'] is not False:
                  raise SystemExit('post-exchange blocked flags mismatch')
              if set(r) != {'schema','status','measurement_performed','source','authentication','interpretation','privacy'}:
                  raise SystemExit('blocked report has unexpected fields')
              raise SystemExit(0)

          if status != 'MEASURED' or r.get('measurement_performed') is not True:
              raise SystemExit('unknown result status')
          if auth['oidc_exchange_succeeded'] is not True or auth['authorized_content_access_succeeded'] is not True:
              raise SystemExit('measured result lacks authorized OIDC access')
          if set(r) != {'schema','status','measurement_performed','source','authentication','extraction','overlap','interpretation','privacy'}:
              raise SystemExit('measured report has unexpected fields')

          e = r['extraction']
          if e != {
              'selected_webfetch_rows_before_physical_dedup': 882,
              'duplicate_physical_webfetch_records_removed': 1,
              'unique_physical_webfetch_calls': 881,
          }:
              raise SystemExit('extraction geometry differs from frozen PRIVATE309 result')

          o = r['overlap']
          expected_overlap = {
              'schema','source_sessions_with_webfetch','physical_webfetch_calls_seen','eligible_http_webfetch_calls',
              'rejected_calls','unique_exact_operation_keys','exact_repeat_calls_any_session','exact_keys_spanning_sessions',
              'cross_session_exact_reuse_opportunities','cross_session_exact_reuse_percent','unique_url_keys',
              'url_keys_spanning_sessions','cross_session_url_reuse_opportunities','cross_session_url_reuse_percent',
              'classification','ordering','interpretation','privacy'
          }
          if set(o) != expected_overlap or o.get('schema') != 'seenrelay-private302-swechat-overlap-core-v1':
              raise SystemExit('frozen overlap-core schema mismatch')
          if o['physical_webfetch_calls_seen'] != 881:
              raise SystemExit('overlap core did not receive exactly the deduplicated physical population')

          counts = [
              'source_sessions_with_webfetch','physical_webfetch_calls_seen','eligible_http_webfetch_calls',
              'unique_exact_operation_keys','exact_repeat_calls_any_session','exact_keys_spanning_sessions',
              'cross_session_exact_reuse_opportunities','unique_url_keys','url_keys_spanning_sessions',
              'cross_session_url_reuse_opportunities'
          ]
          if any(not isinstance(o[k], int) or isinstance(o[k], bool) or o[k] < 0 for k in counts):
              raise SystemExit('invalid overlap count')
          rejected = o['rejected_calls']
          if set(rejected) != {'missing_url','invalid_url','non_http_url','missing_prompt'} or any(not isinstance(v, int) or isinstance(v, bool) or v < 0 for v in rejected.values()):
              raise SystemExit('rejection accounting invalid')
          if o['eligible_http_webfetch_calls'] + sum(rejected.values()) != 881:
              raise SystemExit('eligibility accounting mismatch')
          if o['exact_repeat_calls_any_session'] != o['eligible_http_webfetch_calls'] - o['unique_exact_operation_keys']:
              raise SystemExit('exact repeat accounting mismatch')

          eligible = o['eligible_http_webfetch_calls']
          exact = o['cross_session_exact_reuse_opportunities']
          if eligible < 100:
              expected_class = 'INSUFFICIENT_EXTERNAL_SAMPLE'
          elif exact * 100 < eligible * 5:
              expected_class = 'LOW_EXACT_OVERLAP_SIGNAL'
          elif exact * 100 < eligible * 20:
              expected_class = 'WEAK_EXACT_OVERLAP_SIGNAL'
          else:
              expected_class = 'STRONG_EXACT_OVERLAP_SIGNAL'
          if o['classification'] != expected_class:
              raise SystemExit('classification differs from frozen integer thresholds')

          def pct(n, d):
              return 0 if d == 0 else round((n / d) * 100, 6)
          if not math.isclose(o['cross_session_exact_reuse_percent'], pct(exact, eligible), rel_tol=0, abs_tol=5e-7):
              raise SystemExit('exact display percentage mismatch')
          if not math.isclose(o['cross_session_url_reuse_percent'], pct(o['cross_session_url_reuse_opportunities'], eligible), rel_tol=0, abs_tol=5e-7):
              raise SystemExit('URL display percentage mismatch')
          if o['ordering'] != {'primary':'timestamp_ascending_nonnull_first','tie_breakers':['session_id','turn_number','turn_id']}:
              raise SystemExit('ordering changed from PRIVATE302')
          if o['interpretation'] != {
              'exact_overlap_is_lower_bound_only': True,
              'different_native_session_is_independence_proxy_only': True,
              'observer_independence_proven': False,
              'natural_workload_class_pass_authorized': False,
              'seenrelay_reuse_authorized': False
          }:
              raise SystemExit('overlap interpretation flags changed')
          if o['privacy'] != {
              'raw_urls_retained': False,'raw_prompts_retained': False,'session_ids_retained': False,
              'turn_ids_retained': False,'per_key_hashes_retained': False
          }:
              raise SystemExit('overlap privacy flags changed')
          PY

      - name: Delete transient OIDC token, stdout and Hugging Face cache
        if: always()
        run: |
          rm -f "${PRIVATE304_HF_TOKEN_FILE:-$RUNNER_TEMP/private304-hf-token}"
          rm -f "$RUNNER_TEMP/private310-measurement-stdout.txt"
          rm -rf "${HF_HOME:-$RUNNER_TEMP/private310-hf}"

      - name: Upload aggregate PRIVATE310 result only
        uses: actions/upload-artifact@v4
        with:
          name: private310-swechat-full-browser-overlap
          path: private310-swechat-full-browser-overlap.json
          retention-days: 14
          if-no-files-found: error
