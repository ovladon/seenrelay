name: SWE-chat full browser overlap OIDC (PRIVATE304)

on:
  pull_request:
    branches:
      - research/browser-natural-swechat-full-oidc-v1
    paths:
      - preregistration/PRIVATE307_HF_OIDC_SAME_WORKFLOW_DIAGNOSTIC_V1.json
      - scripts/run-private307-hf-oidc-same-workflow.py
      - .github/workflows/swechat-full-browser-overlap-oidc.yml

permissions:
  contents: read
  id-token: write

jobs:
  oidc-same-workflow-diagnostic:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/private307-hf-oidc-same-workflow-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_OIDC_RESOURCE: ${{ secrets.HF_OIDC_RESOURCE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute PRIVATE307 authentication-only diagnostic
        run: python scripts/run-private307-hf-oidc-same-workflow.py --output private307-hf-oidc-same-workflow.json

      - name: Enforce diagnostic-only aggregate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('private307-hf-oidc-same-workflow.json')
          r = json.loads(p.read_text())
          if r.get('schema') != 'seenrelay-private307-hf-oidc-same-workflow-diagnostic-v1' or r.get('status') != 'DIAGNOSTIC_COMPLETE':
              raise SystemExit('schema/status mismatch')
          if r.get('dataset_access_attempted') is not False:
              raise SystemExit('dataset access forbidden')
          gh = r.get('github_oidc', {})
          allowed = {'iss','aud','repository','repository_owner','repository_visibility','event_name','ref','ref_type','workflow','workflow_ref','job_workflow_ref'}
          if set(gh) != {'audience_requested','claims'} or gh['audience_requested'] != 'https://huggingface.co' or set(gh.get('claims', {})) != allowed:
              raise SystemExit('GitHub OIDC schema mismatch')
          hf = r.get('hugging_face_exchange', {})
          if set(hf) != {'succeeded','http_status','oauth_error','request_id_present'}:
              raise SystemExit('HF exchange schema mismatch')
          if not isinstance(hf['succeeded'], bool) or not isinstance(hf['http_status'], int) or not isinstance(hf['request_id_present'], bool):
              raise SystemExit('HF exchange types invalid')
          if hf['oauth_error'] is not None and not isinstance(hf['oauth_error'], str):
              raise SystemExit('HF oauth error invalid')
          if any(r.get('privacy', {}).values()) or any(r.get('interpretation', {}).values()):
              raise SystemExit('privacy/interpretation flags must remain false')
          raw = p.read_text()
          for marker in ('hf_oauth_', 'hf_jwt_', 'subject_token', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN'):
              if marker in raw:
                  raise SystemExit(f'credential value marker retained: {marker}')
          PY

      - name: Upload aggregate PRIVATE307 diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: private307-hf-oidc-same-workflow
          path: private307-hf-oidc-same-workflow.json
          retention-days: 14
          if-no-files-found: error
