name: Verify LangChain Context7 Compatibility 2026-09-01

on:
  push:
    branches:
      - verify/langchain-context7-compat-2026-09-01
    paths:
      - .github/workflows/verify-langchain-context7-compat-2026-09-01.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify external sample source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/microsoft/langchain-for-beginners.git /tmp/langchain-for-beginners
          cd /tmp/langchain-for-beginners
          git checkout --quiet 978a81f8d02f837ea23d2e8f5e1b9303f16f3914
          test -f 06-mcp/code/01_mcp_integration.py
          grep -Fq 'from langchain_mcp_adapters.client import MultiServerMCPClient' 06-mcp/code/01_mcp_integration.py
          grep -Fq 'https://mcp.context7.com/mcp' 06-mcp/code/01_mcp_integration.py
          echo 'PASS: external Microsoft sample source pinned and compatible in shape.'

      - name: Install public packages
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet 'seenrelay==0.2.7' 'langchain-mcp-adapters'

      - name: Run published SeenRelay shadow wrapper against Context7
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.py <<'PY'
          import asyncio
          import json
          from langchain_mcp_adapters.client import MultiServerMCPClient
          from seenrelay_ambient import ambient_langchain_mcp_client

          async def main():
              raw = MultiServerMCPClient({
                  "context7": {
                      "transport": "streamable_http",
                      "url": "https://mcp.context7.com/mcp",
                  }
              })
              client = ambient_langchain_mcp_client(raw)
              tools = await client.get_tools()
              by_name = {tool.name: tool for tool in tools}
              target = by_name.get("resolve-library-id") or by_name.get("resolve_library_id")
              if target is None:
                  raise RuntimeError(f"Context7 resolve tool not found; tools={sorted(by_name)}")

              args = {
                  "libraryName": "requests",
                  "query": "How to make an HTTP GET request in Python using requests",
              }
              for _ in range(3):
                  await target.ainvoke(args)

              report = client.get_report()
              print(json.dumps(report, indent=2, sort_keys=True))

              assert report["framework"] == "langchain-mcp-adapters"
              assert report["calls"] == 3, report
              assert report["measured_calls"] == 3, report
              assert report["exact_repeat_validations"] == 2, report
              assert report["authoritative_failures"] == 0, report
              assert report["interpretation"]["savings_proven"] is False
              assert report["interpretation"]["automatic_reuse_authorized"] is False
              assert report["interpretation"]["public_claim_authorized"] is False
              assert report["interpretation"]["active_mode_available"] is False

              candidate = [x for x in report["tools"] if x["tool"] in {"resolve-library-id", "resolve_library_id"}]
              assert len(candidate) == 1, report
              metric = candidate[0]
              print("RESULT", json.dumps({
                  "calls": metric["calls"],
                  "repeat_validations": metric["exact_repeat_validations"],
                  "unchanged_repeats": metric["exact_unchanged_repeats"],
                  "changed_repeats": metric["exact_changed_repeats"],
                  "refused": metric["refused_measurements"],
                  "avoidable_ms_upper_bound": metric["upper_bound_avoidable_authoritative_ms_before_native_and_check_overhead"],
                  "next_step": report["interpretation"]["next_step"],
              }, sort_keys=True))

          asyncio.run(main())
          PY
          python /tmp/probe.py | tee /tmp/report.txt

      - name: Record compatibility verdict
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"calls": 3' /tmp/report.txt
          grep -Fq '"repeat_validations": 2' /tmp/report.txt
          echo 'PASS: SeenRelay 0.2.7 instruments the pinned external LangChain MCP pattern in local shadow mode without credentials or application-result suppression.'
