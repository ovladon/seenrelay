name: Package Registry Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'clients/**'
      - '.github/workflows/publish-clients.yml'
      - '.github/workflows/package-registry-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-ownership:
    name: Registry ownership and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Read allowed client versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_VERSION="$(jq -r '.install.client_version' public/product-facts.json)"
          RELEASE_VERSION="$(tr -d '[:space:]' < clients/RELEASE_VERSION)"
          test -n "$PUBLIC_VERSION"
          test -n "$RELEASE_VERSION"
          echo "public=$PUBLIC_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check npm package ownership
        shell: bash
        env:
          PUBLIC_VERSION: ${{ steps.versions.outputs.public }}
          RELEASE_VERSION: ${{ steps.versions.outputs.release }}
        run: |
          set -euo pipefail
          metadata="$(npm view seenrelay name version repository.url --json)"
          echo "$metadata"
          version="$(printf '%s' "$metadata" | jq -r '.version')"
          repo="$(printf '%s' "$metadata" | jq -r '."repository.url" // .repository.url // empty' 2>/dev/null || true)"
          if [ -z "$repo" ]; then
            repo="$(printf '%s' "$metadata" | jq -r '.repository // empty' 2>/dev/null || true)"
          fi
          if ! node - "$version" "$PUBLIC_VERSION" "$RELEASE_VERSION" <<'NODE'
          const [current, lower, upper] = process.argv.slice(2);
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value);
            if (!match) process.exit(2);
            return match.slice(1).map(Number);
          };
          const compare = (a, b) => {
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1;
            }
            return 0;
          };
          const v = parse(current), lo = parse(lower), hi = parse(upper);
          process.exit(compare(v, lo) >= 0 && compare(v, hi) <= 0 ? 0 : 1);
          NODE
          then
            echo "Unexpected npm version during staged rollout: $version (expected between $PUBLIC_VERSION and $RELEASE_VERSION inclusive)" >&2
            exit 1
          fi
          case "$repo" in
            *github.com/ovladon/seenrelay*) echo 'npm package exists and points to the SeenRelay repository.' ;;
            *) echo "npm package 'seenrelay' does not identify the SeenRelay repository: ${repo:-missing repository metadata}" >&2; exit 1 ;;
          esac

      - name: Check PyPI project ownership
        shell: bash
        env:
          PUBLIC_VERSION: ${{ steps.versions.outputs.public }}
          RELEASE_VERSION: ${{ steps.versions.outputs.release }}
        run: |
          set -euo pipefail
          python - "$PUBLIC_VERSION" "$RELEASE_VERSION" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          public_version, release_version = sys.argv[1:3]

          def parse(version):
              parts = version.split('.')
              if len(parts) != 3 or any(not part.isdigit() for part in parts):
                  raise SystemExit(f"Invalid stable version: {version}")
              return tuple(int(part) for part in parts)

          with urllib.request.urlopen('https://pypi.org/pypi/seenrelay/json', timeout=20) as response:
              data = json.load(response)

          info = data.get('info') or {}
          project_urls = info.get('project_urls') or {}
          candidates = [
              str(project_urls.get('Repository') or ''),
              str(project_urls.get('Source') or ''),
              str(project_urls.get('Homepage') or ''),
              str(info.get('home_page') or ''),
              str(info.get('project_url') or ''),
          ]
          if not any('github.com/ovladon/seenrelay' in value for value in candidates):
              raise SystemExit("PyPI project 'seenrelay' does not identify the SeenRelay repository.")

          generic_version = str(info.get('version') or '')
          generic_parsed = parse(generic_version)
          public_parsed = parse(public_version)
          release_parsed = parse(release_version)
          if generic_parsed > release_parsed:
              raise SystemExit(
                  f"Unexpected newer PyPI generic version during staged rollout: {generic_version} "
                  f"(release manifest is {release_version})"
              )
          if generic_parsed < public_parsed:
              print(
                  f"PyPI generic latest is temporarily lagging the exact promoted release: "
                  f"generic={generic_version}, public={public_version}. Exact-version verification remains authoritative."
              )

          def verify_exact(version):
              with urllib.request.urlopen(
                  f'https://pypi.org/pypi/seenrelay/{version}/json',
                  timeout=20,
              ) as response:
                  release_data = json.load(response)
              release_info = release_data.get('info') or {}
              if str(release_info.get('version') or '') != version:
                  raise SystemExit(f"PyPI exact endpoint did not confirm seenrelay {version}.")

          # The public version is already promoted and must always exist exactly.
          verify_exact(public_version)

          # A newer RELEASE_VERSION is a staged source candidate. It is allowed to be
          # absent until the post-merge trusted-publishing workflow publishes it.
          # If it already exists (for an idempotent retry), verify it exactly.
          staged_release_state = 'same_as_public'
          if release_version != public_version:
              try:
                  verify_exact(release_version)
                  staged_release_state = 'already_published'
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
                  staged_release_state = 'awaiting_trusted_publish'

          print(
              f"PyPI project ownership verified; generic latest={generic_version}; "
              f"public exact={public_version}; staged release={release_version}:{staged_release_state}"
          )
          PY
          echo 'PyPI project exists, points to the SeenRelay repository, and exposes the exact rollout artifacts.'
