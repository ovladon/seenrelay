name: One-off Public Facts Runtime Patch V2

on:
  push:
    branches: [infra/public-facts-sync]
    paths:
      - '.github/workflows/public-facts-runtime-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: infra/public-facts-sync
      - name: Apply runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def exact(path, old, new, count=1):
              p=Path(path); t=p.read_text(); n=t.count(old)
              if n != count: raise SystemExit(f'{path}: expected {count}, found {n}: {old[:90]!r}')
              p.write_text(t.replace(old,new,count))

          exact('src/public.ts', "import { standardsPosture } from './standards.js';", "import { standardsPosture } from './standards.js';\nimport { publicProductFacts } from './public-facts.generated.js';\nimport { latestVerifiedHtml, productFactsForOrigin, publicInstallHtml, verifiedBenchmarkHtml } from './public-facts-view.js';")
          exact('src/public.ts', "        failure_semantics: \"Relay-side failure fails open into the application's existing validation path.\"", "        failure_semantics: \"Relay-side failure fails open into the application's existing validation path.\",\n        client_version: publicProductFacts.install.client_version,\n        npm_install: publicProductFacts.install.npm_command,\n        pypi_install: publicProductFacts.install.pypi_command,\n        runtime_dependencies: publicProductFacts.install.runtime_dependencies,\n        public_registry_verified_at: publicProductFacts.install.registry_install_verified_at")
          p=Path('src/public.ts'); t=p.read_text()
          start="      pricing_examples_checked_at: '2026-08-26',\n      examples: ["
          end="      caveat: 'Illustrative list-price arithmetic only. Actual savings depend on measured SAME_OBSERVED reuse accepted by caller policy, provider plan structure, included credits, network/compute overhead and current provider prices.'"
          a=t.index(start); b=t.index(end,a)+len(end)
          t=t[:a]+"      pricing_snapshots: publicProductFacts.pricing_snapshots,\n      verified_benchmarks: publicProductFacts.verified_benchmarks,\n      caveat: 'Measured benchmark results are first-party smoke evidence, not a promised reuse rate. Actual savings depend on caller policy, repeat probability, provider plan structure and CHECK overhead.'"+t[b:]
          p.write_text(t)
          exact('src/public.ts', "      service_descriptor: `${origin}/service.json`", "      service_descriptor: `${origin}/service.json`,\n      product_facts: `${origin}/product-facts.json`")
          exact('src/public.ts', "    }\n  };\n}\n\nexport function publicLandingPage(origin: string): string {", "    },\n    public_product_facts: productFactsForOrigin(origin),\n    latest_verified_updates: publicProductFacts.latest_verified_updates\n  };\n}\n\nexport function publicLandingPage(origin: string): string {")
          hero='<div class="contract"><span>Exactly 2 operations</span><b>CHECK</b><b>OBSERVE</b><span>Currently free · no account · fleet reuse · no truth verdict</span></div>\n</section>'
          exact('src/public.ts',hero,hero+'\n${publicInstallHtml()}\n${verifiedBenchmarkHtml()}\n${latestVerifiedHtml()}')
          exact('src/public.ts','<header class="nav"><a class="brand" href="/">SeenRelay<span class="pulse"></span></a><nav><a href="/economics">Savings</a>','<header class="nav"><a class="brand" href="/">SeenRelay<span class="pulse"></span></a><nav><a href="#install">Install</a><a href="#verified-results">Measured</a><a href="#latest">Latest</a><a href="/economics">Savings</a>')

          exact('src/adoption.ts','export function clientsPage(origin: string): string {',"import { machinePublicFactsText, publicInstallHtml } from './public-facts-view.js';\n\nexport function clientsPage(origin: string): string {")
          old='''<section class="section split" id="install">\n<div><div class="eyebrow">PUBLIC INSTALL</div><h2>Two commands. No account or API key.</h2><p>Install the zero-dependency client from the standard registry, then bind SeenRelay around the expensive validator you already have. Version <code>0.1.0</code> is live on both registries and has been clean-install verified from the public indexes.</p></div>\n<div class="terminal"><pre>npm install seenrelay\n\n# or\n\npip install seenrelay</pre></div>\n</section>'''
          exact('src/adoption.ts',old,'${publicInstallHtml()}')
          exact('src/adoption.ts','SeenRelay reports recent observations, not universal truth. It does not browse, search, externally verify facts, or use an LLM as a truth arbiter.\n',"SeenRelay reports recent observations, not universal truth. It does not browse, search, externally verify facts, or use an LLM as a truth arbiter.\n\n${machinePublicFactsText(origin)}\n")
          exact('src/adoption.ts','- Public JavaScript / TypeScript install: \\`npm install seenrelay\\`\n- Public Python install: \\`pip install seenrelay\\`\n','- Canonical install/version/benchmark facts: ${origin}/product-facts.json\n')
          prices='''Current illustrative list-price arithmetic, checked 2026-08-26:\n- OpenAI Web Search: $10 / 1,000 calls. 100,000 calls = $1,000 in search-call fees; at an illustrative measured 30% reusable rate, 70,000 calls = $700, or $300 gross search-call spend avoided. Search-content token effects are excluded.\n- Browserbase Extract without proxies: $4 / 1,000 marginal calls after included allowance. 100,000 genuinely billable marginal calls = $400; at 30% reusable, $280, or $120 gross marginal spend avoided.\n- Firecrawl Standard: $83/month billed yearly for 100,000 credits; a standard scrape uses 1 credit. 100,000 scrapes reduced by 30% still remain in the same plan: $83 -> $83, so direct plan-fee saving is $0 while 30,000 credits are freed. Lower call count does not automatically mean a lower invoice.\n\nThe 30% rate above is an illustration, not a promise. Use Shadow Proof on the actual workload before enabling reuse or making a savings claim.'''
          exact('src/adoption.ts',prices,'Current provider-price snapshots and measured benchmark evidence are maintained in ${origin}/product-facts.json and ${origin}/economics. Provider prices are freshness-gated in CI; do not treat a copied historical price as current. Use Shadow Proof on the actual workload before enabling reuse or making a savings claim.')

          exact('src/quickstart.ts','export function quickstartPage(origin: string): string {',"import { publicInstallHtml } from './public-facts-view.js';\n\nexport function quickstartPage(origin: string): string {")
          old='''<section class="section split" id="install">\n<div><div class="eyebrow">INSTALL</div><h2>Use the normal package manager.</h2><p>No vendoring and no copy-paste client file. Version <code>0.1.0</code> is publicly installable from npm and PyPI.</p></div>\n<div class="terminal"><pre>npm install seenrelay\n\n# or\n\npip install seenrelay</pre></div>\n</section>'''
          exact('src/quickstart.ts',old,'${publicInstallHtml()}')

          exact('src/economics.ts','export function economicsPage(origin: string): string {',"import { publicProductFacts } from './public-facts.generated.js';\nimport { verifiedBenchmarkHtml } from './public-facts-view.js';\n\nexport function economicsPage(origin: string): string {\n  const prices = publicProductFacts.pricing_snapshots;")
          hero='<div class="contract"><span>SeenRelay API fee</span><b>Currently $0</b><span>Measure first · reuse remains caller policy</span></div>\n</section>'
          exact('src/economics.ts',hero,hero+'\n${verifiedBenchmarkHtml()}')
          grid='''<div class="proof-grid"><article><b>OpenAI Web Search</b><span>$10 / 1,000 calls → 100k calls = $1,000. If 30k validations are safely reusable, 70k paid searches = $700. <strong>$300 gross search-call spend avoided.</strong> Search-content token effects are excluded.</span></article><article><b>Firecrawl Pay As You Go</b><span>$5 / 1,000 credits and a standard scrape uses 1 credit. 100k scrapes = $500 of purchased credits. At 30% reusable: 70k scrapes = $350. <strong>$150 gross credit spend avoided</strong>, assuming the avoided credits would otherwise have been purchased.</span></article><article><b>Browserbase Extract</b><span>Published marginal Extract rate: $4 / 1,000 calls without proxies after plan allowance. For 100k billable marginal calls: $400 → $280 at 30% reuse. <strong>$120 gross marginal spend avoided.</strong></span></article><article><b>Fixed-tier counterexample</b><span>Firecrawl Standard is $83/month billed yearly for 100k credits. 100k scrapes → 70k still remains inside the same tier: <strong>$83 → $83</strong>. 30k credits are freed, but the bill falls only if lower usage changes tier, overage or future capacity needs.</span></article></div>'''
          replacement='''<div class="proof-grid"><article><b>OpenAI Web Search</b><span>$${prices.openai_web_search.price_usd_per_1000_calls} / 1,000 calls. Dollar savings remain illustrative until the caller measures its own reuse rate.</span></article><article><b>Firecrawl basic scrape</b><span>${prices.firecrawl.basic_scrape_credits_per_page} credit per page. The measured basic-scrape smoke test avoided provider credits but lost on latency versus Firecrawl's own cache.</span></article><article><b>Firecrawl JSON extraction</b><span>${prices.firecrawl.json_extraction_total_credits_per_page} credits per full extraction. In the measured n=3 smoke benchmark, 3 eligible reuses avoided 15 credits and cut median latency from 1.266 s fresh / 1.040 s provider-cached to 0.618 s.</span></article><article><b>Fixed-tier counterexample</b><span>Firecrawl Standard snapshot: $${prices.firecrawl.standard_plan_usd_per_month_billed_yearly}/month billed yearly for ${prices.firecrawl.standard_plan_credits_per_month.toLocaleString()} credits. Avoided credits lower the invoice only if they change tier, overage or required capacity.</span></article></div>'''
          exact('src/economics.ts',grid,replacement)
          exact('src/economics.ts','Illustrative arithmetic using public provider prices checked 26 August 2026.','Illustrative arithmetic using public provider prices checked ${prices.checked_at}.')
          exact('src/economics.ts','Price sources: <a href="https://platform.openai.com/pricing">OpenAI API pricing</a> · <a href="https://www.firecrawl.dev/pricing">Firecrawl pricing</a> · <a href="https://www.browserbase.com/pricing">Browserbase pricing</a>.','Price sources are stored with verification dates in <a href="/product-facts.json">product-facts.json</a>.')

          exact('src/index.ts',"import { dataPracticesDescriptor, dataPracticesPage } from './data-practices.js';", "import { dataPracticesDescriptor, dataPracticesPage } from './data-practices.js';\nimport { productFactsForOrigin } from './public-facts-view.js';")
          exact('src/index.ts',"app.get('/service.json', (c) => {\n  c.header('cache-control', 'public, max-age=300');\n  return c.json(serviceDescriptor(new URL(c.req.url).origin));\n});", "app.get('/service.json', (c) => {\n  c.header('cache-control', 'public, max-age=300');\n  return c.json(serviceDescriptor(new URL(c.req.url).origin));\n});\napp.get('/product-facts.json', (c) => {\n  c.header('cache-control', 'public, max-age=300');\n  return c.json(productFactsForOrigin(new URL(c.req.url).origin));\n});")
          exact('CHANGELOG.md','# Changelog','# Changelog\n\n<!-- BEGIN GENERATED:PUBLIC-FACTS -->\nCurrent install/version/verified benchmark facts are generated from `public/product-facts.json`. See [`docs/VERIFIED_RESULTS.md`](docs/VERIFIED_RESULTS.md) and `https://seenrelay.com/product-facts.json`.\n<!-- END GENERATED:PUBLIC-FACTS -->')
          PY

      - name: Add synchronization guardrail
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/public-facts-sync.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          const root=path.join(path.dirname(fileURLToPath(import.meta.url)),'..');
          const read=(...p)=>fs.readFileSync(path.join(root,...p),'utf8');
          const facts=JSON.parse(read('public','product-facts.json'));
          test('canonical public facts drive install and measured-result surfaces',()=>{
            assert.equal(facts.install.npm_command,'npm install seenrelay');
            assert.equal(facts.install.pypi_command,'pip install seenrelay');
            assert.ok(facts.verified_benchmarks.some(b=>b.id==='firecrawl-json-extraction-2026-08-26'));
            for(const file of ['README.md','clients/README.md','docs/QUICKSTART.md']){
              const t=read(...file.split('/')); assert.match(t,/BEGIN GENERATED:/); assert.match(t,/npm install seenrelay/); assert.match(t,/pip install seenrelay/);
            }
          });
          test('runtime consumes shared renderers and exposes machine facts',()=>{
            const pub=read('src','public.ts'), ad=read('src','adoption.ts'), q=read('src','quickstart.ts'), e=read('src','economics.ts'), i=read('src','index.ts');
            assert.match(pub,/publicInstallHtml\(\)/); assert.match(pub,/verifiedBenchmarkHtml\(\)/); assert.match(pub,/latestVerifiedHtml\(\)/);
            assert.match(ad,/machinePublicFactsText\(origin\)/); assert.match(q,/publicInstallHtml\(\)/); assert.match(e,/verifiedBenchmarkHtml\(\)/); assert.match(i,/\/product-facts\.json/);
            assert.doesNotMatch(pub+ad+e,/Firecrawl Pay As You Go/);
          });
          test('CI and daily monitor fail on drift or stale pricing',()=>{
            const pkg=JSON.parse(read('package.json')); assert.match(pkg.scripts.check,/public:sync:check/);
            const w=read('.github','workflows','public-facts-freshness.yml'); assert.match(w,/--enforce-freshness/); assert.match(w,/permissions:\n  contents: read/); assert.doesNotMatch(w,/contents: write/);
          });
          EOF
      - name: Verify and commit runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-public-surfaces.mjs --enforce-freshness
          npm install --ignore-scripts --no-audit --no-fund >/dev/null
          npm run typecheck:full
          node --test tests/public-facts-sync.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/public.ts src/adoption.ts src/quickstart.ts src/economics.ts src/index.ts CHANGELOG.md tests/public-facts-sync.test.mjs
          git diff --cached --check
          git commit -m 'Use canonical public facts across runtime surfaces'
          git push origin HEAD:infra/public-facts-sync
