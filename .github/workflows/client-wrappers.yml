name: Client Wrappers

on:
  pull_request:
    paths:
      - 'clients/**'
      - 'tests/client-wrappers.test.mjs'
      - 'tests/shadow-proof.test.mjs'
      - 'tests/deferred-observe.test.mjs'
      - 'tests/python-zero-state-parity.test.mjs'
      - '.github/workflows/client-wrappers.yml'
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - 'tests/client-wrappers.test.mjs'
      - 'tests/shadow-proof.test.mjs'
      - 'tests/deferred-observe.test.mjs'
      - 'tests/python-zero-state-parity.test.mjs'
      - '.github/workflows/client-wrappers.yml'

permissions:
  contents: read
  actions: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - name: Run wrapper suite through natural fleet eligibility firewall
        env:
          SEENRELAY_FLEET_ROLE: client-wrappers
          SEENRELAY_FLEET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SEENRELAY_FLEET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          FLEET_SHADOW_PREFIX: fleet-wrapper-v2-shadow-client-wrappers
        run: node scripts/run-fleet-wrapper-natural.mjs
      - name: Upload fleet wrapper shadow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-wrapper-v2-shadow-client-wrappers
          path: |
            fleet-wrapper-v2-shadow-client-wrappers-measurement.json
            fleet-wrapper-v2-shadow-client-wrappers-ledger.json
            fleet-wrapper-v2-shadow-client-wrappers-summary.json
            fleet-wrapper-v2-shadow-client-wrappers-benchmark.json
            fleet-wrapper-v2-shadow-client-wrappers-evaluation.json
          if-no-files-found: warn
          retention-days: 90

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install Python client with optional crypto test dependency
        run: python -m pip install --disable-pip-version-check -e '.[crypto]'
        working-directory: clients/python
      - run: python -m unittest discover -v
        working-directory: clients/python
      - name: Verify Python and JavaScript Zero-State coordinate parity
        run: node --test tests/python-zero-state-parity.test.mjs
