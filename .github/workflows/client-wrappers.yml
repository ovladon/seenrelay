name: Client Wrappers

on:
  pull_request:
    paths:
      - 'clients/**'
      - 'tests/client-wrappers.test.mjs'
      - 'tests/shadow-proof.test.mjs'
      - 'tests/deferred-observe.test.mjs'
      - 'scripts/fleet-wrapper-shadow.mjs'
      - '.github/workflows/client-wrappers.yml'
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - 'tests/client-wrappers.test.mjs'
      - 'tests/shadow-proof.test.mjs'
      - 'tests/deferred-observe.test.mjs'
      - 'scripts/fleet-wrapper-shadow.mjs'
      - '.github/workflows/client-wrappers.yml'

permissions:
  contents: read
  actions: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore latest evidence-eligible Client Wrappers fleet v2 ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          destination='previous-fleet-v2-client-wrappers'
          rm -rf "$destination"
          mkdir -p "$destination"
          found=''
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            [ "$run_id" != "$GITHUB_RUN_ID" ] || continue
            candidate="$(mktemp -d)"
            if gh run download "$run_id" \
              --name "fleet-wrapper-v2-shadow-client-wrappers-$run_id" \
              --dir "$candidate" >/dev/null 2>&1; then
              if node - "$candidate" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.argv[2];
          const measurementPath = path.join(dir, 'fleet-wrapper-v2-shadow-client-wrappers-measurement.json');
          const ledgerPath = path.join(dir, 'fleet-wrapper-v2-shadow-client-wrappers-ledger.json');
          if (!fs.existsSync(measurementPath) || !fs.existsSync(ledgerPath)) process.exit(1);
          const measurement = JSON.parse(fs.readFileSync(measurementPath, 'utf8'));
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          if (measurement.evidence_eligible !== true) process.exit(1);
          if (measurement.workload_id !== 'wrapper-deterministic-suite-fleet-v2') process.exit(1);
          if (ledger.workload_id !== 'wrapper-deterministic-suite-fleet-v2' || ledger.role !== 'client-wrappers') process.exit(1);
          NODE
              then
                cp "$candidate/fleet-wrapper-v2-shadow-client-wrappers-ledger.json" \
                  "$destination/fleet-wrapper-v2-shadow-client-wrappers-ledger.json"
                found="$run_id"
                rm -rf "$candidate"
                break
              fi
            fi
            rm -rf "$candidate"
          done < <(gh run list --workflow "$GITHUB_WORKFLOW" --status success --limit 50 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "Restored evidence-eligible Client Wrappers fleet v2 ledger from run $found"
          else
            echo 'No prior evidence-eligible Client Wrappers fleet v2 ledger found; eligible evidence will start from zero.'
          fi

      - name: Run existing JavaScript wrapper suite in strict shadow measurement
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEENRELAY_ORIGIN: https://seenrelay.com
          SEENRELAY_FLEET_ROLE: client-wrappers
          SEENRELAY_FLEET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SEENRELAY_FLEET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          FLEET_SHADOW_PREVIOUS_LEDGER: previous-fleet-v2-client-wrappers/fleet-wrapper-v2-shadow-client-wrappers-ledger.json
          FLEET_SHADOW_PREFIX: fleet-wrapper-v2-shadow-client-wrappers
        run: node scripts/fleet-wrapper-shadow.mjs

      - name: Verify sanitized Client Wrappers fleet v2 evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const measurement = JSON.parse(fs.readFileSync('fleet-wrapper-v2-shadow-client-wrappers-measurement.json', 'utf8'));
          const ledger = JSON.parse(fs.readFileSync('fleet-wrapper-v2-shadow-client-wrappers-ledger.json', 'utf8'));
          const summary = JSON.parse(fs.readFileSync('fleet-wrapper-v2-shadow-client-wrappers-summary.json', 'utf8'));
          if (measurement.workload_id !== 'wrapper-deterministic-suite-fleet-v2' || measurement.workload_class !== 'fleet_tool_validations') process.exit(1);
          if (measurement.first_party !== true || measurement.external_adoption_evidence !== false) process.exit(1);
          if (ledger.role !== 'client-wrappers' || ledger.workload_id !== 'wrapper-deterministic-suite-fleet-v2' || ledger.cost_unit !== 'github_actions_runner_ms') process.exit(1);
          if (summary.cumulative_protected_calls !== ledger.protected_calls) process.exit(1);
          if (ledger.protected_calls !== ledger.records.length + ledger.records_dropped) process.exit(1);
          if (summary.current_run_evidence_eligible !== measurement.evidence_eligible) process.exit(1);
          if (measurement.evidence_eligible === false) {
            if (measurement.record !== null || measurement.provider_native_control?.measured !== false) process.exit(1);
            if (summary.current_run_natural_events !== 0 || summary.current_run_protected_calls !== 0) process.exit(1);
          } else {
            if (measurement.provider_native_control?.measured !== true || summary.current_run_natural_events !== 1) process.exit(1);
            if (measurement.provider_native_control?.query_ok === false && (measurement.record !== null || summary.current_run_protected_calls !== 0)) process.exit(1);
          }
          if (summary.previous_v1_evidence_carried_forward !== false) process.exit(1);
          for (const value of [measurement, ledger, summary]) {
            if (value.raw_values_retained !== false || value.fact_identity_retained !== false || value.sources_retained !== false || value.timestamps_retained !== false) process.exit(1);
          }
          const allowed = new Set([
            'check_status','policy_reusable','reuse_would_match_validation','observe_after_baseline',
            'baseline_ms','baseline_cost','check_ms','observe_ms','check_cost','observe_cost'
          ]);
          for (const record of ledger.records || []) {
            if (Object.keys(record).some((key) => !allowed.has(key))) process.exit(1);
          }
          if (measurement.provider_native_control?.hit === true && measurement.record !== null) process.exit(1);
          NODE

      - name: Upload Client Wrappers fleet v2 natural-workload evidence
        uses: actions/upload-artifact@v4
        with:
          name: fleet-wrapper-v2-shadow-client-wrappers-${{ github.run_id }}
          path: |
            fleet-wrapper-v2-shadow-client-wrappers-measurement.json
            fleet-wrapper-v2-shadow-client-wrappers-ledger.json
            fleet-wrapper-v2-shadow-client-wrappers-summary.json
            fleet-wrapper-v2-shadow-client-wrappers-benchmark.json
            fleet-wrapper-v2-shadow-client-wrappers-evaluation.json
          if-no-files-found: warn
          retention-days: 30

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -v
        working-directory: clients/python
