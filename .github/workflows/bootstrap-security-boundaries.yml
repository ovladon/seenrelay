name: Bootstrap Security Boundaries

on:
  push:
    branches:
      - security/harden-request-and-release-boundaries
    paths:
      - 'scripts/bootstrap-security-boundaries.py'
      - '.github/workflows/bootstrap-security-boundaries.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/harden-request-and-release-boundaries
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply request-boundary hardening
        run: |
          python3 scripts/bootstrap-security-boundaries.py
          npm run check
      - name: Commit ordinary project changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/http.ts src/admin.ts src/index.ts tests/http-security.test.ts tests/security-boundaries.test.mjs
          git commit -m 'Bound request bodies before protocol and admin parsing'
          git push origin HEAD:security/harden-request-and-release-boundaries
