name: Temporary Promote Client 0.2.1

on:
  push:
    branches:
      - release/promote-clients-0.2.1

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/promote-clients-0.2.1

      - name: Apply deterministic promotion
        run: node scripts/_promote-client-0.2.1.mjs

      - name: Commit generated promotion surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md clients/README.md docs/CLIENTS.md docs/QUICKSTART.md public/product-facts.json scripts/sync-public-surfaces.mjs src/adoption.ts src/public.ts src/quickstart.ts src/public-facts.generated.ts
          if git diff --cached --quiet; then
            echo 'No promotion drift to commit.'
            exit 0
          fi
          git commit -m 'Promote verified client 0.2.1 public surfaces'
          git push origin HEAD:release/promote-clients-0.2.1
