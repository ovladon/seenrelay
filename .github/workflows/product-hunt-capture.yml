name: Product Hunt Capture

on:
  push:
    branches:
      - capture/product-hunt-2026-09-25
    paths-ignore:
      - 'artifacts/product-hunt/**'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: capture/product-hunt-2026-09-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary browser client
        run: npm install --no-save --package-lock=false puppeteer-core@24
      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          "$CHROME_PATH" --version
      - name: Capture Production screenshots
        run: node scripts/capture-product-hunt.mjs
      - name: Verify image dimensions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const name of fs.readdirSync('artifacts/product-hunt').filter(x => x.endsWith('.png')).sort()) {
            const p = 'artifacts/product-hunt/' + name;
            const b = fs.readFileSync(p);
            if (b.toString('hex',0,8) !== '89504e470d0a1a0a') throw new Error(p + ' is not PNG');
            const width = b.readUInt32BE(16);
            const height = b.readUInt32BE(20);
            console.log(p, width + 'x' + height);
            if (width !== 1270 || height !== 760) throw new Error(p + ' wrong dimensions');
          }
          NODE
      - name: Upload capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-hunt-screenshots
          path: artifacts/product-hunt
          if-no-files-found: error
          compression-level: 6
      - name: Commit captured media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "seenrelay-capture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/product-hunt
          git commit -m "Capture Product Hunt Production screenshots [skip ci]"
          git push origin HEAD:capture/product-hunt-2026-09-25
