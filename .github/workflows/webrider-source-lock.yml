name: WebRider source lock

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-lock:
    if: startsWith(github.head_ref, 'research/browser-portability-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lock dataset revision and tasks metadata hash
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request

          repo = 'WebRider/WebRider'
          headers = {'User-Agent': 'seenrelay-private287-source-lock/1.0'}
          api = f'https://huggingface.co/api/datasets/{repo}'
          with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=30) as response:
              info = json.load(response)
          revision = info.get('sha')
          if not isinstance(revision, str) or len(revision) < 20:
              raise SystemExit('Dataset API did not return a stable revision SHA')

          url = f'https://huggingface.co/datasets/{repo}/resolve/{revision}/tasks.json?download=true'
          request = urllib.request.Request(url, headers=headers)
          digest = hashlib.sha256()
          size = 0
          with urllib.request.urlopen(request, timeout=60) as response:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
                  size += len(chunk)
          if size <= 0:
              raise SystemExit('tasks.json was empty')

          result = {
              'schema': 'seenrelay-private287-source-lock-v1',
              'dataset': repo,
              'revision': revision,
              'file': 'tasks.json',
              'sha256': digest.hexdigest(),
              'bytes': size,
              'analysis_performed': False,
          }
          with open('private287-source-lock.json', 'w', encoding='utf-8') as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write('\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Enforce source-lock-only boundary
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('private287-source-lock.json', 'utf8'));
          if (lock.schema !== 'seenrelay-private287-source-lock-v1') process.exit(1);
          if (lock.dataset !== 'WebRider/WebRider') process.exit(1);
          if (lock.file !== 'tasks.json') process.exit(1);
          if (lock.analysis_performed !== false) process.exit(1);
          if (!/^[0-9a-f]{40,64}$/i.test(lock.revision)) process.exit(1);
          if (!/^[0-9a-f]{64}$/i.test(lock.sha256)) process.exit(1);
          if (!(lock.bytes > 0)) process.exit(1);
          NODE

      - name: Upload source lock only
        uses: actions/upload-artifact@v4
        with:
          name: private287-webrider-source-lock
          path: private287-source-lock.json
          if-no-files-found: error
          retention-days: 14
