name: Temporary Fix Preview Client Version

on:
  push:
    branches:
      - release/promote-clients-0.2.1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/promote-clients-0.2.1

      - name: Make Preview client version assertion derive from public facts
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/preview-release-gate.sh')
          text = path.read_text()
          old = "if (x.install?.client_version !== '0.2.0') process.exit(1);"
          new = "const expectedClientVersion = JSON.parse(fs.readFileSync('public/product-facts.json', 'utf8')).install?.client_version;\nif (x.install?.client_version !== expectedClientVersion) process.exit(1);"
          if old not in text:
              raise SystemExit('expected hard-coded Preview client version assertion not found')
          path.write_text(text.replace(old, new))

      - name: Commit Preview gate fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/preview-release-gate.sh
          git commit -m 'Make Preview client version assertion dynamic'
          git push origin HEAD:release/promote-clients-0.2.1
