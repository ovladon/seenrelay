name: Fleet Wrapper Natural Evaluation

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Restore latest evidence-eligible fleet v2 role ledgers
        id: restore
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf fleet-v2-role-ledgers
          mkdir -p fleet-v2-role-ledgers/ci fleet-v2-role-ledgers/client-wrappers

          restore_role() {
            workflow="$1"
            role="$2"
            destination="$3"
            found=''
            while read -r run_id; do
              [ -n "$run_id" ] || continue
              candidate="$(mktemp -d)"
              if gh run download "$run_id" \
                --name "fleet-wrapper-v2-shadow-${role}-${run_id}" \
                --dir "$candidate" >/dev/null 2>&1; then
                if node - "$candidate" "$role" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.argv[2];
          const role = process.argv[3];
          const prefix = `fleet-wrapper-v2-shadow-${role}`;
          const measurementPath = path.join(dir, `${prefix}-measurement.json`);
          const ledgerPath = path.join(dir, `${prefix}-ledger.json`);
          if (!fs.existsSync(measurementPath) || !fs.existsSync(ledgerPath)) process.exit(1);
          const measurement = JSON.parse(fs.readFileSync(measurementPath, 'utf8'));
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          if (measurement.evidence_eligible !== true) process.exit(1);
          if (measurement.workload_id !== 'wrapper-deterministic-suite-fleet-v2') process.exit(1);
          if (ledger.workload_id !== 'wrapper-deterministic-suite-fleet-v2' || ledger.role !== role) process.exit(1);
          NODE
                then
                  cp "$candidate/fleet-wrapper-v2-shadow-${role}-ledger.json" \
                    "$destination/fleet-wrapper-v2-shadow-${role}-ledger.json"
                  found="$run_id"
                  rm -rf "$candidate"
                  break
                fi
              fi
              rm -rf "$candidate"
            done < <(gh run list --workflow "$workflow" --status success --limit 50 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
            if [ -n "$found" ]; then
              echo "Restored evidence-eligible $role fleet v2 ledger from run $found"
              return 0
            fi
            echo "No evidence-eligible $role fleet v2 artifact exists yet"
            return 1
          }

          ready=true
          restore_role 'CI' 'ci' 'fleet-v2-role-ledgers/ci' || ready=false
          restore_role 'Client Wrappers' 'client-wrappers' 'fleet-v2-role-ledgers/client-wrappers' || ready=false
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" != true ]; then
            echo 'Fleet v2 natural evaluation is not ready; no synthetic empty ledger will be created.'
          fi

      - name: Combine fleet v2 role ledgers offline
        if: steps.restore.outputs.ready == 'true'
        run: |
          node scripts/evaluate-fleet-wrapper-ledgers.mjs \
            fleet-v2-role-ledgers/ci/fleet-wrapper-v2-shadow-ci-ledger.json \
            fleet-v2-role-ledgers/client-wrappers/fleet-wrapper-v2-shadow-client-wrappers-ledger.json

      - name: Verify combined fleet v2 privacy and admission contract
        if: steps.restore.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const ledger = JSON.parse(fs.readFileSync('fleet-wrapper-natural-ledger.json', 'utf8'));
          const summary = JSON.parse(fs.readFileSync('fleet-wrapper-natural-summary.json', 'utf8'));
          if (ledger.workload_id !== 'wrapper-deterministic-suite-fleet-v2' || ledger.workload_class !== 'fleet_tool_validations') process.exit(1);
          if (ledger.cost_unit !== 'github_actions_runner_ms') process.exit(1);
          if (summary.external_adoption_evidence !== false || summary.cumulative_protected_calls !== ledger.protected_calls) process.exit(1);
          if (ledger.protected_calls !== ledger.records.length + ledger.records_dropped) process.exit(1);
          for (const value of [ledger, summary]) {
            if (value.raw_values_retained !== false || value.fact_identity_retained !== false || value.sources_retained !== false || value.timestamps_retained !== false) process.exit(1);
          }
          const allowed = new Set([
            'check_status','policy_reusable','reuse_would_match_validation','observe_after_baseline',
            'baseline_ms','baseline_cost','check_ms','observe_ms','check_cost','observe_cost'
          ]);
          for (const record of ledger.records || []) {
            if (Object.keys(record).some((key) => !allowed.has(key))) process.exit(1);
          }
          NODE

      - name: Upload combined fleet v2 natural-workload evidence
        if: steps.restore.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fleet-wrapper-v2-natural-evaluation-${{ github.run_id }}
          path: |
            fleet-wrapper-natural-ledger.json
            fleet-wrapper-natural-summary.json
            fleet-wrapper-natural-benchmark.json
            fleet-wrapper-natural-evaluation.json
          if-no-files-found: warn
          retention-days: 30
