name: VTCode natural source geometry

on:
  pull_request:
    branches: [main]
    paths:
      - 'preregistration/PRIVATE297_VTCODE_HARNESS_SOURCE_GEOMETRY_V1.json'
      - 'scripts/run-private297-vtcode-source-geometry.py'
      - 'tests/private297-vtcode-source-geometry.test.py'
      - '.github/workflows/vtcode-source-geometry.yml'

permissions:
  contents: read

jobs:
  source-geometry:
    if: startsWith(github.head_ref, 'research/vtcode-natural-source-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Hub metadata client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==0.35.3'

      - name: Run frozen PRIVATE297 tests
        run: python tests/private297-vtcode-source-geometry.test.py

      - name: Execute preregistered VTCode source geometry gate
        shell: bash
        run: |
          python scripts/run-private297-vtcode-source-geometry.py \
            --work-dir "$RUNNER_TEMP/private297-vtcode" \
            --output private297-vtcode-source-geometry.json

      - name: Enforce aggregate-only PRIVATE297 report
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('private297-vtcode-source-geometry.json').read_text(encoding='utf-8'))
          if report.get('schema') != 'seenrelay-private297-vtcode-harness-source-geometry-v1':
              raise SystemExit('schema mismatch')
          source = report.get('source', {})
          if source.get('dataset') != 'vinhnx90/vtcode-sessions':
              raise SystemExit('dataset mismatch')
          if source.get('resolved_revision') != '78049282e2b4fddb2a6d93a0a0e4784a7bd05fc1':
              raise SystemExit('revision mismatch')
          if source.get('dataset_card_license_mit_confirmed') is not True:
              raise SystemExit('license declaration was not confirmed')
          if source.get('dataset_card_local_workspace_collection_confirmed') is not True:
              raise SystemExit('provenance declaration was not confirmed')

          geometry = report.get('geometry', {})
          if geometry.get('data_files') != 100 or geometry.get('data_logical_bytes') != 21468595:
              raise SystemExit('frozen dataset-card geometry mismatch')

          h = report.get('harness_identity', {})
          required_ints = [
              'harness_files', 'valid_harness_wrappers', 'nonempty_native_thread_ids',
              'unique_native_thread_ids', 'duplicate_native_thread_id_groups',
              'duplicate_native_thread_id_extra_files', 'unique_full_file_contents',
              'exact_full_file_content_duplicate_groups', 'exact_full_file_content_duplicate_extra_files'
          ]
          for key in required_ints:
              if not isinstance(h.get(key), int) or h[key] < 0:
                  raise SystemExit(f'invalid aggregate integer: {key}')

          admissible = (
              h['harness_files'] >= 2
              and h['valid_harness_wrappers'] == h['harness_files']
              and h['nonempty_native_thread_ids'] == h['harness_files']
              and h['unique_native_thread_ids'] == h['harness_files']
              and h['duplicate_native_thread_id_groups'] == 0
              and h['exact_full_file_content_duplicate_groups'] == 0
          )
          expected = (
              'SOURCE_IDENTITY_ADMISSIBLE_FOR_COUNT_ONLY_FOLLOWUP'
              if admissible else 'SOURCE_IDENTITY_NOT_ADMISSIBLE'
          )
          decision = report.get('decision', {})
          if decision.get('classification') != expected:
              raise SystemExit('classification mismatch')
          if decision.get('browser_tool_count_authorized') is not admissible:
              raise SystemExit('count-only authorization mismatch')
          if decision.get('overlap_authorized') is not False:
              raise SystemExit('overlap must remain unauthorized')

          ingestion = report.get('ingestion', {})
          if not ingestion or any(value is not False for value in ingestion.values()):
              raise SystemExit('forbidden content analysis was enabled')
          privacy = report.get('privacy', {})
          if not privacy or any(value is not False for value in privacy.values()):
              raise SystemExit('raw data retention flag is not false')
          interpretation = report.get('interpretation', {})
          if not interpretation or any(value is not False for value in interpretation.values()):
              raise SystemExit('unauthorized interpretation flag is not false')

          forbidden_exact_keys = {
              'thread_id', 'thread_ids', 'file_path', 'file_paths', 'raw_path', 'raw_paths',
              'tool_name', 'tool_names', 'tool_arguments', 'tool_results', 'url', 'urls',
              'query', 'queries', 'operation_key', 'operation_keys'
          }
          def walk(value):
              if isinstance(value, list):
                  for item in value:
                      walk(item)
              elif isinstance(value, dict):
                  for key, child in value.items():
                      if key in forbidden_exact_keys:
                          raise SystemExit(f'forbidden raw/content key in report: {key}')
                      walk(child)
          walk(report)
          PY

      - name: Delete transient external files before artifact upload
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/private297-vtcode"

      - name: Upload aggregate source geometry only
        uses: actions/upload-artifact@v4
        with:
          name: private297-vtcode-source-geometry
          path: private297-vtcode-source-geometry.json
          if-no-files-found: error
          retention-days: 14
