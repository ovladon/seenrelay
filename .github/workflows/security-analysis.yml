name: Security Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seenrelay-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit complete locked dependency set
        run: npm audit --audit-level=high
      - name: Probe GitHub dependency review API
        if: github.event_name == 'pull_request'
        id: dependency-api
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}"
          status="$(curl -sS -o /tmp/dependency-review-body.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$url")"
          echo "http_status=${status}" >> "$GITHUB_OUTPUT"
          if [ "$status" = "200" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" = "403" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub dependency-review API returned HTTP 403 for this public repository. Full locked-dependency audit still ran and passed; dependency-delta review is platform-unavailable for this run.'
          else
            echo "Unexpected dependency-review API status: ${status}" >&2
            jq -c '{message, documentation_url, status}' /tmp/dependency-review-body.json 2>/dev/null || true
            exit 1
          fi
      - name: Review dependency changes
        if: github.event_name == 'pull_request' && steps.dependency-api.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Record dependency review platform limitation
        if: github.event_name == 'pull_request' && steps.dependency-api.outputs.available == 'false'
        shell: bash
        run: |
          {
            echo '### Dependency review API unavailable'
            echo
            echo 'GitHub returned HTTP 403 for the dependency-diff endpoint on this public repository.'
            echo 'The complete locked dependency set was still audited at high severity in this job.'
          } >> "$GITHUB_STEP_SUMMARY"

  offline-backup-temp:
    name: Temporary Offline Source and DB Backup
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/offline-backup-2026-08-26'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact production source commit with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 37c5f15c409f6f9eec5b6d81cfb350e01f9faf5f
          fetch-depth: 0
          persist-credentials: false

      - name: Build verified offline Git artifacts
        shell: bash
        run: |
          set -euo pipefail
          SHA='37c5f15c409f6f9eec5b6d81cfb350e01f9faf5f'
          test "$(git rev-parse HEAD)" = "$SHA"
          mkdir -p /tmp/seenrelay-offline/source /tmp/seenrelay-offline/database
          git archive --format=tar.gz --prefix="seenrelay-source-${SHA}/" -o "/tmp/seenrelay-offline/source/seenrelay-source-${SHA}.tar.gz" "$SHA"
          git branch backup-main "$SHA"
          git bundle create "/tmp/seenrelay-offline/source/seenrelay-main-history-${SHA}.bundle" backup-main --tags
          git bundle verify "/tmp/seenrelay-offline/source/seenrelay-main-history-${SHA}.bundle"
          git ls-tree -r --full-tree "$SHA" > /tmp/seenrelay-offline/source/source-tree.txt
          git log --all --date=iso-strict --pretty='format:%H%x09%ad%x09%an%x09%s' > /tmp/seenrelay-offline/source/git-history.txt
          {
            echo "repository=ovladon/seenrelay"
            echo "commit=$SHA"
            echo "tree=$(git rev-parse "$SHA^{tree}")"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > /tmp/seenrelay-offline/source/SOURCE_IDENTITY.txt
          cd /tmp/seenrelay-offline/source
          sha256sum SOURCE_IDENTITY.txt git-history.txt source-tree.txt seenrelay-source-${SHA}.tar.gz seenrelay-main-history-${SHA}.bundle > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Produce native PostgreSQL dump from frozen Neon checkpoint when repository Neon integration is available
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/seenrelay-offline/database
          if [ -z "${NEON_API_KEY:-}" ]; then
            printf '%s\n' 'native_pg_dump=unavailable' 'reason=NEON_API_KEY repository secret is not available to this workflow' > "$out/DATABASE_BACKUP_STATUS.txt"
            exit 0
          fi

          if ! command -v pg_dump >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          api='https://console.neon.tech/api/v2/projects/jolly-rain-02207197/connection_uri?branch_id=br-sparkling-river-af1gcrbv&database_name=neondb&role_name=neondb_owner&pooled=false'
          response="$(curl -fsS -H 'Accept: application/json' -H "Authorization: Bearer ${NEON_API_KEY}" "$api")" || {
            printf '%s\n' 'native_pg_dump=unavailable' 'reason=Neon connection URI API request failed' > "$out/DATABASE_BACKUP_STATUS.txt"
            exit 0
          }
          uri="$(printf '%s' "$response" | jq -r '.uri // empty')"
          unset response
          if [ -z "$uri" ]; then
            printf '%s\n' 'native_pg_dump=unavailable' 'reason=Neon API did not return a connection URI' > "$out/DATABASE_BACKUP_STATUS.txt"
            exit 0
          fi

          pg_dump "$uri" --format=custom --no-owner --file="$out/seenrelay-neon-checkpoint.dump"
          pg_dump "$uri" --format=plain --no-owner --file="$out/seenrelay-neon-checkpoint.sql"
          pg_restore -l "$out/seenrelay-neon-checkpoint.dump" > "$out/pg_restore_toc.txt"
          unset uri
          printf '%s\n' 'native_pg_dump=available' 'source_branch=br-sparkling-river-af1gcrbv' 'database=neondb' > "$out/DATABASE_BACKUP_STATUS.txt"
          cd "$out"
          sha256sum seenrelay-neon-checkpoint.dump seenrelay-neon-checkpoint.sql pg_restore_toc.txt DATABASE_BACKUP_STATUS.txt > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Build artifact-level manifest
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/seenrelay-offline
          find . -type f -print0 | sort -z | xargs -0 sha256sum > ALL_SHA256SUMS

      - name: Upload offline recovery material
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: seenrelay-offline-recovery-material-37c5f15c
          path: /tmp/seenrelay-offline
          if-no-files-found: error
          retention-days: 1
