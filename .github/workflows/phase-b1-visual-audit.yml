name: Phase B1 Visual Audit

on:
  push:
    branches: [site/phase-b1-adoption-surface]
    paths: ['.github/workflows/phase-b1-visual-audit.yml']

permissions:
  contents: read
  issues: read

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: '118'
      AUDIT_REVISION: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: site/phase-b1-adoption-surface
      - name: Resolve and fetch protected preview
        shell: bash
        run: |
          set -euo pipefail
          url="$(node scripts/resolve-pr-preview-url.mjs)"
          curl -fsS -H "x-vercel-protection-bypass: $BYPASS_SECRET" -H 'accept: text/html' "$url/" -o /tmp/site.html
          curl -fsS -H "x-vercel-protection-bypass: $BYPASS_SECRET" "$url/site.css" -o /tmp/site.css
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/site.html')
          text = p.read_text()
          text = text.replace('href="/site.css"', 'href="file:///tmp/site.css"')
          text = text.replace('<script src="/site.js" defer></script>', '')
          p.write_text(text)
          PY
      - name: Capture desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,7600 --screenshot=phase-b1-desktop.png file:///tmp/site.html
          "$chrome" --headless --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=390,12000 --screenshot=phase-b1-mobile.png file:///tmp/site.html
          file phase-b1-desktop.png phase-b1-mobile.png
      - name: Upload visual audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase-b1-visual-audit-r2
          path: |
            phase-b1-desktop.png
            phase-b1-mobile.png
          if-no-files-found: error
          retention-days: 1
