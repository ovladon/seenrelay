name: Readiness Isolation Builder

on:
  push:
    branches:
      - infra/readiness-isolation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[readiness-builder]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: infra/readiness-isolation
          fetch-depth: 0
      - name: Apply exact deployment selection patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          needle = "import { ReadinessV2ActivationError, readinessV2ActivationState, runActivatedReadinessV2 } from './readiness-v2-activation.js';\n"
          addition = needle + "import readinessServiceApp from './readiness-service.js';\n"
          if "import readinessServiceApp from './readiness-service.js';" not in s:
              if needle not in s:
                  raise SystemExit('readiness activation import anchor missing')
              s = s.replace(needle, addition, 1)
          old = 'export default app;\n'
          new = "export default process.env.SEENRELAY_DEPLOYMENT_ROLE === 'readiness' ? readinessServiceApp : app;\n"
          if new not in s:
              if old not in s:
                  raise SystemExit('default export anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f src/readiness-admission-db.ts
          rm -f .github/workflows/readiness-isolation-builder.yml
      - name: Commit exact patch and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Wire readiness-only deployment boundary [readiness-builder]"
          git push origin HEAD:infra/readiness-isolation
