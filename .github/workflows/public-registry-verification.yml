name: Public Registry Verification

on:
  pull_request:
    paths:
      - 'public/product-facts.json'
      - '.github/workflows/public-registry-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read promoted public client version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./public/product-facts.json').install.client_version")"
          test -n "$VERSION"
          node -e "const v=process.argv[1]; if (!/^\\d+\\.\\d+\\.\\d+$/.test(v)) process.exit(1)" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify exact npm registry install, exports and self-contained repack
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "seenrelay@$VERSION" >/dev/null
          INSTALLED="$(node -p "require('./node_modules/seenrelay/package.json').version")"
          test "$INSTALLED" = "$VERSION"

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const packageJson = JSON.parse(fs.readFileSync('./node_modules/seenrelay/package.json', 'utf8'));
          const exportsMap = packageJson.exports || {};
          const forbidden = [
            './capabilities',
            './profiles',
            './catalog',
            './readiness',
            './vantage-assurance',
            './declarative-profile'
          ];
          for (const key of forbidden) {
            if (Object.hasOwn(exportsMap, key)) throw new Error(`obsolete dangling export remains public: ${key}`);
          }
          for (const key of Object.keys(exportsMap)) {
            const specifier = key === '.' ? packageJson.name : `${packageJson.name}/${key.slice(2)}`;
            await import(specifier);
          }
          NODE

          mkdir -p sample/jobs
          cat > sample/jobs/daily-search.ts <<'EOF'
          import { tavily } from '@tavily/core';
          const client = tavily({ apiKey: process.env.TAVILY_API_KEY });
          export async function scheduled() {
            return client.search("latest AI agent infrastructure releases");
          }
          EOF
          ./node_modules/.bin/seenrelay scan sample --json > scan.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('scan.json','utf8')); if(r.overall_status!=='CANDIDATE_FOR_SHADOW_MEASUREMENT'||r.root!=='.'||!r.disclaimer.includes('cannot produce a SeenRelay USE verdict')) process.exit(1)"

          cat > otlp.json <<'EOF'
          {
            "resourceSpans": [{
              "resource": {"attributes": [{"key":"service.instance.id","value":{"stringValue":"registry-smoke"}}]},
              "scopeSpans": [{"spans": [
                {
                  "spanId":"0000000000000001",
                  "startTimeUnixNano":"1000000000",
                  "endTimeUnixNano":"2000000000",
                  "attributes":[
                    {"key":"seenrelay.coordinate_hash","value":{"stringValue":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}},
                    {"key":"seenrelay.worker_id","value":{"stringValue":"w1"}},
                    {"key":"seenrelay.side_effect_class","value":{"stringValue":"read_only"}},
                    {"key":"seenrelay.exact_single_answer_shareable","value":{"boolValue":true}},
                    {"key":"seenrelay.independent_samples_required","value":{"boolValue":false}},
                    {"key":"seenrelay.outcome","value":{"stringValue":"success"}}
                  ]
                },
                {
                  "spanId":"0000000000000002",
                  "startTimeUnixNano":"1100000000",
                  "endTimeUnixNano":"1900000000",
                  "attributes":[
                    {"key":"seenrelay.coordinate_hash","value":{"stringValue":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}},
                    {"key":"seenrelay.worker_id","value":{"stringValue":"w2"}},
                    {"key":"seenrelay.side_effect_class","value":{"stringValue":"read_only"}},
                    {"key":"seenrelay.exact_single_answer_shareable","value":{"boolValue":true}},
                    {"key":"seenrelay.independent_samples_required","value":{"boolValue":false}},
                    {"key":"seenrelay.outcome","value":{"stringValue":"success"}}
                  ]
                }
              ]}]
            }]
          }
          EOF
          ./node_modules/.bin/seenrelay otel-trace-census otlp.json --json > otel-report.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('otel-report.json','utf8')); if(r.input_format!=='otlp-json'||r.observed_exact_overlap_starts!==1||r.actual_avoided_executions!==null) process.exit(1)"

          cat > langfuse-observations.json <<'EOF'
          {
            "data": [
              {
                "id": "tool-a",
                "traceId": "trace-a",
                "type": "TOOL",
                "name": "browser.read",
                "input": {"url":"https://example.com","mode":"rendered"},
                "startTime": "2026-09-29T10:00:00.000Z",
                "endTime": "2026-09-29T10:00:10.000Z",
                "totalCost": 0.3
              },
              {
                "id": "tool-b",
                "traceId": "trace-b",
                "type": "TOOL",
                "name": "browser.read",
                "input": {"mode":"rendered","url":"https://example.com"},
                "startTime": "2026-09-29T10:00:01.000Z",
                "endTime": "2026-09-29T10:00:09.000Z",
                "totalCost": 0.3
              }
            ]
          }
          EOF
          ./node_modules/.bin/seenrelay langfuse-census langfuse-observations.json --json > langfuse-report.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('langfuse-report.json','utf8')); if(r.input_format!=='langfuse-observations-export'||r.exact_repeat_starts!==1||r.exact_inflight_overlap_starts!==1||r.candidate_status!=='NEEDS_POLICY_REVIEW'||r.actual_avoided_executions!==null||r.actual_net_savings_usd!==null) process.exit(1)"

          cd "$TMP/node_modules/seenrelay"
          node ./scripts/assert-export-targets.mjs .
          npm pack --dry-run --json >/dev/null
          REPACK="$(npm pack --silent)"
          test -f "$REPACK"

      - name: Verify exact PyPI registry install
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/seenrelay-public-registry-verify
          /tmp/seenrelay-public-registry-verify/bin/python -m pip install --disable-pip-version-check --no-cache-dir "seenrelay==$VERSION" >/dev/null
          INSTALLED="$(/tmp/seenrelay-public-registry-verify/bin/python - <<'PY'
          from importlib.metadata import version
          print(version('seenrelay'))
          PY
          )"
          test "$INSTALLED" = "$VERSION"
          /tmp/seenrelay-public-registry-verify/bin/python - <<'PY'
          from seenrelay import SeenRelayClient
          from seenrelay_shadow import SeenRelayShadowProof
          from seenrelay_easy import protect_validation
          from seenrelay_assurance import assess_shared_check_evidence, multi_signal_retained_reuse_policy
          from seenrelay_coordinates import json_pointer_fact, element_id_fact, source_key_fact, mcp_tool_coordinate, openapi_operation_coordinate
          from seenrelay_zero_state import SeenRelayZeroState, fresh_result
          assert SeenRelayClient is not None and SeenRelayShadowProof is not None
          assert callable(protect_validation)
          assert callable(assess_shared_check_evidence) and callable(multi_signal_retained_reuse_policy)
          assert callable(json_pointer_fact) and callable(element_id_fact) and callable(source_key_fact)
          assert callable(mcp_tool_coordinate) and callable(openapi_operation_coordinate)
          assert callable(SeenRelayZeroState) and callable(fresh_result)
          PY
