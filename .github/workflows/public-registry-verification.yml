name: Public Registry Verification

on:
  pull_request:
    paths:
      - 'public/product-facts.json'
      - '.github/workflows/public-registry-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read staged client release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < clients/RELEASE_VERSION)"
          test -n "$VERSION"
          node -e "const v=process.argv[1]; if (!/^\\d+\\.\\d+\\.\\d+$/.test(v)) process.exit(1)" "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify exact npm registry install
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "seenrelay@$VERSION" >/dev/null
          INSTALLED="$(node -p "require('./node_modules/seenrelay/package.json').version")"
          test "$INSTALLED" = "$VERSION"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { SeenRelayClient } from 'seenrelay';
          import { SeenRelayShadowProof } from 'seenrelay/shadow-proof';
          import { createFirecrawlSdkShadowPilot } from 'seenrelay/firecrawl-sdk-shadow';
          const packageJson = JSON.parse(fs.readFileSync('./node_modules/seenrelay/package.json', 'utf8'));
          for (const key of Object.keys(packageJson.exports || {})) {
            const specifier = key === '.' ? packageJson.name : `${packageJson.name}/${key.slice(2)}`;
            await import(specifier);
          }
          if (
            typeof SeenRelayClient !== 'function' ||
            typeof SeenRelayShadowProof !== 'function' ||
            typeof createFirecrawlSdkShadowPilot !== 'function'
          ) process.exit(1);
          const forbidden = ['./capabilities','./profiles','./catalog','./readiness','./vantage-assurance','./declarative-profile'];
          for (const key of forbidden) if (Object.hasOwn(packageJson.exports || {}, key)) process.exit(1);
          NODE

      - name: Verify exact PyPI registry install
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/seenrelay-public-registry-verify
          /tmp/seenrelay-public-registry-verify/bin/python -m pip install --disable-pip-version-check --no-cache-dir "seenrelay==$VERSION" >/dev/null
          INSTALLED="$(/tmp/seenrelay-public-registry-verify/bin/python - <<'PY'
          from importlib.metadata import version
          print(version('seenrelay'))
          PY
          )"
          test "$INSTALLED" = "$VERSION"
          /tmp/seenrelay-public-registry-verify/bin/python - <<'PY'
          from seenrelay import SeenRelayClient
          from seenrelay_shadow import SeenRelayShadowProof
          assert SeenRelayClient is not None and SeenRelayShadowProof is not None
          PY
