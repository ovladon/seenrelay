name: Temporary Public Sync Artifact

on:
  push:
    branches:
      - release/promote-clients-0.2.13

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generate canonical public surfaces
        run: node scripts/sync-public-surfaces.mjs --write
      - name: Upload generated public surfaces
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-sync-generated
          path: |
            src/public-facts.generated.ts
            README.md
            clients/README.md
            docs/QUICKSTART.md
            docs/VERIFIED_RESULTS.md
          if-no-files-found: error
          retention-days: 1
