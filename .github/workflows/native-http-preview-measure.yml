name: Frozen Preview HTTP measurement

on:
  push:
    branches:
      - verify/native-http-fixture-v1

permissions:
  contents: read

concurrency:
  group: seenrelay-frozen-preview-http-measurement
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TARGET_PREVIEW_SHA: 8d22778ccc73dcfdd5acbdbba655e924546f02fb
      MEASUREMENT_OUTPUT: native-http-stage0-measurement.json
    steps:
      - name: Checkout verification commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Check probe syntax
        run: node --check scripts/native-http-preview-measure.mjs

      - name: Measure frozen Preview
        run: node scripts/native-http-preview-measure.mjs

      - name: Upload sanitized measurement artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-http-stage0-${{ github.run_id }}
          path: native-http-stage0-measurement.json
          if-no-files-found: error
          retention-days: 30
