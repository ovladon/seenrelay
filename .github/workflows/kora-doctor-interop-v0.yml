name: KORA Doctor Interop Synthetic v0
on:
  pull_request:
    paths:
      - 'examples/kora-doctor-interop-v0/**'
      - '.github/workflows/kora-doctor-interop-v0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout SeenRelay fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Generate privacy-preserving AUDR fixture and test expected verdicts
        run: |
          cd examples/kora-doctor-interop-v0
          python3 generate_fixture.py
          node --test test.mjs
          node classify.mjs fixture.audr.jsonl > /tmp/sr-kora-admission.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/sr-kora-admission.json'))
          assert len(x['decisions'])==16
          assert x['summary']['SHADOW_CANDIDATE']==1
          assert all(not d['auto_reuse_authorized'] and d['verified_saved_usd'] is None for d in x['decisions'])
          print('SeenRelay advisory synthetic comparator: PASS')
          PY
      - name: Verify actual pinned KORA Doctor CLI parses same AUDR fixture
        run: |
          set -eu
          git clone -q --filter=blob:none --no-checkout https://github.com/Krako-Labs/kora-doctor.git /tmp/kora-doctor
          git -C /tmp/kora-doctor checkout --detach 986f2d44bb8f74aa9e83839e66118884fe446627
          PYTHONPATH=/tmp/kora-doctor python3 -m kora_doctor audit examples/kora-doctor-interop-v0/fixture.audr.jsonl --json > /tmp/kora-audit.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/kora-audit.json'))
          assert r['records']==32, r
          assert r['tool_calls']==32, r
          assert r['runs']==16, r
          assert r['category_counts'].get('repeated_tool_retrieval',0)>0, r
          print('KORA Doctor v0.1.10 pinned commit: AUDR PARSE PASS')
          print('KORA repeated candidate records:',r['category_counts']['repeated_tool_retrieval'])
          PY
      - name: Reconcile all 16 KORA/SeenRelay scenario IDs and explanations
        run: |
          node examples/kora-doctor-interop-v0/compare-16.mjs /tmp/kora-audit.json /tmp/sr-kora-admission.json /tmp
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/comparison-16.json'))
          assert len(x['rows'])==16
          assert sum(r['kora_repeated_read_candidate'] for r in x['rows'])==15
          assert sum(r['seenrelay_advisory_decision']=='SHADOW_CANDIDATE' for r in x['rows'])==1
          assert all(r['kora_reason'] and r['seenrelay_reason_code'] and r['explanation'] for r in x['rows'])
          assert all(r['auto_reuse_authorized'] is False and r['verified_saved_usd'] is None for r in x['rows'])
          print('Per-scenario contract/reason cross-check: PASS')
          PY
          cat /tmp/comparison-16.md
      - name: Publish strictly synthetic 16-case comparison artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kora-seenrelay-offline-comparison-v0
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/comparison-16.json
            /tmp/comparison-16.md

