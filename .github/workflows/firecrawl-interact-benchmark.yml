name: Firecrawl Interact Benchmark

on:
  pull_request:
    paths:
      - 'scripts/benchmark-firecrawl-interact.mjs'
      - 'scripts/run-firecrawl-interact-benchmark-fresh.mjs'
      - 'scripts/benchmark-evidence.mjs'
      - 'scripts/propose-benchmark-evidence.sh'
      - '.github/workflows/firecrawl-interact-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact benchmark commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Run bounded keyless Firecrawl Interact benchmark from a fresh scrape
        run: node scripts/run-firecrawl-interact-benchmark-fresh.mjs
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: firecrawl-interact-benchmark
          path: |
            firecrawl-interact-benchmark.json
            benchmark-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Propose verified benchmark evidence
        if: github.event_name == 'workflow_dispatch' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/propose-benchmark-evidence.sh benchmark-evidence.json
