name: Bootstrap Discovery Fence Fix

on:
  push:
    branches:
      - adoption/discovery-surface-alignment
    paths:
      - .github/workflows/bootstrap-discovery-fence-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adoption/discovery-surface-alignment
      - name: Fix README command fences
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          t=p.read_text()
          old_js='''JavaScript / TypeScript:\n\n```js\nnpm install seenrelay\n\nimport { ambientMcpClient } from 'seenrelay/ambient';'''
          new_js='''JavaScript / TypeScript:\n\n```bash\nnpm install seenrelay\n```\n\n```js\nimport { ambientMcpClient } from 'seenrelay/ambient';'''
          old_py='''Python:\n\n```python\npip install seenrelay\n\nfrom seenrelay_ambient import ambient_mcp_client'''
          new_py='''Python:\n\n```bash\npip install seenrelay\n```\n\n```python\nfrom seenrelay_ambient import ambient_mcp_client'''
          if old_js not in t or old_py not in t:
              raise SystemExit('README first-proof command anchors not found')
          t=t.replace(old_js,new_js,1).replace(old_py,new_py,1)
          p.write_text(t)

          test=Path('tests/discovery-surface-alignment.test.mjs')
          s=test.read_text()
          anchor="  assert.match(t, /ambientMcpClient\\(rawMcpClient\\)/);\n"
          addition="  assert.match(t, /```bash\\nnpm install seenrelay\\n```/);\n  assert.match(t, /```bash\\npip install seenrelay\\n```/);\n"
          if anchor not in s:
              raise SystemExit('test anchor not found')
          s=s.replace(anchor,addition+anchor,1)
          test.write_text(s)
          PY
          git config user.name 'SeenRelay CI'
          git config user.email 'actions@users.noreply.github.com'
          git add README.md tests/discovery-surface-alignment.test.mjs
          git diff --cached --check
          git commit -m 'Keep discovery quickstart commands copy-ready'
          git push origin HEAD:adoption/discovery-surface-alignment
