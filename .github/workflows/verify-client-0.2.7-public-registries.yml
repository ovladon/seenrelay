name: Verify SeenRelay client 0.2.7 public registries

on:
  push:
    branches:
      - verify/client-0.2.7-public-registries

permissions:
  contents: read

jobs:
  verify-public-registries:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify exact npm 0.2.7 clean install
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund 'seenrelay@0.2.7' >/dev/null
          test "$(node -p "require('./node_modules/seenrelay/package.json').version")" = '0.2.7'
          node --input-type=module - <<'NODE'
          import { SeenRelayClient } from 'seenrelay';
          import { SeenRelayShadowProof } from 'seenrelay/shadow-proof';
          import * as ambient from 'seenrelay/ambient';
          if (typeof SeenRelayClient !== 'function' || typeof SeenRelayShadowProof !== 'function') process.exit(1);
          if (!ambient || Object.keys(ambient).length === 0) process.exit(1);
          NODE

      - name: Verify exact PyPI 0.2.7 clean install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/seenrelay-027-public-verify
          /tmp/seenrelay-027-public-verify/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'seenrelay==0.2.7' >/dev/null
          test "$(/tmp/seenrelay-027-public-verify/bin/python - <<'PY'
          from importlib.metadata import version
          print(version('seenrelay'))
          PY
          )" = '0.2.7'
          /tmp/seenrelay-027-public-verify/bin/python - <<'PY'
          from seenrelay import SeenRelayClient
          from seenrelay_shadow import SeenRelayShadowProof
          import seenrelay_ambient
          assert SeenRelayClient is not None
          assert SeenRelayShadowProof is not None
          assert seenrelay_ambient is not None
          PY
