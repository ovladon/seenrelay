name: Apply site SOTA revamp v2
on:
  push:
    branches: [site/sota-2027-clarity]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/sota-2027-clarity
      - name: Apply and verify bounded site revamp
        shell: bash
        run: |
          set -euo pipefail
          cat > public/sota.css <<'CSS'
          /* Accessibility and responsive navigation layer for SeenRelay's revamp pages. */
          .rv-skip{position:fixed;left:16px;top:10px;z-index:1000;padding:10px 14px;border:1px solid #536171;border-radius:10px;background:#f1f5f8;color:#07090c;font-size:13px;font-weight:800;transform:translateY(-160%);transition:transform .12s ease}.rv-skip:focus{transform:translateY(0)}
          .rv-mobile-nav{display:none;position:relative;margin-left:auto}.rv-mobile-nav summary{list-style:none;display:flex;align-items:center;justify-content:center;min-width:68px;min-height:44px;padding:0 12px;border:1px solid #34404c;border-radius:11px;background:#0d1218;color:#dce3ea;cursor:pointer;font-size:12px;font-weight:800}.rv-mobile-nav summary::-webkit-details-marker{display:none}.rv-mobile-nav[open] summary{border-color:#536171;background:#111821}.rv-mobile-nav nav{position:absolute;right:0;top:calc(100% + 10px);width:min(82vw,320px);padding:8px;border:1px solid #34404c;border-radius:14px;background:#0b1016;box-shadow:0 22px 60px rgba(0,0,0,.55)}.rv-mobile-nav nav a{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:9px;color:#c5ced8;font-size:13px}.rv-mobile-nav nav a:hover,.rv-mobile-nav nav a:focus-visible{background:#151d26;color:#fff}.rv-mobile-nav summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.rv-button{min-height:44px}.rv-footer,.rv-evidence-card footer,.rv-path-card .rv-number{color:#8b98a8}.rv-step h3{margin:1px 0 7px;font-size:14px;line-height:1.45;color:#e5ebf1}
          @media(max-width:1020px){.rv-mobile-nav{display:block}.rv-nav{gap:12px}.rv-nav-actions{flex:0 0 auto}}
          @media(max-width:680px){.rv-nav-actions{display:none}.rv-mobile-nav{margin-left:auto}.rv-brand{flex:0 1 auto}}
          @media(prefers-reduced-motion:reduce){.rv-skip{transition:none}}
          CSS
          python3 <<'PY'
          from pathlib import Path
          head_meta='<meta name="theme-color" content="#080a0e">\n<meta name="color-scheme" content="dark">\n<link rel="icon" href="/seenrelay-logo.svg" type="image/svg+xml">'

          p=Path('src/landing.ts'); s=p.read_text()
          old='<link rel="canonical" href="${origin}/">\n<link rel="alternate" type="application/json" href="${origin}/service.json" title="SeenRelay machine descriptor">\n<link rel="alternate" type="application/json" href="${origin}/product-facts.json" title="SeenRelay verified product facts">\n<link rel="alternate" type="application/json" href="${origin}/.well-known/agent-skills/index.json" title="SeenRelay Agent Skill discovery">'
          new='<link rel="canonical" href="${origin}/">\n<link rel="service-desc" type="application/json" href="${origin}/service.json" title="SeenRelay machine descriptor">\n<link rel="service-desc" type="application/json" href="${origin}/openapi.json" title="SeenRelay OpenAPI description">\n<link rel="service-meta" type="application/json" href="${origin}/product-facts.json" title="SeenRelay verified product facts">\n<link rel="service-doc" href="${origin}/quickstart" title="SeenRelay integration documentation">\n<link rel="alternate" type="application/json" href="${origin}/.well-known/agent-skills/index.json" title="SeenRelay Agent Skill discovery">\n'+head_meta
          if old not in s: raise SystemExit('landing discovery marker missing')
          s=s.replace(old,new,1)
          s=s.replace('<link rel="stylesheet" href="/revamp.css">','<link rel="stylesheet" href="/revamp.css">\n<link rel="stylesheet" href="/sota.css">',1)
          s=s.replace('<body class="revamp">\n<header class="rv-nav">','<body class="revamp">\n<a class="rv-skip" href="#main-content">Skip to content</a>\n<header class="rv-nav">',1)
          nav='  <nav class="rv-nav-links" aria-label="Primary navigation">\n    <a href="/readiness">Check a site</a>\n    <a href="#audit">Audit a workload</a>\n    <a href="/fleet">Fleet reuse</a>\n    <a href="#tests">Evidence</a>\n    <a href="/quickstart">Docs</a>\n  </nav>'
          mobile=nav+'\n  <details class="rv-mobile-nav">\n    <summary>Menu</summary>\n    <nav aria-label="Mobile navigation"><a href="/readiness">Check a site</a><a href="#audit">Audit a workload</a><a href="/fleet">Fleet reuse</a><a href="#tests">Evidence</a><a href="/quickstart">Docs</a><a href="/service.json">Machine JSON</a><a href="/.well-known/agent-skills/index.json">Agent Skills</a></nav>\n  </details>'
          if nav not in s: raise SystemExit('landing nav marker missing')
          s=s.replace(nav,mobile,1).replace('<main>','<main id="main-content">',1)
          hero='<h1>Make repeated AI visits cheaper before you add another layer.</h1>\n    <p class="rv-lead">SeenRelay gives you two evidence-first starting points. Site and API owners can check whether public AI visits already have efficient native freshness and discovery. Agent builders can measure whether a real fleet is repeating expensive read-only validation. Native controls win whenever they solve the same problem better.</p>'
          hero2='<h1>Reduce repeated AI validation without weakening the authoritative source.</h1>\n    <p class="rv-lead">Start with evidence, not installation. If you own a site or API, check whether native HTTP and machine-readable signals already make repeat visits efficient. If you run agents, measure real repeated read-only validation with every authoritative call still enabled. Native controls win whenever they solve the same problem better.</p>'
          if hero not in s: raise SystemExit('landing hero marker missing')
          s=s.replace(hero,hero2,1).replace('<span>authoritative calls stay on</span>\n      <span>npm + PyPI verified</span>','<span>authoritative calls stay on</span>\n      <span>no truth verdict</span>\n      <span>npm + PyPI verified</span>',1)
          demo='<div class="rv-demo-head"><span>start here</span><b>choose the evidence you need</b></div>\n    <div class="rv-flow-list">\n      <div><span>1</span><p><b>Own a public site?</b><small>Check the native HTTP and machine-facing surface first. Fix standards-native gaps before considering another reuse layer.</small></p></div>\n      <div><span>2</span><p><b>Run an agent workload?</b><small>Keep the real workload unchanged and measure exact repeated validation, stronger controls and prospective economics.</small></p></div>\n      <div><span>3</span><p><b>Only connect the paths when justified</b><small>A surface scan never establishes SeenRelay workload fit. A workload audit can recommend USE, DO NOT USE or INSUFFICIENT EVIDENCE.</small></p></div>\n    </div>'
          demo2='<div class="rv-demo-head"><span>evidence before integration</span><b>three bounded outcomes</b></div>\n    <div class="rv-flow-list">\n      <div><span>1</span><p><b>Public surface</b><small>Determine whether native HTTP and machine discovery are already sufficient, need a native fix, or require workload evidence.</small></p></div>\n      <div><span>2</span><p><b>Real workload</b><small>Measure recurrence and stronger controls, then return USE, DO NOT USE or INSUFFICIENT EVIDENCE.</small></p></div>\n      <div><span>3</span><p><b>Narrow integration only</b><small>A surface scan never establishes SeenRelay workload fit. Integrate only the measured eligible path; leave everything else unchanged.</small></p></div>\n    </div>'
          if demo not in s: raise SystemExit('landing mechanism marker missing')
          p.write_text(s.replace(demo,demo2,1))

          pages={'src/quickstart.ts':('/quickstart',[('Home','/'),('Fleet','/fleet'),('Integrations','/clients'),('Evidence','/economics'),('Trust','/trust'),('OpenAPI','/openapi.json')]),'src/fleet.ts':('/fleet',[('Home','/'),('Fleet','/fleet'),('Quickstart','/quickstart'),('Integrations','/clients'),('Trust','/trust')]),'src/integrations.ts':('/clients',[('Home','/'),('Fleet','/fleet'),('Quickstart','/quickstart'),('Evidence','/economics'),('Trust','/trust')])}
          for path,(route,links) in pages.items():
              p=Path(path); s=p.read_text(); lines=s.splitlines(); out=[]; inserted=False
              canonical='<link rel="canonical" href="${origin}'+route+'">'
              for line in lines:
                  out.append(line)
                  if not inserted and line.startswith('<meta name="description"'):
                      if canonical not in s: out.append(canonical)
                      out.extend(head_meta.splitlines()); inserted=True
              s='\n'.join(out)+'\n'
              s=s.replace('<link rel="stylesheet" href="/revamp.css">','<link rel="stylesheet" href="/revamp.css">\n<link rel="stylesheet" href="/sota.css">',1).replace('<body class="revamp">\n<header class="rv-nav">','<body class="revamp">\n<a class="rv-skip" href="#main-content">Skip to content</a>\n<header class="rv-nav">',1).replace('<nav class="rv-nav-links">','<nav class="rv-nav-links" aria-label="Primary navigation">',1)
              mobile='<details class="rv-mobile-nav">\n    <summary>Menu</summary>\n    <nav aria-label="Mobile navigation">'+''.join('<a href="'+href+'">'+label+'</a>' for label,href in links)+'<a href="/service.json">Machine JSON</a><a href="/.well-known/agent-skills/index.json">Agent Skills</a></nav>\n  </details>\n  '
              s=s.replace('<div class="rv-nav-actions">',mobile+'<div class="rv-nav-actions">',1).replace('<main>','<main id="main-content">',1)
              p.write_text(s)

          p=Path('src/readiness.ts'); s=p.read_text()
          s=s.replace('<link rel="canonical" href="${esc(origin)}/readiness">','<link rel="canonical" href="${esc(origin)}/readiness">\n'+head_meta,1).replace('<link rel="stylesheet" href="/revamp.css">','<link rel="stylesheet" href="/revamp.css">\n<link rel="stylesheet" href="/sota.css">',1).replace('<body class="revamp">\n<header class="rv-nav">','<body class="revamp">\n<a class="rv-skip" href="#main-content">Skip to content</a>\n<header class="rv-nav">',1)
          rnav='<nav class="rv-nav-links" aria-label="Primary navigation"><a href="#scan">Quick audit</a><a href="#scope">What it checks</a><a href="#full">Full owner audit</a><a href="/quickstart">Docs</a></nav>'
          if rnav not in s: raise SystemExit('readiness nav marker missing')
          s=s.replace(rnav,rnav+'\n  <details class="rv-mobile-nav"><summary>Menu</summary><nav aria-label="Mobile navigation"><a href="#scan">Quick audit</a><a href="#scope">What it checks</a><a href="#full">Full owner audit</a><a href="/quickstart">Docs</a><a href="/readiness.json">Readiness JSON</a><a href="/service.json">Service JSON</a></nav></details>',1).replace('<main>','<main id="main-content">',1)
          s=s.replace('<h4>Give your coding agent this audit task</h4>','<h3>Give your coding agent this audit task</h3>',1).replace('<h4>Accept a native answer</h4>','<h3>Accept a native answer</h3>',1).replace('<h4>Measure the residual workload</h4>','<h3>Measure the residual workload</h3>',1)
          p.write_text(s)

          p=Path('src/index.ts'); s=p.read_text(); marker='const app = new Hono();\n'
          helper='const app = new Hono();\n\nfunction publicDiscoveryLinks(origin: string): string {\n  return [\n    `<${origin}/service.json>; rel="service-desc"; type="application/json"`,\n    `<${origin}/openapi.json>; rel="service-desc"; type="application/json"`,\n    `<${origin}/product-facts.json>; rel="service-meta"; type="application/json"`,\n    `<${origin}/quickstart>; rel="service-doc"; type="text/html"`\n  ].join(\', \');\n}\n'
          if marker not in s: raise SystemExit('index app marker missing')
          s=s.replace(marker,helper,1).replace("  c.header('vary', 'Accept');\n  if (accept.includes('text/html')) {","  c.header('vary', 'Accept');\n  c.header('link', publicDiscoveryLinks(origin));\n  c.header('content-language', 'en');\n  if (accept.includes('text/html')) {",1)
          old="app.get('/service.json', (c) => {\n  c.header('cache-control', 'public, max-age=300');\n  return c.json(serviceDescriptor(new URL(c.req.url).origin));\n});"
          new="app.get('/service.json', (c) => {\n  const origin = new URL(c.req.url).origin;\n  c.header('cache-control', 'public, max-age=300');\n  c.header('link', publicDiscoveryLinks(origin));\n  c.header('content-language', 'en');\n  return c.json(serviceDescriptor(origin));\n});"
          if old not in s: raise SystemExit('service route marker missing')
          s=s.replace(old,new,1).replace("app.get('/robots.txt', (c) => {","app.get('/favicon.ico', (c) => c.redirect('/seenrelay-logo.svg', 308));\napp.get('/robots.txt', (c) => {",1).replace("script-src 'none'; style-src 'self'; img-src 'none'; object-src 'none'","script-src 'none'; style-src 'self'; img-src 'self'; object-src 'none'").replace("connect-src ${readinessConnectSrc(origin)}; img-src 'none'; object-src 'none'","connect-src ${readinessConnectSrc(origin)}; img-src 'self'; object-src 'none'",1)
          p.write_text(s)

          p=Path('src/adoption.ts'); s=p.read_text(); old='return `User-agent: *\\nAllow: /\\nDisallow: /admin\\nDisallow: /admin/\\nSitemap: ${origin}/sitemap.xml\\n`;'; new='return `User-agent: *\\nAllow: /\\nDisallow: /admin\\nDisallow: /admin/\\nDisallow: /internal\\nDisallow: /internal/\\nSitemap: ${origin}/sitemap.xml\\n`;'
          if old not in s: raise SystemExit('robots generator marker missing')
          p.write_text(s.replace(old,new,1)); Path('public/robots.txt').unlink()
          PY
          cat > tests/site-sota-2027.test.mjs <<'TEST'
          import test from 'node:test';import assert from 'node:assert/strict';import fs from 'node:fs';
          const read=p=>fs.readFileSync(new URL(`../${p}`,import.meta.url),'utf8');const landing=read('src/landing.ts'),readiness=read('src/readiness.ts'),quickstart=read('src/quickstart.ts'),fleet=read('src/fleet.ts'),integrations=read('src/integrations.ts'),index=read('src/index.ts'),adoption=read('src/adoption.ts'),css=read('public/sota.css');
          test('accessible responsive revamp chrome',()=>{for(const s of [landing,readiness,quickstart,fleet,integrations]){assert.match(s,/class="rv-skip" href="#main-content"/);assert.match(s,/<main id="main-content">/);assert.match(s,/class="rv-mobile-nav"/);assert.match(s,/<summary>Menu<\/summary>/);assert.match(s,/seenrelay-logo\.svg/);assert.match(s,/href="\/sota\.css"/)}assert.match(css,/min-height:44px/)});
          test('registered service discovery relations remain machine-readable',()=>{for(const rel of ['service-desc','service-meta','service-doc']){assert.match(index,new RegExp('rel="'+rel+'"'));assert.match(landing,new RegExp('rel="'+rel+'"'))}assert.match(index,/c\.header\('vary', 'Accept'\)/);assert.match(index,/c\.json\(serviceDescriptor\(origin\)\)/)});
          test('dynamic robots cannot be shadowed by static asset',()=>{assert.equal(fs.existsSync(new URL('../public/robots.txt',import.meta.url)),false);assert.match(adoption,/Disallow: \/admin/);assert.match(adoption,/Disallow: \/internal/);assert.match(adoption,/Sitemap: \${origin}\/sitemap\.xml/)});
          test('readiness headings stay sequential',()=>{assert.doesNotMatch(readiness,/<h4>/);assert.match(readiness,/<h3>Give your coding agent this audit task<\/h3>/)});
          test('first viewport states safe boundary',()=>{assert.match(landing,/Reduce repeated AI validation without weakening the authoritative source/);assert.match(landing,/Start with evidence, not installation/);assert.match(landing,/every authoritative call still enabled/i);assert.match(landing,/Native controls win whenever they solve the same problem better/i);assert.match(landing,/no truth verdict/i)});
          TEST
          node --test tests/*.test.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public src tests
          git commit -m 'Improve public site clarity and machine discovery'
          git push origin HEAD:site/sota-2027-clarity
