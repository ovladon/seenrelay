name: Readiness Preview Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/readiness.ts'
      - 'src/index.ts'
      - 'public/readiness.js'
      - 'public/readiness.css'
      - 'tests/readiness.test.ts'
      - '.github/workflows/readiness-preview-smoke.yml'

permissions:
  contents: read
  issues: read

concurrency:
  group: seenrelay-readiness-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Resolve exact Preview URL
        id: preview
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url="$(node scripts/resolve-pr-preview-url.mjs)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Probe readiness page and bounded audit behavior
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          common=(-H "x-vercel-protection-bypass: $BYPASS_SECRET")

          page="$(curl --fail --silent --show-error --location --retry 4 --retry-all-errors "${common[@]}" "$PREVIEW_URL/readiness")"
          grep -Fq 'How efficiently can AI agents revisit your site?' <<<"$page"
          grep -Fq 'exactly one read-only HTTPS GET' <<<"$page"
          grep -Fq 'never labels a site a SeenRelay candidate' <<<"$page"

          benign="$(curl --fail --silent --show-error --retry 2 "${common[@]}" \
            -H 'content-type: application/json' -H 'accept: application/json' \
            --data '{"site":"example.com"}' "$PREVIEW_URL/readiness/audit")"
          jq -e '.schema == "seenrelay-ai-visit-efficiency-quick-audit-v1"' <<<"$benign" >/dev/null
          jq -e '.scope == "single-root-response"' <<<"$benign" >/dev/null
          jq -e '.seenrelay_candidate == false' <<<"$benign" >/dev/null
          jq -e '.seenrelay_recommendation == "NOT_DETERMINED_BY_SURFACE_SCAN"' <<<"$benign" >/dev/null
          jq -e '.verdict == "NATIVE_READY" or .verdict == "NATIVE_FIX_RECOMMENDED" or .verdict == "NEEDS_WORKLOAD_EVIDENCE"' <<<"$benign" >/dev/null

          probe_rejected() {
            local payload="$1"
            local output="$RUNNER_TEMP/readiness-reject.json"
            local status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' "${common[@]}" \
              -H 'content-type: application/json' -H 'accept: application/json' \
              --data "$payload" "$PREVIEW_URL/readiness/audit")"
            test "$status" = '422'
            jq -e '.error.code == "AUDIT_UNAVAILABLE"' "$output" >/dev/null
          }

          probe_rejected '{"site":"https://127.0.0.1"}'
          probe_rejected '{"site":"https://example.com:8443"}'
          probe_rejected '{"site":"https://example.com/path"}'
          probe_rejected '{"site":"https://localhost"}'

          # Exercise the per-target admission ceiling without sending HTTPS traffic to a real site.
          # A unique .invalid hostname passes origin syntax, consumes the hashed target budget, then
          # fails at DNS for the first four requests. The fifth must be rejected by admission first.
          limit_host="readiness-${RELEASE_SHA:0:12}.invalid"
          for attempt in 1 2 3 4; do
            out="$RUNNER_TEMP/readiness-limit-${attempt}.json"
            status="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' "${common[@]}" \
              -H 'content-type: application/json' -H 'accept: application/json' \
              --data "{\"site\":\"$limit_host\"}" "$PREVIEW_URL/readiness/audit")"
            test "$status" = '422'
            jq -e '.error.code == "AUDIT_UNAVAILABLE"' "$out" >/dev/null
            if jq -e '.error.detail | test("limited number of readiness audits can target")' "$out" >/dev/null; then
              echo "target admission fired before attempt 5" >&2
              exit 1
            fi
          done
          limited="$RUNNER_TEMP/readiness-limit-5.json"
          status="$(curl --silent --show-error --output "$limited" --write-out '%{http_code}' "${common[@]}" \
            -H 'content-type: application/json' -H 'accept: application/json' \
            --data "{\"site\":\"$limit_host\"}" "$PREVIEW_URL/readiness/audit")"
          test "$status" = '422'
          jq -e '.error.code == "AUDIT_UNAVAILABLE"' "$limited" >/dev/null
          jq -e '.error.detail | test("limited number of readiness audits can target")' "$limited" >/dev/null
