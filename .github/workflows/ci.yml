name: CI

on:
  push:
    branches:
      - review/v0.3-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Restore prior CI fleet ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-fleet-ci
          previous_run="$(gh run list --workflow "$GITHUB_WORKFLOW" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$previous_run" ] && [ "$previous_run" != "$GITHUB_RUN_ID" ]; then
            gh run download "$previous_run" \
              --name "fleet-wrapper-shadow-ci-$previous_run" \
              --dir previous-fleet-ci >/dev/null 2>&1 || true
          fi
          if [ -f previous-fleet-ci/fleet-wrapper-shadow-ci-ledger.json ]; then
            echo "Restored CI fleet ledger from run $previous_run"
          else
            echo 'No compatible prior CI fleet ledger found; this run starts or restarts that role ledger.'
          fi

      - name: Run project checks with fleet target suite measured once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEENRELAY_ORIGIN: https://seenrelay.com
          SEENRELAY_FLEET_ROLE: ci
          SEENRELAY_FLEET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SEENRELAY_FLEET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          FLEET_SHADOW_PREVIOUS_LEDGER: previous-fleet-ci/fleet-wrapper-shadow-ci-ledger.json
          FLEET_SHADOW_PREFIX: fleet-wrapper-shadow-ci
        shell: bash
        run: |
          set -euo pipefail
          npm run public:sync:check
          npm run typecheck:core
          npm run typecheck:full
          npm run guardrails
          npm run audit:all
          node scripts/fleet-wrapper-shadow.mjs
          node scripts/run-structural-remainder.mjs
          npm run test:runtime

      - name: Verify sanitized CI fleet evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const measurement = JSON.parse(fs.readFileSync('fleet-wrapper-shadow-ci-measurement.json', 'utf8'));
          const ledger = JSON.parse(fs.readFileSync('fleet-wrapper-shadow-ci-ledger.json', 'utf8'));
          const summary = JSON.parse(fs.readFileSync('fleet-wrapper-shadow-ci-summary.json', 'utf8'));
          if (measurement.workload_class !== 'fleet_tool_validations' || measurement.first_party !== true || measurement.external_adoption_evidence !== false) process.exit(1);
          if (ledger.role !== 'ci' || ledger.workload_class !== 'fleet_tool_validations' || ledger.cost_unit !== 'github_actions_runner_ms') process.exit(1);
          if (summary.cumulative_protected_calls !== ledger.protected_calls) process.exit(1);
          if (ledger.protected_calls !== ledger.records.length + ledger.records_dropped) process.exit(1);
          for (const value of [measurement, ledger, summary]) {
            if (value.raw_values_retained !== false || value.fact_identity_retained !== false || value.sources_retained !== false || value.timestamps_retained !== false) process.exit(1);
          }
          const allowed = new Set([
            'check_status','policy_reusable','reuse_would_match_validation','observe_after_baseline',
            'baseline_ms','baseline_cost','check_ms','observe_ms','check_cost','observe_cost'
          ]);
          for (const record of ledger.records || []) {
            if (Object.keys(record).some((key) => !allowed.has(key))) process.exit(1);
          }
          if (measurement.provider_native_control?.hit === true && measurement.record !== null) process.exit(1);
          NODE

      - name: Upload CI fleet natural-workload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-wrapper-shadow-ci-${{ github.run_id }}
          path: |
            fleet-wrapper-shadow-ci-measurement.json
            fleet-wrapper-shadow-ci-ledger.json
            fleet-wrapper-shadow-ci-summary.json
            fleet-wrapper-shadow-ci-benchmark.json
            fleet-wrapper-shadow-ci-evaluation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=seenrelay-source.zip HEAD
          sha256sum seenrelay-source.zip > seenrelay-source.zip.sha256
      - name: Upload verified source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seenrelay-source-snapshot
          path: |
            seenrelay-source.zip
            seenrelay-source.zip.sha256
          if-no-files-found: error
          retention-days: 7
