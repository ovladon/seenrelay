name: CI

on:
  push:
    branches:
      - review/v0.3-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run project checks except fleet target structural tests
        run: |
          npm run public:sync:check
          npm run typecheck:core
          npm run typecheck:full
          npm run guardrails
          npm run audit:all
          node scripts/run-structural-remainder.mjs
          npm run test:runtime
      - name: Run natural fleet eligibility firewall
        env:
          SEENRELAY_FLEET_ROLE: ci
          SEENRELAY_FLEET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SEENRELAY_FLEET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          FLEET_SHADOW_PREFIX: fleet-wrapper-v2-shadow-ci
        run: node scripts/run-fleet-wrapper-natural.mjs
      - name: Upload fleet wrapper shadow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-wrapper-v2-shadow-ci
          path: |
            fleet-wrapper-v2-shadow-ci-measurement.json
            fleet-wrapper-v2-shadow-ci-ledger.json
            fleet-wrapper-v2-shadow-ci-summary.json
            fleet-wrapper-v2-shadow-ci-benchmark.json
            fleet-wrapper-v2-shadow-ci-evaluation.json
          if-no-files-found: warn
          retention-days: 90
      - name: Build verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=seenrelay-source.zip HEAD
          sha256sum seenrelay-source.zip > seenrelay-source.zip.sha256
      - name: Upload verified source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seenrelay-source-snapshot
          path: |
            seenrelay-source.zip
            seenrelay-source.zip.sha256
          if-no-files-found: error
          retention-days: 7
