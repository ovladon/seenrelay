name: Audit public site UX baseline
on:
  push:
    branches: [audit/site-ux-baseline]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/site-ux-baseline
      - name: Capture live public surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          curl -fsS -D audit/home.headers https://seenrelay.com/ -o audit/home.html
          curl -fsS -D audit/readiness.headers https://seenrelay.com/readiness -o audit/readiness.html
          curl -fsS https://seenrelay.com/service.json -o audit/service.json
          curl -fsS https://seenrelay.com/product-facts.json -o audit/product-facts.json
          curl -fsS https://seenrelay.com/llms.txt -o audit/llms.txt
          curl -fsS https://seenrelay.com/robots.txt -o audit/robots.txt
          curl -fsS https://seenrelay.com/.well-known/agent-skills/index.json -o audit/agent-skills.json
          {
            echo "chrome=$(command -v google-chrome || true)"
            echo "chromium=$(command -v chromium || true)"
            echo "lighthouse=$(command -v lighthouse || true)"
          } > audit/tools.txt
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1400 --screenshot=audit/home-desktop.png https://seenrelay.com/
            "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --screenshot=audit/home-mobile.png https://seenrelay.com/
            "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,1400 --screenshot=audit/readiness-desktop.png https://seenrelay.com/readiness
            "$CHROME" --headless --disable-gpu --no-sandbox --dump-dom https://seenrelay.com/ > audit/home-dom.html
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          html=Path('audit/home.html').read_text(errors='replace')
          summary={
            'bytes':len(html.encode()),
            'links':len(re.findall(r'<a\b',html,re.I)),
            'buttons':len(re.findall(r'<button\b',html,re.I)),
            'h1':len(re.findall(r'<h1\b',html,re.I)),
            'h2':len(re.findall(r'<h2\b',html,re.I)),
            'sections':len(re.findall(r'<section\b',html,re.I)),
            'scripts':len(re.findall(r'<script\b',html,re.I)),
            'stylesheets':len(re.findall(r'rel=["\']stylesheet["\']',html,re.I)),
            'has_skip_link':bool(re.search(r'skip',html,re.I)),
            'has_json_ld':bool(re.search(r'application/ld\+json',html,re.I)),
            'has_main':bool(re.search(r'<main\b',html,re.I)),
            'lang_en':bool(re.search(r'<html[^>]+lang=["\']en["\']',html,re.I)),
          }
          Path('audit/summary.json').write_text(json.dumps(summary,indent=2))
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-ux-baseline
          path: audit/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary audit workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/audit-site-ux-baseline.yml
          git commit -m 'Remove temporary public site audit workflow'
          git push origin HEAD:audit/site-ux-baseline
