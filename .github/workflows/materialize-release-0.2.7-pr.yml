name: Materialize SeenRelay 0.2.7 public candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.release-staging/**'
      - 'scripts/materialize-release-0.2.7.sh'
      - '.github/workflows/materialize-release-0.2.7-pr.yml'

permissions:
  contents: write

jobs:
  materialize-public-main-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize, verify and push final candidate
        run: bash scripts/materialize-release-0.2.7.sh
