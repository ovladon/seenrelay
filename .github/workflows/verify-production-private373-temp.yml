name: Verify PRIVATE373 Production SHA

on:
  push:
    branches:
      - ops/verify-production-private373

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public production health
        env:
          EXPECTED_SHA: 06405dc7efacbe6981b77383689af5e8a561acb9
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://seenrelay.com/healthz -o health.json
          cat health.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const actual = body.deployment_sha || body.deploymentSha || body.git_sha || body.sha;
          console.log(`deployment_sha=${actual ?? 'missing'}`);
          console.log(`expected_sha=${process.env.EXPECTED_SHA}`);
          if (actual !== process.env.EXPECTED_SHA) process.exit(2);
          NODE
      - name: Remove temporary verifier
        if: always()
        run: |
          git clone --depth 1 --branch ops/verify-production-private373 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} repo
          cd repo
          git config user.name 'Vlad Belciug'
          git config user.email '83345843+ovladon@users.noreply.github.com'
          git rm .github/workflows/verify-production-private373-temp.yml
          git commit -m 'Remove PRIVATE373 production verifier' || true
          git push origin HEAD:ops/verify-production-private373