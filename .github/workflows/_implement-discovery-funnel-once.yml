name: Implement Discovery Funnel Once

on:
  push:
    branches:
      - telemetry/discovery-funnel

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: telemetry/discovery-funnel
          fetch-depth: 0

      - name: Apply discovery funnel implementation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1))

          Path('migrations/0005_mcp_discovery_metrics.sql').write_text('''CREATE TABLE IF NOT EXISTS mcp_discovery_metrics_daily (\n  day date PRIMARY KEY,\n  initialize_requests integer NOT NULL DEFAULT 0 CHECK (initialize_requests >= 0),\n  tools_list_requests integer NOT NULL DEFAULT 0 CHECK (tools_list_requests >= 0),\n  initialize_first_at timestamptz,\n  initialize_last_at timestamptz,\n  tools_list_first_at timestamptz,\n  tools_list_last_at timestamptz\n);\n\nCOMMENT ON TABLE mcp_discovery_metrics_daily IS 'Aggregate MCP protocol-interest counters only; no request payloads, client identifiers, IPs, user agents, session IDs, or clientInfo are persisted.';\n''')

          Path('src/discovery.ts').write_text('''import { neon } from '@neondatabase/serverless';\n\nexport type McpDiscoveryEvent = 'initialize' | 'tools_list';\n\nfunction sql() {\n  const url = process.env.DATABASE_URL;\n  if (!url) throw new Error('DATABASE_URL is not configured');\n  return neon(url);\n}\n\nfunction methodEvent(value: unknown): McpDiscoveryEvent | null {\n  if (!value || typeof value !== 'object' || Array.isArray(value)) return null;\n  const method = (value as { method?: unknown }).method;\n  if (method === 'initialize') return 'initialize';\n  if (method === 'tools/list') return 'tools_list';\n  return null;\n}\n\n/**\n * Classify only the JSON-RPC method name needed for aggregate discovery telemetry.\n * No request body, clientInfo, headers, session identifier, IP, or user-agent is returned or stored.\n */\nexport async function classifyMcpDiscoveryRequest(request: Request): Promise<McpDiscoveryEvent[]> {\n  if (request.method !== 'POST') return [];\n  const contentType = (request.headers.get('content-type') || '').toLowerCase();\n  if (!contentType.includes('application/json')) return [];\n  try {\n    const body = await request.clone().json();\n    const messages = Array.isArray(body) ? body : [body];\n    return messages.map(methodEvent).filter((event): event is McpDiscoveryEvent => event !== null);\n  } catch {\n    return [];\n  }\n}\n\nexport async function recordMcpDiscoveryEvents(events: McpDiscoveryEvent[]): Promise<void> {\n  if (!events.length) return;\n  const initialize = events.filter((event) => event === 'initialize').length;\n  const toolsList = events.filter((event) => event === 'tools_list').length;\n  if (!initialize && !toolsList) return;\n  await sql().query(`INSERT INTO mcp_discovery_metrics_daily (\n      day, initialize_requests, tools_list_requests,\n      initialize_first_at, initialize_last_at, tools_list_first_at, tools_list_last_at\n    ) VALUES (\n      current_date, $1, $2,\n      CASE WHEN $1 > 0 THEN now() END, CASE WHEN $1 > 0 THEN now() END,\n      CASE WHEN $2 > 0 THEN now() END, CASE WHEN $2 > 0 THEN now() END\n    )\n    ON CONFLICT (day) DO UPDATE SET\n      initialize_requests = mcp_discovery_metrics_daily.initialize_requests + EXCLUDED.initialize_requests,\n      tools_list_requests = mcp_discovery_metrics_daily.tools_list_requests + EXCLUDED.tools_list_requests,\n      initialize_first_at = COALESCE(mcp_discovery_metrics_daily.initialize_first_at, EXCLUDED.initialize_first_at),\n      initialize_last_at = COALESCE(EXCLUDED.initialize_last_at, mcp_discovery_metrics_daily.initialize_last_at),\n      tools_list_first_at = COALESCE(mcp_discovery_metrics_daily.tools_list_first_at, EXCLUDED.tools_list_first_at),\n      tools_list_last_at = COALESCE(EXCLUDED.tools_list_last_at, mcp_discovery_metrics_daily.tools_list_last_at)`, [initialize, toolsList]);\n}\n\nexport async function getMcpDiscoverySnapshot() {\n  const rows = await sql().query(`SELECT\n    COALESCE(SUM(initialize_requests),0)::int AS initialize_total,\n    COALESCE(SUM(tools_list_requests),0)::int AS tools_list_total,\n    COALESCE(SUM(initialize_requests) FILTER (WHERE day = current_date),0)::int AS initialize_today,\n    COALESCE(SUM(tools_list_requests) FILTER (WHERE day = current_date),0)::int AS tools_list_today,\n    COALESCE(SUM(initialize_requests) FILTER (WHERE day >= current_date - 6),0)::int AS initialize_7d,\n    COALESCE(SUM(tools_list_requests) FILTER (WHERE day >= current_date - 6),0)::int AS tools_list_7d,\n    COALESCE(SUM(initialize_requests) FILTER (WHERE day >= date_trunc('month', current_date)::date),0)::int AS initialize_month,\n    COALESCE(SUM(tools_list_requests) FILTER (WHERE day >= date_trunc('month', current_date)::date),0)::int AS tools_list_month,\n    MIN(initialize_first_at)::text AS first_initialize_at,\n    MAX(initialize_last_at)::text AS last_initialize_at,\n    MIN(tools_list_first_at)::text AS first_tools_list_at,\n    MAX(tools_list_last_at)::text AS last_tools_list_at\n    FROM mcp_discovery_metrics_daily`);\n  return {\n    status: 'ok' as const,\n    classification: 'aggregate-protocol-interest-not-adoption',\n    summary: (rows as any[])[0] || {}\n  };\n}\n''')

          replace_once(
              'src/mcp.ts',
              "import { assertRuntimeFactAllowed } from './runtime-guard.js';\n",
              "import { assertRuntimeFactAllowed } from './runtime-guard.js';\nimport { classifyMcpDiscoveryRequest, recordMcpDiscoveryEvents } from './discovery.js';\n"
          )
          replace_once(
              'src/mcp.ts',
              "export async function handleMcp(request: Request): Promise<Response> { return handler.fetch(request); }\n",
              '''export async function handleMcp(request: Request): Promise<Response> {\n  const discoveryEvents = classifyMcpDiscoveryRequest(request);\n  const response = await handler.fetch(request);\n  if (response.status < 500) {\n    try {\n      const events = await discoveryEvents;\n      if (events.length) await recordMcpDiscoveryEvents(events);\n    } catch (error) {\n      console.error(JSON.stringify({ event: 'mcp_discovery_metric_error', error: error instanceof Error ? error.message : 'unknown' }));\n    }\n  }\n  return response;\n}\n'''
          )

          replace_once(
              'src/admin-db.ts',
              "import { privacyScopedHash } from './identity.js';\n",
              "import { privacyScopedHash } from './identity.js';\nimport { getMcpDiscoverySnapshot } from './discovery.js';\n"
          )
          replace_once(
              'src/admin-db.ts',
              "  return {\n    summary: (summary as any[])[0] || {},\n    active_leases: active,\n    metrics_daily: metrics,\n    recent_reuse: reuse,\n    top_contributors: top,\n    audit\n  };\n",
              "  let discovery;\n  try {\n    discovery = await getMcpDiscoverySnapshot();\n  } catch (error) {\n    console.error(JSON.stringify({ event: 'admin_discovery_snapshot_error', error: error instanceof Error ? error.message : 'unknown' }));\n    discovery = { status: 'unavailable' as const, classification: 'aggregate-protocol-interest-not-adoption', summary: {} };\n  }\n  return {\n    summary: (summary as any[])[0] || {},\n    active_leases: active,\n    metrics_daily: metrics,\n    recent_reuse: reuse,\n    top_contributors: top,\n    audit,\n    discovery\n  };\n"
          )

          replace_once(
              'src/admin.ts',
              '<link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/admin-v2.css">',
              '<link rel="stylesheet" href="/admin.css"><link rel="stylesheet" href="/admin-v2.css"><link rel="stylesheet" href="/admin-discovery.css">'
          )
          replace_once(
              'src/admin.ts',
              '<script src="/admin-v2.js" defer></script>',
              '<script src="/admin-discovery.js" defer></script><script src="/admin-v2.js" defer></script>'
          )

          Path('public/admin-discovery.css').write_text('''.discovery-funnel .discovery-head{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;margin-bottom:1rem}.discovery-funnel .discovery-head p{margin:0;max-width:48rem}.discovery-flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.75rem}.discovery-stage{position:relative;border:1px solid var(--line);border-radius:12px;padding:1rem;background:var(--panel-2)}.discovery-stage:not(:last-child)::after{content:'→';position:absolute;right:-.63rem;top:50%;transform:translateY(-50%);z-index:2;background:var(--panel);padding:.1rem;color:var(--muted)}.discovery-stage .stage-label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.discovery-stage strong{display:block;font-size:1.65rem;margin:.3rem 0}.discovery-stage small{display:block;color:var(--muted);line-height:1.35}.discovery-stage.adoption-boundary{border-style:dashed}.discovery-note{margin:.9rem 0 0;color:var(--muted);font-size:.82rem;line-height:1.45}.discovery-unavailable{padding:.8rem 1rem;border:1px solid var(--warn);border-radius:10px;color:var(--warn)}@media(max-width:900px){.discovery-flow{grid-template-columns:1fr}.discovery-stage:not(:last-child)::after{content:'↓';right:auto;left:50%;top:auto;bottom:-.72rem;transform:translateX(-50%)}}\n''')

          Path('public/admin-discovery.js').write_text('''(()=>{\n'use strict';\nconst nativeFetch=window.fetch.bind(window);\nconst fmt=n=>new Intl.NumberFormat().format(Number(n||0));\nfunction text(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=value;return e}\nfunction ensureCard(){\n  if(document.body.dataset.auth!=='1')return null;\n  let card=document.getElementById('discovery-funnel');\n  if(card)return card;\n  const grid=document.querySelector('.grid');if(!grid)return null;\n  card=document.createElement('section');card.id='discovery-funnel';card.className='card span-12 discovery-funnel';\n  const cards=grid.querySelectorAll(':scope > .card');grid.insertBefore(card,cards[4]||null);\n  return card;\n}\nfunction stage(label,value,detail,boundary=false){\n  const box=document.createElement('div');box.className='discovery-stage'+(boundary?' adoption-boundary':'');\n  box.append(text('span','stage-label',label),text('strong','',value),text('small','',detail));\n  return box;\n}\nfunction render(snapshot){\n  const card=ensureCard();if(!card)return;card.replaceChildren();\n  const d=snapshot?.data?.discovery||{status:'unavailable',summary:{}},ds=d.summary||{};\n  const adoption=snapshot?.adoption||{status:'unavailable',summary:{}},a=adoption.summary||{};\n  const head=document.createElement('div');head.className='discovery-head';\n  const title=document.createElement('div');title.append(text('h2','','Discovery funnel'),text('p','explain','Protocol interest → external usage → proven reuse.'));\n  head.append(title,text('span','badge','NOT ADOPTION UNTIL CHECK / OBSERVE'));card.append(head);\n  if(d.status!=='ok'){card.append(text('div','discovery-unavailable','Protocol-interest telemetry is unavailable. Adoption metrics remain classified independently.'));return}\n  const flow=document.createElement('div');flow.className='discovery-flow';\n  flow.append(\n    stage('MCP initialize',fmt(ds.initialize_month),`${fmt(ds.initialize_7d)} request events in 7d`),\n    stage('tools/list',fmt(ds.tools_list_month),`${fmt(ds.tools_list_7d)} request events in 7d`),\n    stage('External CHECK',adoption.status==='ok'?fmt(a.checks_external_month):'—','first domain-use stage',true),\n    stage('External OBSERVE',adoption.status==='ok'?fmt(a.observations_external):'—','retained external observations'),\n    stage('Qualified reuse',adoption.status==='ok'?fmt(a.reuse_external_month):'—','external reuse this month')\n  );\n  card.append(flow,text('p','discovery-note','initialize and tools/list are aggregate protocol request events, not unique agents and not adoption. Automated directory probes and operator diagnostics may be included. No request payload, clientInfo, IP, user-agent or MCP session identifier is persisted for these counters. The SeenRelay Reference Observer is never counted as external adoption.'));\n}\nwindow.fetch=async(...args)=>{\n  const response=await nativeFetch(...args);\n  try{\n    const raw=typeof args[0]==='string'?args[0]:args[0]?.url||'';\n    const url=new URL(raw,location.href);\n    if(url.origin===location.origin&&url.pathname==='/admin/snapshot'&&response.ok){response.clone().json().then(render).catch(()=>{});}\n  }catch{}\n  return response;\n};\n})();\n''')

          replace_once(
              'src/data-practices.ts',
              "      aggregate_metrics: ['CHECK/OBSERVE outcomes', 'useful reuse', 'lease counts']\n",
              "      aggregate_metrics: ['CHECK/OBSERVE outcomes', 'useful reuse', 'lease counts', 'MCP initialize/tools/list aggregate request counters']\n"
          )
          replace_once(
              'src/data-practices.ts',
              "    identity_processing: {\n",
              "    discovery_telemetry: {\n      stores: 'Daily aggregate counts of MCP initialize and tools/list request events only.',\n      does_not_store: ['MCP request payloads', 'clientInfo', 'raw IP address', 'raw user-agent', 'MCP session identifier'],\n      interpretation: 'Protocol-interest telemetry is not a unique-client count and is never classified as adoption; automated directory probes and operator diagnostics may be included.'\n    },\n    identity_processing: {\n"
          )

          replace_once('src/version.ts', "export const SERVICE_RELEASE = '0.3.6' as const;", "export const SERVICE_RELEASE = '0.3.7' as const;")
          replace_once('registry/server.json', '"version": "0.3.6"', '"version": "0.3.7"')
          replace_once('public/.well-known/mcp/server-card.json', '"version": "0.3.6"', '"version": "0.3.7"')

          changelog=Path('CHANGELOG.md')
          current=changelog.read_text()
          marker='# Changelog\n'
          entry='''\n## 0.3.7 — Discovery funnel telemetry\n\n- Add privacy-minimized aggregate MCP `initialize` and `tools/list` request counters.\n- Surface protocol interest separately from external CHECK, OBSERVE, and qualified reuse in the Control Room.\n- Keep discovery telemetry explicitly non-adoption and fail-open so telemetry cannot break MCP service.\n- Document that discovery counters persist no request payload, clientInfo, IP, user-agent, or MCP session identifier.\n'''
          if marker not in current:
              raise SystemExit('CHANGELOG.md: missing title marker')
          changelog.write_text(current.replace(marker, marker+entry, 1))

          Path('tests/discovery-funnel.test.mjs').write_text('''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst read=(path)=>fs.readFileSync(path,'utf8');\n\ntest('discovery funnel persists aggregate protocol-interest counters only',()=>{\n  const migration=read('migrations/0005_mcp_discovery_metrics.sql');\n  const source=read('src/discovery.ts');\n  assert.match(migration,/mcp_discovery_metrics_daily/);\n  assert.match(source,/method === 'initialize'/);\n  assert.match(source,/method === 'tools\\/list'/);\n  assert.match(source,/aggregate-protocol-interest-not-adoption/);\n  assert.doesNotMatch(migration,/client_info|user_agent|ip_address|session_id|payload/i);\n});\n\ntest('MCP discovery telemetry is fail-open and separate from adoption',()=>{\n  const mcp=read('src/mcp.ts');\n  const admin=read('src/admin-db.ts');\n  const ui=read('public/admin-discovery.js');\n  assert.match(mcp,/mcp_discovery_metric_error/);\n  assert.match(admin,/admin_discovery_snapshot_error/);\n  assert.match(ui,/not unique agents and not adoption/i);\n  assert.match(ui,/Reference Observer is never counted as external adoption/);\n});\n\ntest('Control Room loads discovery observer before the main admin script',()=>{\n  const admin=read('src/admin.ts');\n  const discovery=admin.indexOf('/admin-discovery.js');\n  const main=admin.indexOf('/admin-v2.js');\n  assert.ok(discovery>=0&&main>discovery);\n  assert.match(admin,/admin-discovery\\.css/);\n});\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate complete repository
        run: npm check

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migrations/0005_mcp_discovery_metrics.sql src/discovery.ts src/mcp.ts src/admin-db.ts src/admin.ts src/data-practices.ts src/version.ts registry/server.json public/.well-known/mcp/server-card.json public/admin-discovery.css public/admin-discovery.js tests/discovery-funnel.test.mjs CHANGELOG.md
          git commit -m 'Add privacy-minimized discovery funnel telemetry'
          git push origin HEAD:telemetry/discovery-funnel
