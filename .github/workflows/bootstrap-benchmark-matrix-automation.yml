name: Bootstrap Benchmark Matrix Automation

on:
  push:
    branches:
      - site/verified-benchmark-matrix-automation
    paths:
      - 'scripts/bootstrap-benchmark-matrix-v2.py'
      - '.github/workflows/bootstrap-benchmark-matrix-automation.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: site/verified-benchmark-matrix-automation
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply generic matrix and benchmark evidence publication changes
        run: |
          python3 scripts/bootstrap-benchmark-matrix-v2.py
          node scripts/sync-public-surfaces.mjs --write
          node scripts/benchmark-evidence.mjs
          npm run check
      - name: Commit resulting project changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/product-facts.json src/public-facts.generated.ts src/public-facts-view.ts public/site.css scripts/sync-public-surfaces.mjs scripts/benchmark-firecrawl-interact.mjs .github/workflows/firecrawl-interact-benchmark.yml docs/VERIFIED_RESULTS.md docs/BENCHMARK_EVIDENCE.md tests/economics-positioning.test.mjs tests/benchmark-matrix.test.mjs README.md clients/README.md docs/QUICKSTART.md
          git commit -m 'Automate verified benchmark matrix publication'
          git push origin HEAD:site/verified-benchmark-matrix-automation
