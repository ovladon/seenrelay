name: One-off Public Surface Sync

on:
  push:
    branches:
      - release/promote-client-0.2.14
    paths:
      - 'public/product-facts.json'
      - '.github/workflows/one-off-public-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/promote-client-0.2.14
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate canonical public surfaces
        run: npm run public:sync
      - name: Commit generated surfaces
        shell: bash
        run: |
          set -euo pipefail
          git add src/public-facts.generated.ts README.md clients/README.md docs/QUICKSTART.md docs/VERIFIED_RESULTS.md
          if git diff --cached --quiet; then
            echo 'No generated drift.'
            exit 0
          fi
          git config user.name 'SeenRelay release automation'
          git config user.email '83345843+ovladon@users.noreply.github.com'
          git commit -m 'Sync public client 0.2.14 surfaces'
          git push origin HEAD:release/promote-client-0.2.14
