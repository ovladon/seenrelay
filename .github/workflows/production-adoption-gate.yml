name: Production Adoption Gate

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/skills/**'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'shared/agent-skill.mjs'
      - 'src/index.ts'
      - 'src/admin-db.ts'
      - 'src/data-practices.ts'
      - 'src/landing.ts'
      - 'src/quickstart.ts'
      - 'src/public.ts'
      - 'src/version.ts'
      - 'public/product-facts.json'
      - 'public/revamp.js'
      - 'public/revamp.css'
      - 'public/revamp-factual.css'
      - 'public/sota.css'
      - 'public/funnel.css'
      - 'clients/**'
      - 'plugin.json'
      - 'mcp.json'
      - 'gemini-extension.json'
      - 'registry/**'
      - 'docs/SHADOW_AUDIT.md'
      - 'docs/schemas/**'
      - 'examples/shadow-audit-report.example.json'
      - '.github/workflows/production-adoption-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install-path:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Use Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Classify Production deployment applicability
        id: applicability
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            echo "release_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
            echo "release_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo 'Production deploy applicability could not be reconstructed; fail open to exact-deployment verification.'
            exit 0
          fi

          release_sha=''
          while IFS= read -r commit; do
            [ -n "$commit" ] || continue
            parent="$(git rev-parse "${commit}^1")"
            if ! VERCEL_GIT_PREVIOUS_SHA="$parent" VERCEL_GIT_COMMIT_SHA="$commit" bash scripts/vercel-ignore-main.sh; then
              release_sha="$commit"
            fi
          done < <(git rev-list --reverse --first-parent "${BEFORE_SHA}..${HEAD_SHA}")

          if [ -z "$release_sha" ]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'No commit in this push changes Production deployment inputs; verify the existing healthy Production deployment instead.'
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
            echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
            echo "Production deployment commit: $release_sha"
          fi

      - name: Wait for required Production commit
        if: steps.applicability.outputs.required == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.applicability.outputs.release_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' https://seenrelay.com/healthz || true)
            if [ "$status" = '200' ] \
              && jq -e --arg sha "$RELEASE_SHA" '.ok == true and .environment == "production" and .deployment_sha == $sha and .billing_enabled == false' "$RUNNER_TEMP/health.json" >/dev/null; then
              echo "Production is serving $RELEASE_SHA with billing disabled."
              exit 0
            fi
            sleep 10
          done
          echo "seenrelay.com did not converge to required Production commit $RELEASE_SHA within the gate window." >&2
          cat "$RUNNER_TEMP/health.json" 2>/dev/null || true
          exit 1

      - name: Verify healthy existing Production for non-deployed changes
        if: steps.applicability.outputs.required != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://seenrelay.com/healthz --output "$RUNNER_TEMP/health.json"
          jq -e '.ok == true and .environment == "production" and .billing_enabled == false and (.deployment_sha | type == "string" and length > 0)' "$RUNNER_TEMP/health.json" >/dev/null
          echo 'Production remains healthy with billing disabled; this push intentionally required no Vercel deployment.'

      - name: Verify Delta first-party observation boundary in Production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://seenrelay.com/data-practices.json \
            --output "$RUNNER_TEMP/data-practices.json"
          jq -e '
            .first_party_observers.contract_revision == "delta-first-party-gate-v1"
            and .first_party_observers.delta_seed_observer.observer_id == "seenrelay-private-delta-observer-v1"
            and .first_party_observers.delta_seed_observer.protocol_operation == "OBSERVE"
            and .first_party_observers.delta_seed_observer.classified_as_external_adoption == false
            and .first_party_observers.delta_seed_observer.prediction_used_to_create_observation == false
          ' "$RUNNER_TEMP/data-practices.json" >/dev/null
          echo 'Production exposes the Delta first-party OBSERVE-only non-adoption boundary.'

      - name: Verify canonical Agent Skill served by Production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://seenrelay.com/.well-known/agent-skills/seenrelay/SKILL.md \
            --output "$RUNNER_TEMP/seenrelay-production-skill.md"
          cmp "$RUNNER_TEMP/seenrelay-production-skill.md" skills/seenrelay/SKILL.md
          echo "Production serves the canonical repository skill."

      - name: Run the exact public Agent Skill install command
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/home" "$TMP/work"
          cd "$TMP/work"
          npm init -y >/dev/null

          export npm_config_yes=true
          HOME="$TMP/home" npx skills add https://seenrelay.com --skill seenrelay --yes

          INSTALLED="$(find "$TMP" -type f -path '*/seenrelay/SKILL.md' -print -quit)"
          if [ -z "$INSTALLED" ]; then
            echo 'The exact public install command completed without an installed seenrelay/SKILL.md.' >&2
            find "$TMP" -maxdepth 6 -type f -print >&2 || true
            exit 1
          fi

          cmp "$INSTALLED" "$GITHUB_WORKSPACE/skills/seenrelay/SKILL.md"
          echo "Exact public command installed canonical skill at $INSTALLED"

      - name: Clean-install promoted npm client
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.install.client_version' public/product-facts.json)"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "seenrelay@$VERSION" >/dev/null
          test "$(node -p "require('./node_modules/seenrelay/package.json').version")" = "$VERSION"
          node --input-type=module - <<'NODE'
          await import('seenrelay');
          await import('seenrelay/ambient');
          await import('seenrelay/economics');
          NODE
          echo "npm seenrelay@$VERSION clean-install passed."

      - name: Clean-install promoted PyPI client
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.install.client_version' public/product-facts.json)"
          python -m venv "$RUNNER_TEMP/seenrelay-adoption-venv"
          "$RUNNER_TEMP/seenrelay-adoption-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "seenrelay==$VERSION" >/dev/null
          INSTALLED="$("$RUNNER_TEMP/seenrelay-adoption-venv/bin/python" - <<'PY'
          from importlib.metadata import version
          print(version('seenrelay'))
          PY
          )"
          test "$INSTALLED" = "$VERSION"
          "$RUNNER_TEMP/seenrelay-adoption-venv/bin/python" - <<'PY'
          from seenrelay import SeenRelayClient
          from seenrelay_ambient import ambient_mcp_client
          from seenrelay_economics import classify_hostile_benchmark_verdict
          assert SeenRelayClient is not None and callable(ambient_mcp_client)
          assert callable(classify_hostile_benchmark_verdict)
          PY
          echo "PyPI seenrelay==$VERSION clean-install passed."

      - name: Verify the public first-use surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header 'Accept: text/html' https://seenrelay.com/ \
            --output "$RUNNER_TEMP/home.html"
          curl --fail --silent --show-error --location \
            --header 'Accept: text/html' https://seenrelay.com/quickstart \
            --output "$RUNNER_TEMP/quickstart.html"
          curl --fail --silent --show-error --location \
            https://seenrelay.com/revamp.js \
            --output "$RUNNER_TEMP/revamp.js"
          grep -q 'Run the free shadow audit' "$RUNNER_TEMP/home.html"
          grep -q 'USE / DO NOT USE / INSUFFICIENT EVIDENCE' "$RUNNER_TEMP/home.html"
          grep -q 'rv-console rv-funnel-console' "$RUNNER_TEMP/home.html"
          grep -q 'rv-console-body' "$RUNNER_TEMP/home.html"
          grep -q 'id="developer-audit"' "$RUNNER_TEMP/home.html"
          grep -q 'href="/quickstart#evaluate"' "$RUNNER_TEMP/home.html"
          grep -q 'Integrate directly with the client.' "$RUNNER_TEMP/revamp.js"
          grep -q 'Install the npm or PyPI client' "$RUNNER_TEMP/revamp.js"
          grep -q 'id="evaluate"' "$RUNNER_TEMP/quickstart.html"
          grep -q 'SeenRelayShadowProof' "$RUNNER_TEMP/quickstart.html"
          grep -q 'evaluateHostileBenchmark' "$RUNNER_TEMP/quickstart.html"
          grep -q 'evaluate_hostile_benchmark' "$RUNNER_TEMP/quickstart.html"
          grep -q 'classifyHostileBenchmarkVerdict' "$RUNNER_TEMP/quickstart.html"
          grep -q 'classify_hostile_benchmark_verdict' "$RUNNER_TEMP/quickstart.html"
          grep -q '<h3>USE</h3>' "$RUNNER_TEMP/quickstart.html"
          grep -q '<h3>DO NOT USE</h3>' "$RUNNER_TEMP/quickstart.html"
          grep -q '<h3>INSUFFICIENT EVIDENCE</h3>' "$RUNNER_TEMP/quickstart.html"
          grep -q 'Both the evaluator and verdict classifier leave automatic reuse disabled' "$RUNNER_TEMP/quickstart.html"
          echo 'Production exposes the contained first-use panel and deterministic Developer shadow-audit verdict path.'
