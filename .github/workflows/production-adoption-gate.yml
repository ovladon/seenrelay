name: Production Adoption Gate

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/skills/**'
      - '.agents/skills/**'
      - '.claude/skills/**'
      - 'shared/agent-skill.mjs'
      - 'src/index.ts'
      - 'src/landing.ts'
      - 'public/product-facts.json'
      - 'clients/**'
      - 'plugin.json'
      - 'mcp.json'
      - '.github/workflows/production-adoption-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-install-path:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Use Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Wait for this exact commit on Production
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/health.json" --write-out '%{http_code}' https://seenrelay.com/healthz || true)
            if [ "$status" = '200' ] \
              && jq -e --arg sha "$RELEASE_SHA" '.ok == true and .environment == "production" and .deployment_sha == $sha and .billing_enabled == false' "$RUNNER_TEMP/health.json" >/dev/null; then
              echo "Production is serving $RELEASE_SHA with billing disabled."
              exit 0
            fi
            sleep 10
          done
          echo "seenrelay.com did not converge to Production commit $RELEASE_SHA within the gate window." >&2
          cat "$RUNNER_TEMP/health.json" 2>/dev/null || true
          exit 1

      - name: Verify canonical Agent Skill served by Production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://seenrelay.com/.well-known/agent-skills/seenrelay/SKILL.md \
            --output "$RUNNER_TEMP/seenrelay-production-skill.md"
          cmp "$RUNNER_TEMP/seenrelay-production-skill.md" skills/seenrelay/SKILL.md
          echo "Production serves the canonical repository skill."

      - name: Run the exact public Agent Skill install command
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/home" "$TMP/work"
          cd "$TMP/work"
          npm init -y >/dev/null

          HOME="$TMP/home" npx -y skills@latest add https://seenrelay.com --skill seenrelay --yes

          INSTALLED="$(find "$TMP" -type f -path '*/seenrelay/SKILL.md' -print -quit)"
          if [ -z "$INSTALLED" ]; then
            echo 'The exact public install command completed without an installed seenrelay/SKILL.md.' >&2
            find "$TMP" -maxdepth 6 -type f -print >&2 || true
            exit 1
          fi

          cmp "$INSTALLED" "$GITHUB_WORKSPACE/skills/seenrelay/SKILL.md"
          echo "Exact public command installed canonical skill at $INSTALLED"

      - name: Clean-install promoted npm client
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.install.client_version' public/product-facts.json)"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "seenrelay@$VERSION" >/dev/null
          test "$(node -p "require('./node_modules/seenrelay/package.json').version")" = "$VERSION"
          node --input-type=module - <<'NODE'
          await import('seenrelay');
          await import('seenrelay/ambient');
          NODE
          echo "npm seenrelay@$VERSION clean-install passed."

      - name: Clean-install promoted PyPI client
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.install.client_version' public/product-facts.json)"
          python -m venv "$RUNNER_TEMP/seenrelay-adoption-venv"
          "$RUNNER_TEMP/seenrelay-adoption-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir "seenrelay==$VERSION" >/dev/null
          INSTALLED="$("$RUNNER_TEMP/seenrelay-adoption-venv/bin/python" - <<'PY'
          from importlib.metadata import version
          print(version('seenrelay'))
          PY
          )"
          test "$INSTALLED" = "$VERSION"
          "$RUNNER_TEMP/seenrelay-adoption-venv/bin/python" - <<'PY'
          from seenrelay import SeenRelayClient
          from seenrelay_ambient import ambient_mcp_client
          assert SeenRelayClient is not None and callable(ambient_mcp_client)
          PY
          echo "PyPI seenrelay==$VERSION clean-install passed."

      - name: Verify the public first-use surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header 'Accept: text/html' https://seenrelay.com/ \
            --output "$RUNNER_TEMP/home.html"
          grep -q 'Run the free shadow audit' "$RUNNER_TEMP/home.html"
          grep -q 'USE / DO NOT USE / INSUFFICIENT EVIDENCE' "$RUNNER_TEMP/home.html"
          echo 'Homepage exposes the expected activation path and falsifiable verdict contract.'
