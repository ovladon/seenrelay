name: Apply Shared Footer Guardrail Fix

on:
  push:
    branches:
      - site/browser-workload-map-and-shared-footer
    paths:
      - 'scripts/fix-shared-footer-guardrail.mjs'
      - '.github/workflows/fix-shared-footer-guardrail-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: site/browser-workload-map-and-shared-footer
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Apply guardrail fix
        run: node scripts/fix-shared-footer-guardrail.mjs
      - name: Verify affected tests
        run: node --test tests/guardrails.test.mjs tests/site-footer.test.mjs
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/guardrails.test.mjs
          git commit -m 'Keep public trust guardrail on shared footer'
          git push origin HEAD:site/browser-workload-map-and-shared-footer
