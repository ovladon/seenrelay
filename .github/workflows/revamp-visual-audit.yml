name: Revamp Visual Audit

on:
  push:
    branches:
      - site/adoption-revamp
    paths:
      - .github/workflows/revamp-visual-audit.yml

permissions:
  contents: read
  issues: read

jobs:
  visual-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Resolve PR preview
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: '119'
        shell: bash
        run: |
          set -euo pipefail
          url="$(node scripts/resolve-pr-preview-url.mjs)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolved Preview: $url"

      - name: Wait for exact deployment
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            body="$(curl -fsS -H "x-vercel-protection-bypass: $BYPASS_SECRET" "$PREVIEW_URL/healthz" || true)"
            if printf '%s' "$body" | grep -q "\"deployment_sha\":\"$RELEASE_SHA\""; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          echo "Preview never reached exact SHA $RELEASE_SHA" >&2
          exit 1

      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile audit
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-audit
          cat > /tmp/revamp-audit.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const base = process.env.PREVIEW_URL;
          const bypass = process.env.BYPASS_SECRET;
          const results = [];
          const errors = [];

          async function audit(browser, name, viewport, mobile = false) {
            const context = await browser.newContext({
              viewport,
              deviceScaleFactor: 1,
              isMobile: mobile,
              extraHTTPHeaders: { 'x-vercel-protection-bypass': bypass },
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            page.on('pageerror', e => errors.push(`${name}: pageerror: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`${name}: console: ${m.text()}`); });

            async function visit(path, file, interaction) {
              await page.goto(base + path, { waitUntil: 'networkidle', timeout: 60000 });
              if (interaction) await interaction(page);
              const metrics = await page.evaluate(() => {
                const root = document.documentElement;
                const body = document.body;
                const headings = [...document.querySelectorAll('h1,h2')].map(x => x.textContent.trim()).filter(Boolean);
                const primary = [...document.querySelectorAll('a,button')].map(x => x.textContent.trim()).filter(Boolean).slice(0, 30);
                return {
                  title: document.title,
                  viewportWidth: innerWidth,
                  viewportHeight: innerHeight,
                  scrollWidth: Math.max(root.scrollWidth, body.scrollWidth),
                  scrollHeight: Math.max(root.scrollHeight, body.scrollHeight),
                  horizontalOverflow: Math.max(root.scrollWidth, body.scrollWidth) > innerWidth + 1,
                  headings,
                  primary,
                };
              });
              results.push({ name: `${name}:${path}${interaction ? ':interaction' : ''}`, ...metrics });
              if (metrics.horizontalOverflow) errors.push(`${name}${path}: horizontal overflow ${metrics.scrollWidth} > ${metrics.viewportWidth}`);
              await page.screenshot({ path: `visual-audit/${file}`, fullPage: true });
            }

            await visit('/', `${name}-home.png`);
            await visit('/', `${name}-agent.png`, async p => {
              const tab = p.getByRole('tab', { name: /Coding agent/i });
              await tab.click();
              await p.waitForTimeout(150);
              const selected = await tab.getAttribute('aria-selected');
              if (selected !== 'true') errors.push(`${name}: coding-agent tab did not become selected`);
              const text = await p.locator('[data-install-view="agent"].active').innerText();
              if (!text.includes('npx skills add')) errors.push(`${name}: agent install command not visible after tab switch`);
            });
            await visit('/quickstart', `${name}-quickstart.png`);
            await visit('/clients', `${name}-clients.png`);
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await audit(browser, 'desktop', { width: 1440, height: 1000 }, false);
            await audit(browser, 'mobile', { width: 390, height: 844 }, true);
            await browser.close();
            fs.writeFileSync('visual-audit/metrics.json', JSON.stringify({ results, errors }, null, 2));
            if (errors.length) {
              console.error(errors.join('\n'));
              process.exit(1);
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node /tmp/revamp-audit.cjs
          cat visual-audit/metrics.json

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seenrelay-revamp-visual-audit
          path: visual-audit
          if-no-files-found: error
          retention-days: 3
