name: Promote verified client 0.2.7 public facts

on:
  push:
    branches:
      - release/promote-client-0.2.7-public-facts

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message != 'Promote verified public client facts to 0.2.7 candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Update canonical verified facts and synchronized prose
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          verified_at = '2026-08-31T21:36:15Z'
          facts_path = Path('public/product-facts.json')
          facts = json.loads(facts_path.read_text())
          assert facts['install']['client_version'] == '0.2.6'
          assert facts['install']['registry_install_verified_at'] == '2026-08-31T15:42:08Z'

          facts['updated_at'] = verified_at
          facts['positioning']['subheadline'] = (
              'Client 0.2.7 adds Ambient framework integrations and a local machine-readable integration catalog: '
              'JavaScript/TypeScript adds LangChain routing; Python adds LangChain and PydanticAI integrations. '
              'Ambient measurement remains local-only by default and does not authorize automatic reuse.'
          )
          facts['install']['client_version'] = '0.2.7'
          facts['install']['registry_install_verified_at'] = verified_at
          facts['install']['verification'] = (
              'Client 0.2.7 was published to npm and PyPI through trusted publishing and independently clean-install '
              'verified from both public registries. JavaScript/TypeScript adds Ambient framework routing for LangChain '
              'plus a local machine-readable integration catalog; Python adds Ambient integrations for LangChain and '
              'PydanticAI plus a local integration catalog. Ambient integrations preserve authoritative calls by default '
              'and do not authorize automatic reuse.'
          )
          latest = facts['latest_verified_updates']
          assert not any(item.get('title') == 'Public client 0.2.7' for item in latest)
          latest.insert(0, {
              'date': '2026-08-31',
              'title': 'Public client 0.2.7',
              'summary': (
                  'SeenRelay 0.2.7 is published and independently clean-install verified on npm and PyPI. '
                  'JavaScript/TypeScript adds Ambient framework routing for LangChain plus a local integration catalog; '
                  'Python adds Ambient integrations for LangChain and PydanticAI plus a local integration catalog. '
                  'Ambient measurement remains local-only by default and automatic reuse is not authorized.'
              ),
          })
          facts_path.write_text(json.dumps(facts, indent=2) + '\n')

          replacements = {
              'README.md': [(
                  'JavaScript/TypeScript 0.2.6 keeps Zero-State local-first and adds Ambient MCP local shadow by default. Python 0.2.6 adds local-only Ambient MCP measurement; the classic JavaScript/TypeScript and Python APIs remain shadow-first. Provider-specific adapters are optional.',
                  'JavaScript/TypeScript 0.2.7 keeps Zero-State local-first and adds Ambient framework routing for LangChain plus a local integration catalog. Python 0.2.7 adds Ambient integrations for LangChain and PydanticAI plus a local integration catalog; the classic JavaScript/TypeScript and Python APIs remain shadow-first unless an explicit reviewed reuse policy applies. Provider-specific adapters are optional.'
              )],
              'clients/README.md': [
                  (
                      'Client 0.2.6 is published and clean-install verified on npm and PyPI. JavaScript / TypeScript adds Ambient MCP integration that starts in local shadow and can opt exact reviewed tools into the existing local-first guard; Python adds local-only Ambient MCP measurement and an OpenAI Agents adapter while active Ambient reuse remains unavailable.',
                      'Client 0.2.7 is published and independently clean-install verified on npm and PyPI. JavaScript / TypeScript adds Ambient framework routing for LangChain plus a local machine-readable integration catalog; Python adds Ambient integrations for LangChain and PydanticAI plus a local integration catalog. Ambient integrations preserve authoritative calls by default and do not authorize automatic reuse.'
                  ),
                  (
                      'The clients have zero third-party runtime dependencies and are publicly available as `seenrelay` version `0.2.6` on npm and PyPI.',
                      'The clients have zero third-party runtime dependencies and are publicly available as `seenrelay` version `0.2.7` on npm and PyPI.'
                  ),
                  (
                      'Python behavior remains shadow-first in 0.2.6. Ambient MCP measurement and the OpenAI Agents adapter are available in Python, but JavaScript / TypeScript Zero-State, active Ambient reuse, natural-workload collector, Firecrawl shadow pilots and packaged economics evaluator parity are not claimed for Python.',
                      'Python behavior remains shadow-first in 0.2.7. Ambient MCP measurement plus OpenAI Agents, LangChain and PydanticAI integrations are available in Python, but JavaScript / TypeScript Zero-State, active Ambient reuse, natural-workload collector, Firecrawl shadow pilots and packaged economics evaluator parity are not claimed for Python.'
                  ),
              ],
              'docs/QUICKSTART.md': [
                  (
                      'The recommended JavaScript/TypeScript 0.2.6 path is local-first: use caller-side reuse and source-native confirmation before considering shared evidence. Ambient MCP starts in local shadow by default; Python 0.2.6 Ambient remains measurement-only, and the classic APIs remain shadow-first.',
                      'The recommended JavaScript/TypeScript 0.2.7 path is local-first: use caller-side reuse and source-native confirmation before considering shared evidence. Ambient framework integrations start in local shadow by default; Python 0.2.7 Ambient remains measurement-only, and the classic APIs remain shadow-first.'
                  ),
                  (
                      'Python classic behavior remains shadow-first in 0.2.6.',
                      'Python classic behavior remains shadow-first in 0.2.7.'
                  ),
              ],
          }

          for rel, pairs in replacements.items():
              p = Path(rel)
              text = p.read_text()
              for old, new in pairs:
                  assert text.count(old) == 1, f'{rel}: expected exactly one match for {old!r}'
                  text = text.replace(old, new, 1)
              p.write_text(text)
          PY

          npm run public:sync
          npm run public:sync:check
          git diff --check -- public/product-facts.json README.md clients/README.md docs/QUICKSTART.md docs/VERIFIED_RESULTS.md src/public-facts.generated.ts

      - name: Commit promotion candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/product-facts.json README.md clients/README.md docs/QUICKSTART.md docs/VERIFIED_RESULTS.md src/public-facts.generated.ts
          git diff --cached --quiet && exit 1
          git commit -m 'Promote verified public client facts to 0.2.7 candidate'
          git push origin HEAD:release/promote-client-0.2.7-public-facts

# Trigger registration after workflow creation on the branch.
