name: PRIVATE316 Browserbase Render Native Controls

on:
  push:
    branches:
      - research/browserbase-render-native-controls-v1

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    env:
      PRIVATE316_OUTPUT: private316-browserbase-render-native-controls.json
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require exact research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/browserbase-render-native-controls-v1'

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Validate preregistration
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('preregistration/PRIVATE316_BROWSERBASE_RENDER_NATIVE_CONTROLS_V1.json','utf8')); if(p.experiment_id!=='PRIVATE316'||p.parent_exact_head!=='1f73812fffc4931e3a2d26116d16738d14df655b'||p.frozen_source_contract?.rounds!==20||p.frozen_source_contract?.requests_per_round!==4) process.exit(1)"

      - name: Run hostile synthetic tests
        run: node --test tests/private316-browserbase-render-native-controls.test.mjs

      - name: Run aggregate-only native control measurement
        run: node scripts/private316-browserbase-render-native-controls.mjs

      - name: Validate aggregate artifact contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateAggregateReport } from './scripts/private316-browserbase-render-native-controls.mjs';
          const raw = fs.readFileSync(process.env.PRIVATE316_OUTPUT, 'utf8');
          if (Buffer.byteLength(raw, 'utf8') > 8192) process.exit(1);
          const report = JSON.parse(raw);
          validateAggregateReport(report);
          if (report.privacy?.aggregate_only !== true) process.exit(1);
          NODE

      - name: Upload validated aggregate only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private316-browserbase-render-native-controls-${{ github.run_id }}
          path: private316-browserbase-render-native-controls.json
          if-no-files-found: error
          retention-days: 14
