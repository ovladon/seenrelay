name: Research Assurance Coordinate Check

on:
  push:
    branches:
      - research/assurance-coordinate-legal-benchmark

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run full project checks
        run: npm run check
      - name: Compile new Python modules
        run: python3 -m py_compile clients/python/seenrelay_assurance.py clients/python/seenrelay_coordinates.py
      - name: Verify TypeScript package payload
        run: |
          set -euo pipefail
          npm pack ./clients/typescript --dry-run --json > /tmp/npm-pack.json
          grep -q 'dist/assurance.js' /tmp/npm-pack.json
          grep -q 'dist/assurance.d.ts' /tmp/npm-pack.json
          grep -q 'dist/coordinates.js' /tmp/npm-pack.json
          grep -q 'dist/coordinates.d.ts' /tmp/npm-pack.json
      - name: Verify Python package module declarations
        run: |
          grep -q 'seenrelay_assurance' clients/python/pyproject.toml
          grep -q 'seenrelay_coordinates' clients/python/pyproject.toml
