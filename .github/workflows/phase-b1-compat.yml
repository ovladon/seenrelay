name: Phase B1 Public Surface Compatibility

on:
  push:
    branches: [site/phase-b1-adoption-surface]
    paths: ['.github/workflows/phase-b1-compat.yml']

permissions:
  contents: write

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: site/phase-b1-adoption-surface
      - name: Restore shared-page styling and canonical version facts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          css = Path('public/site.css')
          text = css.read_text()
          marker = '/* legacy-human-pages-compat */'
          assert marker not in text
          compat = r'''

/* legacy-human-pages-compat */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px max(24px,calc((100vw - var(--max))/2));border-bottom:1px solid #183039b3;background:#080b0de8;backdrop-filter:blur(16px)}
.nav .brand{justify-self:auto;font-weight:800;letter-spacing:-.025em;font-size:18px;display:flex;align-items:center;gap:8px}
.nav .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 #7ce7c466;animation:legacyPulse 2.4s infinite}
.nav nav{display:flex;gap:24px;color:#9db1b9;font-size:13px}
.nav nav a:hover{color:#fff}
.nav + main .hero{max-width:var(--max);margin:auto;padding:112px 24px 72px}
.nav + main .hero.compact{padding-bottom:42px}
.nav + main .hero h1{font-size:clamp(48px,7vw,92px);line-height:.94;letter-spacing:-.06em;max-width:980px;margin:0}
.nav + main .lead{font-size:clamp(18px,2vw,24px);line-height:1.5;color:#a8bac1;max-width:820px;margin:30px 0 34px}
.nav + main .lead.small{font-size:15px;max-width:900px;margin-top:28px}
.nav + main .cta{display:flex;gap:12px;flex-wrap:wrap}
.nav + main .primary,.nav + main .secondary{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:13px 18px;font-weight:750;font-size:14px}
.nav + main .primary{background:#eaf8f3;color:#061013}
.nav + main .secondary{border:1px solid #294049;background:#0b161b;color:#dbe9ee}
.nav + main .secondary:hover{border-color:#45606a}
.nav + main .contract{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;color:#7f959d;font-size:12px}
.nav + main .contract b{color:#d9e7eb}
.nav + main .section{border-top:1px solid var(--line);border-bottom:0}
.nav + main .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:30px}
.nav + main .section-head h2,.nav + main .split h2,.nav + main .final h2{font-size:clamp(34px,4vw,58px);letter-spacing:-.045em;line-height:1.02;margin:0}
.nav + main .section-head>p{max-width:500px;color:#91a5ad;line-height:1.55;margin:0}
.nav + main .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.nav + main .metrics article,.nav + main .proof-grid article{border:1px solid var(--line);background:linear-gradient(180deg,#0b171c,#091217);border-radius:16px;padding:22px}
.nav + main .label{color:#7f969e;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.nav + main .metric{font-size:38px;font-weight:800;letter-spacing:-.04em;margin:12px 0 4px}
.nav + main .hint{font-size:12px;color:#6f8790}
.nav + main .stamp{margin-top:12px;text-align:right;color:#647982;font-size:11px}
.nav + main .split{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.nav + main .split p{font-size:17px;line-height:1.65;color:#9fb1b8}
.nav + main .flow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:26px;font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace}
.nav + main .flow span{border:1px solid #28424b;background:#0a171b;padding:8px 10px;border-radius:9px}
.nav + main .flow i{font-style:normal;color:#57747f}
.nav + main .terminal{border:1px solid #27414a;border-radius:16px;background:#061013;box-shadow:0 24px 80px #0007;overflow:hidden}
.nav + main .terminal-top{height:42px;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid #183038;color:#6f848c;font-size:11px}
.nav + main .terminal-top span{width:8px;height:8px;border-radius:50%;background:#29444c}
.nav + main .terminal-top b{margin-left:auto}
.nav + main .terminal pre{padding:24px;margin:0;overflow:auto;color:#a6e8d6;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}
.nav + main .decision{background:linear-gradient(90deg,transparent,#0a1519 48%,transparent)}
.nav + main .formula{margin-top:24px;border:1px solid #2a3d45;border-radius:12px;padding:15px 16px;font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe9f2}
.nav + main .proof-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav + main .proof-grid article{display:grid;gap:8px}
.nav + main .proof-grid b{font-size:14px}
.nav + main .proof-grid span{font-size:12px;line-height:1.5;color:#82969e}
.nav + main .trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.nav + main .trust-grid article{border:1px solid var(--line);background:linear-gradient(180deg,#0b171c,#091217);border-radius:16px;padding:22px;min-height:auto}
.nav + main .trust-grid h3{margin:18px 0 8px;font-size:16px}
.nav + main .trust-grid p{margin:0;color:#82969e;font-size:13px;line-height:1.55}
.nav + main .ok{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:#0d2522;border:1px solid #1f5b4c;color:var(--accent);font:800 11px ui-monospace,SFMono-Regular,Menlo,monospace}
.nav + main .trust-note{margin-top:18px;text-align:right;font-size:13px;color:var(--accent)}
.nav + main .trust-note a:hover{text-decoration:underline}
.nav + main .final{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.nav + main .final>div:first-child{max-width:780px}
.nav + main .benchmark-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#091217}
.nav + main .benchmark-table{width:100%;min-width:1120px;border-collapse:collapse;font-size:12px}
.nav + main .benchmark-table th,.nav + main .benchmark-table td{padding:14px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.nav + main .benchmark-table th{position:sticky;top:0;background:#0b171c;color:#80959d;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.nav + main .benchmark-table tbody tr:last-child td{border-bottom:0}
.nav + main .benchmark-table b{display:block;font-size:13px;color:#e5eff2}
.nav + main .benchmark-table small{display:block;margin-top:5px;color:#6f858d;line-height:1.4}
.nav + main .benchmark-table a{color:var(--accent)}
.nav + main .benchmark-table .fit-badge{display:inline-flex;padding:5px 7px;border-radius:999px;border:1px solid #30454d;font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}
.nav + main .benchmark-table .fit-good{color:var(--accent);border-color:#1f5b4c;background:#0d2522}
.nav + main .benchmark-table .fit-conditional{color:var(--warm);border-color:#5c4d26;background:#211b0d}
.nav + main .benchmark-table .fit-poor{color:#f3a7a7;border-color:#613636;background:#241111}
@keyframes legacyPulse{0%{box-shadow:0 0 0 0 #7ce7c455}70%{box-shadow:0 0 0 10px #7ce7c400}100%{box-shadow:0 0 0 0 #7ce7c400}}
@media(prefers-reduced-motion:reduce){.nav .pulse{animation:none;box-shadow:none}}
@media(max-width:900px){.nav nav{display:none}.nav + main .metrics{grid-template-columns:repeat(2,1fr)}.nav + main .split{grid-template-columns:1fr;gap:36px}.nav + main .trust-grid{grid-template-columns:1fr 1fr}.nav + main .section-head{display:block}.nav + main .section-head>p{margin-top:18px}.nav + main .final{display:block}.nav + main .final .cta{margin-top:24px}.nav + main .benchmark-table-wrap{margin-right:-24px;border-radius:14px 0 0 14px}}
@media(max-width:560px){.nav + main .hero{padding-top:72px}.nav + main .metrics,.nav + main .proof-grid,.nav + main .trust-grid{grid-template-columns:1fr}.nav + main .hero h1{font-size:48px}.nav + main .contract{gap:10px}.nav + main .terminal pre{font-size:11px}}
'''
          css.write_text(text + compat)

          quick = Path('src/quickstart.ts')
          text = quick.read_text()
          old = "import { publicInstallHtml, siteFooterHtml } from './public-facts-view.js';"
          new = old + "\nimport { publicProductFacts } from './public-facts.generated.js';"
          assert old in text and "publicProductFacts" not in text
          text = text.replace(old, new, 1)
          old = "export function quickstartPage(origin: string): string {\n  return `<!doctype html>"
          new = "export function quickstartPage(origin: string): string {\n  const clientVersion = publicProductFacts.install.client_version;\n  return `<!doctype html>"
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('JavaScript/TypeScript 0.2.1:', 'JavaScript/TypeScript ${clientVersion}:')
          text = text.replace('<span>Client 0.2.1</span>', '<span>Client ${clientVersion}</span>')
          text = text.replace('Python remains shadow-first in 0.2.1.', 'Python remains shadow-first in client ${clientVersion}.')
          assert '0.2.1' not in text
          quick.write_text(text)

          adoption = Path('src/adoption.ts')
          text = adoption.read_text()
          old = "import { machinePublicFactsText, publicInstallHtml, siteFooterHtml } from './public-facts-view.js';"
          new = old + "\nimport { publicProductFacts } from './public-facts.generated.js';"
          assert old in text and "publicProductFacts" not in text
          text = text.replace(old, new, 1)
          old = "export function clientsPage(origin: string): string {\n  const cursorInstall"
          new = "export function clientsPage(origin: string): string {\n  const clientVersion = publicProductFacts.install.client_version;\n  const cursorInstall"
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('<div class="eyebrow">CLIENT 0.2.1</div>', '<div class="eyebrow">CLIENT ${clientVersion}</div>')
          text = text.replace('Python behavior remains shadow-first in 0.2.1.', 'Python behavior remains shadow-first in client ${clientVersion}.')
          old = "export function llmsText(origin: string): string {\n  return `# SeenRelay"
          new = "export function llmsText(origin: string): string {\n  const clientVersion = publicProductFacts.install.client_version;\n  return `# SeenRelay"
          assert old in text
          text = text.replace(old, new, 1)
          text = text.replace('JavaScript/TypeScript 0.2.1 uses', 'JavaScript/TypeScript ${clientVersion} uses')
          text = text.replace('Python 0.2.1 remains shadow-first.', 'Python ${clientVersion} remains shadow-first.')
          assert '0.2.1' not in text
          adoption.write_text(text)

          tests = Path('tests/site-phase-b1.test.mjs')
          text = tests.read_text()
          old = "const publicSource = fs.readFileSync(new URL('../src/public.ts', import.meta.url), 'utf8');\nconst css"
          new = "const publicSource = fs.readFileSync(new URL('../src/public.ts', import.meta.url), 'utf8');\nconst quickstartSource = fs.readFileSync(new URL('../src/quickstart.ts', import.meta.url), 'utf8');\nconst adoptionSource = fs.readFileSync(new URL('../src/adoption.ts', import.meta.url), 'utf8');\nconst css"
          assert old in text
          text = text.replace(old, new, 1)
          text += """

test('secondary public adoption surfaces derive the verified client version', () => {
  assert.match(quickstartSource, /publicProductFacts\.install\.client_version/);
  assert.match(adoptionSource, /publicProductFacts\.install\.client_version/);
  assert.doesNotMatch(quickstartSource, /0\.2\.1/);
  assert.doesNotMatch(adoptionSource, /0\.2\.1/);
});

test('shared stylesheet preserves non-home human pages and benchmark matrix', () => {
  assert.match(css, /legacy-human-pages-compat/);
  assert.match(css, /\.nav \+ main \.terminal/);
  assert.match(css, /\.nav \+ main \.proof-grid/);
  assert.match(css, /\.nav \+ main \.benchmark-table/);
});
"""
          tests.write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site.css src/quickstart.ts src/adoption.ts tests/site-phase-b1.test.mjs
          git commit -m 'Preserve shared public pages in Phase B.1 redesign'
          git push origin HEAD:site/phase-b1-adoption-surface
