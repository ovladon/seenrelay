name: Preview Release Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact Vercel Preview URL to verify
        required: true
        type: string
      release_sha:
        description: Exact deployment commit SHA expected from /healthz
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: seenrelay-preview-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-release-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || inputs.release_sha }}
    steps:
      - name: Checkout exact head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Classify Preview applicability
        id: applicability
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          elif [[ "$HEAD_REF" == research/* || "$HEAD_REF" == verify/* ]]; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo "Vercel Preview is not applicable: vercel.json disables deployment for $HEAD_REF."
          elif VERCEL_GIT_PREVIOUS_SHA="$BASE_SHA" VERCEL_GIT_COMMIT_SHA="$HEAD_SHA" bash scripts/vercel-ignore-main.sh; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'Vercel Preview is not applicable: the PR does not change main deployment inputs.'
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve this PR's Vercel Preview URL
        id: preview
        if: github.event_name == 'pull_request' && steps.applicability.outputs.required == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url="$(node scripts/resolve-pr-preview-url.mjs)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolved Preview: $url"

      - name: Run isolated Preview release gate
        if: steps.applicability.outputs.required == 'true'
        shell: bash
        env:
          PREVIEW_URL: ${{ github.event_name == 'pull_request' && steps.preview.outputs.url || inputs.preview_url }}
        run: bash scripts/run-preview-release-gate.sh

      - name: Record non-deployed change gate
        if: steps.applicability.outputs.required != 'true'
        run: echo 'Preview release gate passed as not applicable because this change does not produce the main Vercel deployment.'
