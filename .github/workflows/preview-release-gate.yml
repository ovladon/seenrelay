name: Preview Release Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact Vercel Preview URL to verify
        required: true
        type: string
      release_sha:
        description: Exact deployment commit SHA expected from /healthz
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: seenrelay-preview-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-release-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || inputs.release_sha }}
    steps:
      - name: Checkout exact head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Resolve this PR's Vercel Preview URL
        id: preview
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url="$(node scripts/resolve-pr-preview-url.mjs)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolved Preview: $url"

      - name: Run isolated Preview release gate
        shell: bash
        env:
          PREVIEW_URL: ${{ github.event_name == 'pull_request' && steps.preview.outputs.url || inputs.preview_url }}
        run: bash scripts/run-preview-release-gate.sh

      - name: Run controlled load smoke on isolated Preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'perf/controlled-load-harness'
        shell: bash
        env:
          SEENRELAY_LOAD_BASE_URL: ${{ steps.preview.outputs.url }}
          SEENRELAY_LOAD_PROFILE: smoke
          SEENRELAY_LOAD_NETWORK_MODE: shared
          SEENRELAY_LOAD_RUN_KEY: gha-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          SEENRELAY_LOAD_OUTPUT: seenrelay-load-smoke.json
        run: |
          set -euo pipefail
          cat >/tmp/seenrelay-vercel-bypass.mjs <<'NODE'
          const originalFetch = globalThis.fetch;
          const secret = process.env.BYPASS_SECRET?.trim();
          if (!secret) throw new Error('BYPASS_SECRET is required for protected Preview load tests');
          globalThis.fetch = (input, init = {}) => {
            const headers = new Headers(init.headers || {});
            headers.set('x-vercel-protection-bypass', secret);
            return originalFetch(input, { ...init, headers });
          };
          NODE
          node --import /tmp/seenrelay-vercel-bypass.mjs scripts/load-seenrelay.mjs
          cat seenrelay-load-smoke.json

      - name: Upload controlled load smoke report
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'perf/controlled-load-harness'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seenrelay-load-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: seenrelay-load-smoke.json
          if-no-files-found: warn
          retention-days: 7
