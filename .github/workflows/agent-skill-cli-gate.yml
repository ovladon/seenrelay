name: Agent Skill CLI Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'shared/agent-skill.mjs'
      - 'src/index.ts'
      - 'clients/**'
      - '.github/workflows/agent-skill-cli-gate.yml'

permissions:
  contents: read

jobs:
  skills-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Reinstall canonical SeenRelay skill with current Skills CLI
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { agentSkillMarkdown } from './shared/agent-skill.mjs';

          const canonical = fs.readFileSync('./skills/seenrelay/SKILL.md', 'utf8');
          if (canonical !== agentSkillMarkdown()) {
            console.error('skills/seenrelay/SKILL.md diverges from shared/agent-skill.mjs');
            process.exit(1);
          }
          NODE

          EXPECTED="$(sha256sum "$GITHUB_WORKSPACE/skills/seenrelay/SKILL.md" | awk '{print $1}')"
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npx -y skills@latest add "$GITHUB_WORKSPACE" --skill seenrelay --agent codex --copy --yes
          INSTALLED="$(find "$TMP" -type f -path '*/seenrelay/SKILL.md' -print -quit)"
          test -n "$INSTALLED"
          cmp "$INSTALLED" "$GITHUB_WORKSPACE/skills/seenrelay/SKILL.md"
          ACTUAL="$(sha256sum "$INSTALLED" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          echo "skills@latest installed canonical SeenRelay digest: $ACTUAL"
