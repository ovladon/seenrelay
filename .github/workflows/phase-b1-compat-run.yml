name: Phase B1 Compatibility Run

on:
  push:
    branches: [site/phase-b1-adoption-surface]
    paths: ['.github/workflows/phase-b1-compat-run.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: site/phase-b1-adoption-surface
      - name: Apply compatibility changes
        run: python scripts/phase-b1-compat.py
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/site.css src/quickstart.ts src/adoption.ts tests/site-phase-b1.test.mjs
          git commit -m 'Preserve shared public pages in Phase B.1 redesign'
          git push origin HEAD:site/phase-b1-adoption-surface
