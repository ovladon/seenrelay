name: Jobseek physical identity coverage diagnostic

on:
  pull_request:
    branches: [research/browser-natural-jobseek-v1]
    paths:
      - 'preregistration/PRIVATE294_JOBSEEK_PHYSICAL_IDENTITY_COVERAGE_V1.json'
      - 'scripts/run-private294-jobseek-identity-coverage.py'
      - 'tests/private294-jobseek-identity-coverage.test.py'
      - '.github/workflows/jobseek-identity-coverage.yml'

permissions:
  contents: read

jobs:
  identity-coverage:
    if: startsWith(github.head_ref, 'research/browser-natural-jobseek-identity-diagnostic-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Hub metadata client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==0.35.3'

      - name: Run frozen PRIVATE294 tests
        run: python tests/private294-jobseek-identity-coverage.test.py

      - name: Execute preregistered identity coverage diagnostic
        run: |
          python scripts/run-private294-jobseek-identity-coverage.py \
            --output private294-jobseek-identity-coverage.json

      - name: Enforce aggregate-only PRIVATE294 report
        run: |
          python - <<'PY'
          import json
          import pathlib

          report = json.loads(pathlib.Path('private294-jobseek-identity-coverage.json').read_text(encoding='utf-8'))
          if report.get('schema') != 'seenrelay-private294-jobseek-physical-identity-coverage-v1':
              raise SystemExit(1)
          if report.get('parent_private293', {}).get('research_head') != '1ae9ab3b0ec2193ffccdca78d32744a3aa6f516d':
              raise SystemExit(1)
          if report.get('parent_private293', {}).get('workflow_run_id') != 33992072773:
              raise SystemExit(1)
          if report.get('parent_private293', {}).get('result_frozen') is not True:
              raise SystemExit(1)
          if report.get('parent_private293', {}).get('reclassified') is not False:
              raise SystemExit(1)
          source = report.get('source', {})
          if source.get('resolved_revision') != '524f2910f2893b04ccfbb76e56116fe0af3c5bf7':
              raise SystemExit(1)
          if source.get('trace_manifest_sha256') != '113b9ac82efdb8bb6c56171d4dca0671b293cf8eac69667afa6278ca29560af8':
              raise SystemExit(1)

          selection = report.get('selection', {})
          if selection.get('phase') != 'PRIVATE293_PHASE_A_EXACT_REUSE':
              raise SystemExit(1)
          if selection.get('files_processed') != 400 or selection.get('logical_bytes_verified') != 2828013200:
              raise SystemExit(1)
          if selection.get('phase_b_used') is not False:
              raise SystemExit(1)
          if selection.get('selection_used_trace_content') is not False:
              raise SystemExit(1)
          if selection.get('selection_used_file_size') is not False:
              raise SystemExit(1)
          if selection.get('selection_used_company_or_issue_metadata') is not False:
              raise SystemExit(1)

          coverage = report.get('coverage', {})
          if coverage.get('webfetch_records_seen') != 9603:
              raise SystemExit(1)
          if coverage.get('all_three_present') != 773:
              raise SystemExit(1)
          if coverage.get('missing_at_least_one') != 8830:
              raise SystemExit(1)
          masks = coverage.get('presence_bitmask_counts', {})
          expected_masks = {f'{a}{b}{c}' for a in '01' for b in '01' for c in '01'}
          if set(masks) != expected_masks:
              raise SystemExit(1)
          if any(not isinstance(value, int) or value < 0 for value in masks.values()):
              raise SystemExit(1)
          if sum(masks.values()) != 9603 or masks.get('111') != 773:
              raise SystemExit(1)
          if coverage.get('presence_mask_order') != 'sessionId,assistant_uuid,tool_use_id':
              raise SystemExit(1)

          decision = report.get('decision', {})
          if decision.get('single_field_dominant_threshold_percent_of_missing_records') != 95:
              raise SystemExit(1)
          if decision.get('diagnosis') not in {
              'SESSION_ID_ONLY_DOMINANT_GAP',
              'ASSISTANT_UUID_ONLY_DOMINANT_GAP',
              'TOOL_USE_ID_ONLY_DOMINANT_GAP',
              'MIXED_IDENTITY_GAPS',
          }:
              raise SystemExit(1)
          if decision.get('overlap_rerun_authorized') is not False:
              raise SystemExit(1)
          if decision.get('private293_reinterpretation_authorized') is not False:
              raise SystemExit(1)

          interpretation = report.get('interpretation', {})
          if any(value is not False for key, value in interpretation.items() if key != 'aggregate_schema_coverage_diagnostic_only'):
              raise SystemExit(1)
          if interpretation.get('aggregate_schema_coverage_diagnostic_only') is not True:
              raise SystemExit(1)

          privacy = report.get('privacy', {})
          if not privacy or any(value is not False for value in privacy.values()):
              raise SystemExit(1)

          forbidden_keys = {
              'raw_url', 'raw_prompt', 'url', 'prompt', 'tool_result', 'tool_use_id_value',
              'assistant_uuid_value', 'session_id_value', 'file_path', 'company', 'issue'
          }
          def walk(value):
              if isinstance(value, list):
                  for item in value:
                      walk(item)
              elif isinstance(value, dict):
                  for key, child in value.items():
                      if key in forbidden_keys:
                          raise SystemExit(1)
                      walk(child)
          walk(report)
          PY

      - name: Upload aggregate diagnostic only
        uses: actions/upload-artifact@v4
        with:
          name: private294-jobseek-identity-coverage
          path: private294-jobseek-identity-coverage.json
          if-no-files-found: error
          retention-days: 14
