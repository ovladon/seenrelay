name: Site Browser Result Sync

on:
  push:
    branches:
      - site/browser-workload-map-and-shared-footer
    paths:
      - 'scripts/sync-browser-workload-footer.mjs'
      - '.github/workflows/site-browser-result-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: site/browser-workload-map-and-shared-footer
      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - name: Remove obsolete embedded test bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/sync-browser-workload-footer.mjs')
          s=p.read_text()
          marker="write('tests/site-footer.test.mjs', `"
          if marker in s:
              s=s[:s.index(marker)] + "console.log('Staged canonical browser workload result, workload map, and shared footer.');\n"
              p.write_text(s)
          PY
      - name: Apply deterministic site synchronization
        run: |
          node scripts/sync-browser-workload-footer.mjs
          node scripts/sync-public-surfaces.mjs --write
          node --test tests/public-facts-sync.test.mjs tests/economics-positioning.test.mjs tests/site-footer.test.mjs
      - name: Commit synchronized public surfaces
        run: |
          if git diff --quiet; then
            echo 'No synchronized changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/product-facts.json src/public-facts.generated.ts src/public-facts-view.ts src/public.ts src/quickstart.ts src/adoption.ts src/economics.ts scripts/sync-public-surfaces.mjs docs/VERIFIED_RESULTS.md tests/public-facts-sync.test.mjs tests/economics-positioning.test.mjs tests/site-footer.test.mjs
          git commit -m 'Publish verified browser workload and shared footer'
          git push origin HEAD:site/browser-workload-map-and-shared-footer
