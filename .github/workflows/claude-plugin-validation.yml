name: Claude Plugin Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'skills/**'
      - 'integrations/claude/seenrelay/**'
      - '.github/workflows/claude-plugin-validation.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'skills/**'
      - 'integrations/claude/seenrelay/**'
      - '.github/workflows/claude-plugin-validation.yml'

permissions:
  contents: read

env:
  CLAUDE_CODE_VALIDATOR_VERSION: '2.1.278'

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Validate SeenRelay with Anthropic Claude Code
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --allow-scripts=@anthropic-ai/claude-code "@anthropic-ai/claude-code@${CLAUDE_CODE_VALIDATOR_VERSION}"
          claude --version

          # Validate the exact submission tree with Anthropic's normal review semantics.
          # The manifest deliberately omits an explicit version so community-marketplace
          # updates can follow the source commit SHA. Anthropic documents version as
          # optional, but its validator emits one advisory warning for that choice.
          set +e
          claude plugin validate . 2>&1 | tee "$RUNNER_TEMP/claude-plugin-validation.txt"
          VALIDATE_RC=${PIPESTATUS[0]}
          set -e
          test "$VALIDATE_RC" -eq 0

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const output = fs.readFileSync(process.env.RUNNER_TEMP + '/claude-plugin-validation.txt', 'utf8');
          const hasWarnings = /Found \d+ warning/.test(output);
          if (hasWarnings) {
            if (!/Found 1 warning/.test(output) || !/version: No version specified/.test(output)) {
              console.error('Claude validator emitted an unexpected warning.');
              process.exit(1);
            }
            console.log('Accepted the single intentional no-version advisory; no other warnings are allowed.');
          }
          NODE

          # Prove the same plugin is warning-free under --strict when only the
          # intentional version omission is neutralized in a temporary copy.
          STRICT_DIR="$(mktemp -d)"
          cp -R .claude-plugin skills "$STRICT_DIR/"
          node --input-type=module - "$STRICT_DIR/.claude-plugin/plugin.json" <<'NODE'
          import fs from 'node:fs';
          const path = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = '0.0.0';
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          claude plugin validate "$STRICT_DIR" --strict


          # Validate the repository-hosted marketplace used for immediate direct installs.
          claude plugin validate .claude-plugin/marketplace.json --strict

          # Exercise the real marketplace add/install flow in an isolated Claude home.
          # This does not contact SeenRelay or execute the plugin; it proves discovery
          # and persistent installation from the repository marketplace.
          MARKET_HOME="$(mktemp -d)"
          (
            export HOME="$MARKET_HOME"
            export CLAUDE_CONFIG_DIR="$MARKET_HOME/.claude"
            claude plugin marketplace add "$GITHUB_WORKSPACE"
            claude plugin install --scope user seenrelay@seenrelay
            claude plugin list --json > "$RUNNER_TEMP/seenrelay-plugin-list.json"
          )
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/seenrelay-plugin-list.json', 'utf8');
          if (!raw.includes('seenrelay')) {
            console.error('SeenRelay was not discoverable after marketplace add/install.');
            process.exit(1);
          }
          NODE

          # Validate the exact minimal community payload as shipped through source.path.
          claude plugin validate integrations/claude/seenrelay
