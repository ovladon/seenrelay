name: Claude Plugin Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'skills/**'
      - '.github/workflows/claude-plugin-validation.yml'
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'skills/**'
      - '.github/workflows/claude-plugin-validation.yml'

permissions:
  contents: read

env:
  CLAUDE_CODE_VALIDATOR_VERSION: '2.1.278'

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Validate SeenRelay with Anthropic Claude Code
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VALIDATOR_VERSION}"
          claude --version
          claude plugin validate . --strict
