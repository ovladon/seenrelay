name: Measure Preview CHECK action v3

on:
  push:
    branches:
      - verify/frontier-check-instrumentation-v1
    paths:
      - '.github/workflows/measure-preview-check-action-v3.yml'

permissions:
  contents: read

concurrency:
  group: seenrelay-preview-check-action-v3-608735
  cancel-in-progress: false

env:
  SEENRELAY_PREVIEW_BASE: https://seenrelay-git-preview-frontier-c-9f112b-ovladonn-9636s-projects.vercel.app
  TARGET_PREVIEW_SHA: 608735e6137a8fdef873d38d24491fe037399ffc
  ACTION_CONTRACT_FINGERPRINT: sha256:da88918fc500be2b6ec3fdfc910ddfcb672047f39fc14a8c8bf75736a4d81a50
  ACTION_FACT_FINGERPRINT: sha256:97f38fc8ce526be89e0ea04f0fe89a38f5cf8ab6292303e3693d8fd513b798a5
  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

jobs:
  observe-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify frozen v3 collectors
        shell: bash
        run: |
          test "$(git rev-parse HEAD:scripts/preview-check-action-v3-setup.mjs)" = '0d6208fc201532b57771d7cb002973738f345400'
          test "$(git rev-parse HEAD:scripts/preview-check-action-v3-measure.mjs)" = '7ca7f56097ec9e5d57e560b843c5d15c1de9a9f0'
          node --check scripts/preview-check-action-v3-setup.mjs
          node --check scripts/preview-check-action-v3-measure.mjs
      - name: Submit independent Ubuntu observation
        run: node scripts/preview-check-action-v3-setup.mjs observe

  observe-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify frozen v3 collectors
        shell: bash
        run: |
          test "$(git rev-parse HEAD:scripts/preview-check-action-v3-setup.mjs)" = '0d6208fc201532b57771d7cb002973738f345400'
          test "$(git rev-parse HEAD:scripts/preview-check-action-v3-measure.mjs)" = '7ca7f56097ec9e5d57e560b843c5d15c1de9a9f0'
          node --check scripts/preview-check-action-v3-setup.mjs
          node --check scripts/preview-check-action-v3-measure.mjs
      - name: Submit independent Windows observation
        run: node scripts/preview-check-action-v3-setup.mjs observe

  qualify:
    needs: [observe-ubuntu, observe-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Qualify exact v3 action fact
        env:
          ACTION_OUTPUT: action-v3-setup-qualification.json
        run: node scripts/preview-check-action-v3-setup.mjs qualify
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-check-action-v3-qualification-${{ github.run_id }}
          path: action-v3-setup-qualification.json
          if-no-files-found: error
          retention-days: 30

  measure-ubuntu:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Measure exactly 60 Ubuntu CHECK HIT actions under v3
        env:
          CANDIDATE_ENVIRONMENT: ubuntu
          ACTION_OUTPUT: candidate-v3-ubuntu.json
        run: node scripts/preview-check-action-v3-measure.mjs
      - name: Upload Ubuntu v3 candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-check-action-v3-ubuntu-${{ github.run_id }}
          path: candidate-v3-ubuntu.json
          if-no-files-found: error
          retention-days: 30

  measure-windows:
    needs: qualify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Measure exactly 60 Windows CHECK HIT actions under v3
        env:
          CANDIDATE_ENVIRONMENT: windows
          ACTION_OUTPUT: candidate-v3-windows.json
        run: node scripts/preview-check-action-v3-measure.mjs
      - name: Upload Windows v3 candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-check-action-v3-windows-${{ github.run_id }}
          path: candidate-v3-windows.json
          if-no-files-found: error
          retention-days: 30
