name: Publish Clients

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'clients/RELEASE_VERSION'

permissions:
  contents: read

concurrency:
  group: publish-clients-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-npm:
    if: (github.event_name == 'release' && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'clients-v')) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact publishing commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify requested version matches npm package
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            EXPECTED="${GITHUB_REF_NAME#clients-v}"
          else
            EXPECTED="$(tr -d '[:space:]' < clients/RELEASE_VERSION)"
          fi
          test -n "$EXPECTED"
          ACTUAL="$(node -p "require('./clients/typescript/package.json').version")"
          test "$EXPECTED" = "$ACTUAL"

      - name: Build npm tarball
        id: pack
        working-directory: clients/typescript
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json
          TARBALL="$(npm pack --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Install npm tarball in a clean project
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/clients/typescript/${{ steps.pack.outputs.tarball }}" >/dev/null
          node --input-type=module - <<'NODE'
          import { SeenRelayClient } from 'seenrelay';
          import { SeenRelayShadowProof } from 'seenrelay/shadow-proof';
          import { SeenRelayZeroState, freshResult } from 'seenrelay/zero-state';
          import { SeenRelayAuto, exactToolAdapter } from 'seenrelay/auto';
          import { protectMcpClient } from 'seenrelay/mcp-auto';
          import { firecrawlScrapePolicy } from 'seenrelay/firecrawl';

          const client = new SeenRelayClient({ fetchImpl: async () => { throw new Error('not called during import test'); } });
          const proof = new SeenRelayShadowProof(client);
          const edge = new SeenRelayZeroState();
          const adapter = exactToolAdapter({ toolNames: ['example.read'] });
          const auto = new SeenRelayAuto({ adapters: [adapter] });
          const protectedClient = protectMcpClient({ async callTool(params) { return params; } }, { tools: {} });
          const providerAdapter = firecrawlScrapePolicy({ publicEvidence: false });
          if (
            typeof client.protectValidation !== 'function' ||
            !proof ||
            typeof edge.guard !== 'function' ||
            typeof freshResult !== 'function' ||
            typeof auto.wrap !== 'function' ||
            typeof protectedClient.callTool !== 'function' ||
            !providerAdapter
          ) process.exit(1);
          NODE

      - name: Upload npm release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seenrelay-npm-release
          path: clients/typescript/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: build-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Download npm release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: seenrelay-npm-release
          path: npm-release

      - name: Check whether this npm version already exists
        id: npm-version
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(find "$GITHUB_WORKSPACE/npm-release" -maxdepth 1 -type f -name 'seenrelay-*.tgz' -print -quit)"
          test -n "$TARBALL"
          VERSION="$(basename "$TARBALL")"
          VERSION="${VERSION#seenrelay-}"
          VERSION="${VERSION%.tgz}"
          test -n "$VERSION"
          if npm view "seenrelay@$VERSION" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package with trusted publishing
        if: steps.npm-version.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(find "$GITHUB_WORKSPACE/npm-release" -maxdepth 1 -type f -name 'seenrelay-*.tgz' -print -quit)"
          test -n "$TARBALL"
          npm publish "$TARBALL" --access public --provenance

  build-pypi:
    if: (github.event_name == 'release' && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'clients-v')) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact publishing commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Verify requested version matches Python package
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            EXPECTED="${GITHUB_REF_NAME#clients-v}"
          else
            EXPECTED="$(tr -d '[:space:]' < clients/RELEASE_VERSION)"
          fi
          test -n "$EXPECTED"
          ACTUAL="$(python - <<'PY'
          import tomllib
          with open('clients/python/pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          PY
          )"
          test "$EXPECTED" = "$ACTUAL"

      - name: Install Python build tooling
        run: python -m pip install --disable-pip-version-check build twine

      - name: Build and validate Python distributions
        working-directory: clients/python
        run: |
          python -m build
          python -m twine check dist/*

      - name: Install Python wheel in a clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/seenrelay-release-test
          /tmp/seenrelay-release-test/bin/python -m pip install --disable-pip-version-check clients/python/dist/*.whl
          /tmp/seenrelay-release-test/bin/python - <<'PY'
          from seenrelay import SeenRelayClient
          from seenrelay_shadow import SeenRelayShadowProof
          from seenrelay_easy import protect_validation
          client = SeenRelayClient(transport=lambda *args, **kwargs: (_ for _ in ()).throw(RuntimeError('not called during import test')))
          proof = SeenRelayShadowProof(client)
          assert client is not None and proof is not None and callable(protect_validation)
          PY

      - name: Upload PyPI release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: seenrelay-pypi-release
          path: clients/python/dist/*
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    needs: build-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PyPI release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: seenrelay-pypi-release
          path: pypi-release

      - name: Publish Python package with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: pypi-release/
