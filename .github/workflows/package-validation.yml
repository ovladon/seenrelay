name: Package Validation

on:
  pull_request:
    paths:
      - 'clients/**'
      - '.github/workflows/package-validation.yml'
      - '.github/workflows/publish-clients.yml'
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - '.github/workflows/package-validation.yml'
      - '.github/workflows/publish-clients.yml'

permissions:
  contents: read

jobs:
  npm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect npm package contents
        working-directory: clients/typescript
        run: npm pack --dry-run --json
      - name: Build npm tarball
        id: npm-pack
        working-directory: clients/typescript
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Install npm tarball in clean project
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cd "$TMP"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/clients/typescript/${{ steps.npm-pack.outputs.tarball }}" >/dev/null
          node --input-type=module - <<'NODE'
          import { SeenRelayClient } from 'seenrelay';
          import { SeenRelayShadowProof } from 'seenrelay/shadow-proof';
          import { SeenRelayZeroState, freshResult } from 'seenrelay/zero-state';
          import { assessSharedCheckEvidence, createMultiSignalRetainedReusePolicy } from 'seenrelay/assurance';
          import { jsonPointerFact, elementIdFact, sourceKeyFact, mcpToolCoordinate, openApiOperationCoordinate } from 'seenrelay/coordinates';
          import { SeenRelayAuto, exactToolAdapter } from 'seenrelay/auto';
          import { protectMcpClient } from 'seenrelay/mcp-auto';
          import { firecrawlScrapePolicy } from 'seenrelay/firecrawl';

          const client = new SeenRelayClient({ fetchImpl: async () => { throw new Error('not called during import test'); } });
          const proof = new SeenRelayShadowProof(client);
          const edge = new SeenRelayZeroState();
          const adapter = exactToolAdapter({ toolNames: ['example.read'] });
          const auto = new SeenRelayAuto({ adapters: [adapter] });
          const protectedClient = protectMcpClient({ async callTool(params) { return params; } }, { tools: {} });
          const providerAdapter = firecrawlScrapePolicy({ publicEvidence: false });

          if (
            typeof client.protectValidation !== 'function' ||
            !proof ||
            typeof edge.guard !== 'function' ||
            typeof freshResult !== 'function' ||
            typeof assessSharedCheckEvidence !== 'function' ||
            typeof createMultiSignalRetainedReusePolicy !== 'function' ||
            typeof jsonPointerFact !== 'function' ||
            typeof elementIdFact !== 'function' ||
            typeof sourceKeyFact !== 'function' ||
            typeof mcpToolCoordinate !== 'function' ||
            typeof openApiOperationCoordinate !== 'function' ||
            typeof auto.wrap !== 'function' ||
            typeof protectedClient.callTool !== 'function' ||
            !providerAdapter
          ) process.exit(1);
          NODE
      - name: Upload npm validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: seenrelay-npm-package
          path: clients/typescript/${{ steps.npm-pack.outputs.tarball }}
          if-no-files-found: error

  pypi-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package build tooling
        run: python -m pip install --disable-pip-version-check build twine
      - name: Build Python distributions
        working-directory: clients/python
        run: python -m build
      - name: Validate Python metadata
        working-directory: clients/python
        run: python -m twine check dist/*
      - name: Install base wheel in clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/seenrelay-package-test
          WHEEL="$(find "$GITHUB_WORKSPACE/clients/python/dist" -maxdepth 1 -type f -name 'seenrelay-*.whl' -print -quit)"
          test -n "$WHEEL"
          /tmp/seenrelay-package-test/bin/python -m pip install --disable-pip-version-check "$WHEEL"
          /tmp/seenrelay-package-test/bin/python - <<'PY'
          from seenrelay import SeenRelayClient
          from seenrelay_shadow import SeenRelayShadowProof
          from seenrelay_economics import evaluate_hostile_benchmark
          from seenrelay_easy import protect_validation
          from seenrelay_assurance import assess_shared_check_evidence, multi_signal_retained_reuse_policy
          from seenrelay_coordinates import json_pointer_fact, element_id_fact, source_key_fact, mcp_tool_coordinate, openapi_operation_coordinate
          from seenrelay_zero_state import SeenRelayZeroState, fresh_result, sha256_json_fingerprint
          client = SeenRelayClient(transport=lambda *args, **kwargs: (_ for _ in ()).throw(RuntimeError('not called during import test')))
          proof = SeenRelayShadowProof(client)
          edge = SeenRelayZeroState()
          assert client is not None and proof is not None and callable(evaluate_hostile_benchmark) and callable(protect_validation)
          assert callable(assess_shared_check_evidence) and callable(multi_signal_retained_reuse_policy)
          assert callable(json_pointer_fact) and callable(element_id_fact) and callable(source_key_fact)
          assert callable(mcp_tool_coordinate) and callable(openapi_operation_coordinate)
          assert callable(edge.guard) and callable(fresh_result)
          assert sha256_json_fingerprint({"id": 1}).startswith("sha256:")
          PY
      - name: Verify optional crypto extra from wheel metadata
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="$(find "$GITHUB_WORKSPACE/clients/python/dist" -maxdepth 1 -type f -name 'seenrelay-*.whl' -print -quit)"
          test -n "$WHEEL"
          /tmp/seenrelay-package-test/bin/python -m pip install --disable-pip-version-check "${WHEEL}[crypto]"
          /tmp/seenrelay-package-test/bin/python - <<'PY'
          from seenrelay_zero_state import create_aes_gcm_private_codec
          codec = create_aes_gcm_private_codec(b"x" * 32)
          key = "sha256:" + "0" * 64
          entry = {"value":{"ok":True},"confirmed_at_ms":1,"source_validator":None,"observed_at_ms":None,"independently_obtained":True}
          sealed = codec.seal(entry, key)
          assert codec.open(sealed, key)["value"] == {"ok": True}
          PY
      - name: Upload PyPI validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seenrelay-pypi-package
          path: clients/python/dist/*
          if-no-files-found: error
