name: Agnix Native-Control Census

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/agnix-native-control-census.yml'
      - 'scripts/agnix-native-control-census.mjs'
      - 'tests/agnix-native-control-census.test.mjs'
      - 'docs/EXTERNAL_WORKLOAD_PRESCREEN.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/agnix-native-control-census.yml'
      - 'scripts/agnix-native-control-census.mjs'
      - 'tests/agnix-native-control-census.test.mjs'
      - 'docs/EXTERNAL_WORKLOAD_PRESCREEN.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  agnix-native-control-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The natural scheduled series closed after the frozen review floor was
      # reached. Remaining executions are commissioning/regression checks only;
      # they cannot advance longitudinal natural evidence.
      - name: Resolve collection mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          echo "mode=commissioning" >> "$GITHUB_OUTPUT"
          echo "Requested census mode: commissioning"

      - name: Run native-control census
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CENSUS_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          mkdir -p .seenrelay-research
          node scripts/agnix-native-control-census.mjs \
            --state .seenrelay-research/agnix-native-state.json \
            --output agnix-native-control-census.json

      - name: Add census summary
        if: always() && hashFiles('agnix-native-control-census.json') != ''
        run: cat agnix-native-control-census.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized census report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agnix-native-control-census
          path: agnix-native-control-census.json
          if-no-files-found: warn
          retention-days: 90