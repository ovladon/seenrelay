name: One-off Public Install Escaping Fix

on:
  push:
    branches: [docs/public-package-install-live]
    paths:
      - '.github/workflows/docs-public-install-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Remove one-off public install escaping fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/public-package-install-live

      - name: Escape Markdown backticks inside TypeScript template literal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/adoption.ts')
          text = p.read_text()
          replacements = {
              '- Public JavaScript / TypeScript install: `npm install seenrelay`': '- Public JavaScript / TypeScript install: \\`npm install seenrelay\\`',
              '- Public Python install: `pip install seenrelay`': '- Public Python install: \\`pip install seenrelay\\`',
              'first install `seenrelay` from npm or PyPI': 'first install \\`seenrelay\\` from npm or PyPI',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/adoption.ts
          git diff --cached --check
          git commit -m 'Escape public install Markdown in llms template'
          git push origin HEAD:docs/public-package-install-live
