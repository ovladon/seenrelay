name: Patch PR41 Gates

on:
  push:
    branches:
      - site/verified-benchmark-matrix-automation
    paths:
      - 'scripts/patch-pr41-gates.py'
      - '.github/workflows/patch-pr41-gates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: site/verified-benchmark-matrix-automation
      - name: Apply bounded fixes
        run: python3 scripts/patch-pr41-gates.py
      - name: Validate project
        run: |
          npm ci
          npm run check
      - name: Commit patched ordinary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/preview-release-gate.sh scripts/benchmark-firecrawl-interact.mjs
          git commit -m 'Harden benchmark retry and generic preview gate'
          git push origin HEAD:site/verified-benchmark-matrix-automation
