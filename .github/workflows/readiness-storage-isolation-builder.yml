name: Readiness Storage Isolation Builder

on:
  push:
    branches:
      - infra/readiness-storage-config-isolation
    paths:
      - .github/workflows/readiness-storage-isolation-builder.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: infra/readiness-storage-config-isolation
      - name: Apply exact admission import patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/readiness.ts')
          s = p.read_text()
          old = "import { consumeHiveNetworkBudget } from './hive-admission-db.js';\nimport { privacyScopedHash } from './identity.js';"
          new = "import { consumeReadinessNetworkBudget, readinessPrivacyScopedHash } from './readiness-admission-db.js';"
          if old not in s:
              raise SystemExit('readiness.ts import anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('privacyScopedHash(', 'readinessPrivacyScopedHash(')
          s = s.replace('consumeHiveNetworkBudget(', 'consumeReadinessNetworkBudget(')
          p.write_text(s)

          p = Path('src/readiness-v2-activation.ts')
          s = p.read_text()
          old = "import { consumeHiveMonthlyBudget } from './hive-admission-db.js';\nimport { privacyScopedHash } from './identity.js';"
          new = "import { consumeReadinessMonthlyBudget, readinessPrivacyScopedHash } from './readiness-admission-db.js';"
          if old not in s:
              raise SystemExit('readiness-v2-activation.ts import anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('privacyScopedHash(', 'readinessPrivacyScopedHash(')
          s = s.replace('consumeHiveMonthlyBudget(', 'consumeReadinessMonthlyBudget(')
          p.write_text(s)
      - name: Commit exact patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/readiness-storage-isolation-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/readiness.ts src/readiness-v2-activation.ts .github/workflows/readiness-storage-isolation-builder.yml
          git commit -m "Route readiness admission through isolated storage"
          git push origin HEAD:infra/readiness-storage-config-isolation
