name: agentgateway ExtMcp Compatibility

on:
  pull_request:
    paths:
      - 'clients/python/integrations/agentgateway/**'
      - '.github/workflows/agentgateway-extmcp-compat.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact SeenRelay Python client
        working-directory: clients/python
        run: python -m pip install --disable-pip-version-check -e .
      - name: Install gRPC test dependencies
        run: python -m pip install --disable-pip-version-check 'grpcio>=1.78,<2' 'grpcio-tools>=1.78,<2' 'protobuf>=6,<7'
      - name: Generate ExtMcp Python bindings from pinned agentgateway source
        env:
          AGENTGATEWAY_SHA: 3d5f59f8e2e17fd05e99b443e6e1bcc76daa5826
        run: |
          set -euo pipefail
          mkdir -p /tmp/seenrelay-extmcp-generated
          curl -fsSL "https://raw.githubusercontent.com/agentgateway/agentgateway/${AGENTGATEWAY_SHA}/crates/protos/proto/ext_mcp.proto" -o /tmp/ext_mcp.proto
          PROTO_INCLUDE="$(python -c 'import grpc_tools, pathlib; print(pathlib.Path(grpc_tools.__file__).parent / "_proto")')"
          python -m grpc_tools.protoc \
            -I/tmp \
            -I"${PROTO_INCLUDE}" \
            --python_out=/tmp/seenrelay-extmcp-generated \
            --grpc_python_out=/tmp/seenrelay-extmcp-generated \
            /tmp/ext_mcp.proto
      - name: Run real gRPC compatibility tests
        env:
          PYTHONPATH: /tmp/seenrelay-extmcp-generated:clients/python/integrations/agentgateway
        run: python -m unittest -v clients/python/integrations/agentgateway/test_seenrelay_extmcp.py
      - name: Verify fail-open and explicit allowlist posture
        run: |
          grep -q 'failureMode: FailOpen' clients/python/integrations/agentgateway/agentgateway-policy.example.yaml
          grep -q 'include_tools must explicitly allow at least one tool name' clients/python/integrations/agentgateway/seenrelay_extmcp_processor.py
          grep -q 'hosted_operations.*0' clients/python/integrations/agentgateway/seenrelay_extmcp_processor.py
