name: One-off Public Facts Bootstrap

on:
  push:
    branches: [infra/public-facts-sync]
    paths:
      - '.github/workflows/public-facts-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: infra/public-facts-sync
      - name: Generate synchronized public surfaces
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-public-surfaces.mjs --write --enforce-freshness
          node scripts/sync-public-surfaces.mjs --enforce-freshness
      - name: Commit generated surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md clients/README.md docs/QUICKSTART.md docs/VERIFIED_RESULTS.md src/public-facts.generated.ts
          git diff --cached --check
          git commit -m 'Generate synchronized public product surfaces'
          git push origin HEAD:infra/public-facts-sync
