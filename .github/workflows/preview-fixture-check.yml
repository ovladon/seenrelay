name: Preview fixture check

on:
  push:
    branches:
      - preview/native-http-fixture-v1

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Typecheck core
        run: npm run typecheck:core
      - name: Typecheck full
        run: npm run typecheck:full
      - name: Qualify exact Vercel Preview
        run: node scripts/qualify-preview-fixture.mjs
