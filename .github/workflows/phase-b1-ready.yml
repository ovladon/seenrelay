name: Phase B1 Mark Ready

on:
  push:
    branches: [site/phase-b1-adoption-surface]
    paths: ['.github/workflows/phase-b1-ready.yml']

permissions:
  contents: write
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: site/phase-b1-adoption-surface
      - name: Mark PR ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 118 --repo ovladon/seenrelay
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase-b1-ready.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary Phase B.1 ready workflow'
          git push origin HEAD:site/phase-b1-adoption-surface
