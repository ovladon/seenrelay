name: Step 3 Firecrawl Real Benchmark

on:
  push:
    branches: [bench/step3-firecrawl-real]
    paths:
      - '.github/workflows/step3-firecrawl-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install public SeenRelay client
        shell: bash
        run: |
          set -euo pipefail
          mkdir bench
          cd bench
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund seenrelay@0.1.0 >/dev/null

      - name: Run real Firecrawl versus SeenRelay benchmark
        working-directory: bench
        shell: bash
        env:
          BENCHMARK_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { performance } from 'node:perf_hooks';
          import { SeenRelayClient, reuseKnownOnSameObserved } from 'seenrelay';

          const N = 5;
          const benchmarkId = `step3-${process.env.BENCHMARK_RUN_ID}-${Date.now()}`;
          const sourceUrl = `https://example.com/?seenrelay_benchmark=${encodeURIComponent(benchmarkId)}`;
          const knownValue = 'Example Domain';
          const fact = {
            subject: 'Example.com document title — internal Step 3 benchmark',
            predicate: 'document.title.current',
            source: sourceUrl,
          };

          const relay = new SeenRelayClient({
            clientHint: `seenrelay-internal-benchmark-firecrawl-${benchmarkId}`,
            checkTimeoutMs: 5000,
            observeTimeoutMs: 5000,
          });

          let firecrawlCalls = 0;
          const firecrawlEvents = [];

          function round(value) { return Math.round(value * 100) / 100; }
          function percentile(sorted, p) {
            if (!sorted.length) return null;
            const index = Math.min(sorted.length - 1, Math.max(0, Math.ceil(p * sorted.length) - 1));
            return sorted[index];
          }
          function stats(values) {
            if (!values.length) return { n: 0, meanMs: null, medianMs: null, p95Ms: null, minMs: null, maxMs: null };
            const sorted = [...values].sort((a, b) => a - b);
            return {
              n: sorted.length,
              meanMs: round(sorted.reduce((a, b) => a + b, 0) / sorted.length),
              medianMs: round(percentile(sorted, 0.5)),
              p95Ms: round(percentile(sorted, 0.95)),
              minMs: round(sorted[0]),
              maxMs: round(sorted.at(-1)),
            };
          }

          async function firecrawlScrape(label) {
            firecrawlCalls += 1;
            const started = performance.now();
            const response = await fetch('https://api.firecrawl.dev/v2/scrape', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                url: sourceUrl,
                formats: ['markdown'],
                onlyMainContent: true,
                maxAge: 172800000,
              }),
              signal: AbortSignal.timeout(60000),
            });
            const elapsedMs = performance.now() - started;
            const body = await response.json();
            if (!response.ok || body?.success !== true) {
              throw new Error(`Firecrawl failed (${response.status}): ${JSON.stringify(body).slice(0, 500)}`);
            }
            const metadata = body?.data?.metadata ?? {};
            const markdown = body?.data?.markdown ?? '';
            const title = metadata.title || markdown.match(/^#\s+(.+)$/m)?.[1]?.trim();
            if (title !== knownValue) {
              throw new Error(`Unexpected Firecrawl title: ${JSON.stringify(title)}`);
            }
            const cacheState = metadata.cacheState ?? metadata.cache_state ?? null;
            const creditsUsed = metadata.creditsUsed ?? metadata.credits_used ?? null;
            firecrawlEvents.push({
              label,
              elapsedMs: round(elapsedMs),
              cacheState,
              creditsUsed,
              statusCode: metadata.statusCode ?? metadata.status_code ?? response.status,
            });
            return title;
          }

          async function directSourceTitle() {
            const started = performance.now();
            const response = await fetch(sourceUrl, { signal: AbortSignal.timeout(10000) });
            const html = await response.text();
            if (!response.ok) throw new Error(`Direct source GET failed (${response.status})`);
            const title = html.match(/<title>([^<]+)<\/title>/i)?.[1]?.trim();
            if (title !== knownValue) throw new Error(`Unexpected direct-source title: ${JSON.stringify(title)}`);
            return performance.now() - started;
          }

          const baselineTimes = [];
          for (let i = 0; i < N; i++) {
            const before = firecrawlEvents.length;
            await firecrawlScrape(`baseline-${i + 1}`);
            baselineTimes.push(firecrawlEvents[before].elapsedMs);
          }

          const coldStarted = performance.now();
          const cold = await relay.guardDetailed({
            fact,
            knownValue,
            maxAgeSeconds: 3600,
            validate: async () => firecrawlScrape('cold-start-validation'),
            observation: async () => ({
              observerId: 'first-party-step3-firecrawl-benchmark',
              idempotencyKey: `${benchmarkId}-cold`,
            }),
          });
          const coldElapsedMs = performance.now() - coldStarted;

          const shadowTimes = [];
          const shadowPaths = [];
          const shadowStatuses = [];
          for (let i = 0; i < N; i++) {
            const started = performance.now();
            const result = await relay.guardDetailed({
              fact,
              knownValue,
              maxAgeSeconds: 3600,
              validate: async () => firecrawlScrape(`shadow-${i + 1}`),
              observation: async () => ({
                observerId: 'first-party-step3-firecrawl-benchmark',
                idempotencyKey: `${benchmarkId}-shadow-${i + 1}`,
              }),
            });
            shadowTimes.push(performance.now() - started);
            shadowPaths.push(result.path);
            shadowStatuses.push(result.check?.status ?? null);
          }

          const firecrawlBeforeReuse = firecrawlCalls;
          const reuseTimes = [];
          const reusePaths = [];
          const reuseStatuses = [];
          for (let i = 0; i < N; i++) {
            const started = performance.now();
            const result = await relay.guardDetailed({
              fact,
              knownValue,
              maxAgeSeconds: 3600,
              reuse: reuseKnownOnSameObserved,
              validate: async () => firecrawlScrape(`unexpected-reuse-validation-${i + 1}`),
              observation: async () => ({
                observerId: 'first-party-step3-firecrawl-benchmark',
                idempotencyKey: `${benchmarkId}-reuse-fallback-${i + 1}`,
              }),
            });
            reuseTimes.push(performance.now() - started);
            reusePaths.push(result.path);
            reuseStatuses.push(result.check?.status ?? null);
          }
          const reuseFirecrawlCalls = firecrawlCalls - firecrawlBeforeReuse;

          const directGetTimes = [];
          for (let i = 0; i < N; i++) directGetTimes.push(await directSourceTitle());

          const checkOnlyTimes = [];
          const checkOnlyStatuses = [];
          for (let i = 0; i < N; i++) {
            const started = performance.now();
            const result = await relay.check(fact, knownValue, 3600);
            checkOnlyTimes.push(performance.now() - started);
            checkOnlyStatuses.push(result.status);
          }

          const measuredCredits = firecrawlEvents
            .map((e) => e.creditsUsed)
            .filter((v) => Number.isFinite(v));
          const cacheStates = firecrawlEvents.reduce((acc, e) => {
            const key = e.cacheState ?? 'not_reported';
            acc[key] = (acc[key] ?? 0) + 1;
            return acc;
          }, {});

          const baselineProviderCalls = N;
          const shadowProviderCalls = N;
          const steadyReuseProviderCalls = reuseFirecrawlCalls;
          const documentedCreditsPerBasicScrape = 1;
          const expectedCreditsAvoidedPerNRepeatedValidations = (baselineProviderCalls - steadyReuseProviderCalls) * documentedCreditsPerBasicScrape;
          const acceptedReuseRate = reusePaths.filter((p) => p === 'reused').length / N;

          const report = {
            benchmark: 'SeenRelay Step 3 — Firecrawl fixed-URL metered scrape',
            benchmarkId,
            timestamp: new Date().toISOString(),
            sourceUrl,
            samplesPerSteadyStatePhase: N,
            provider: {
              name: 'Firecrawl',
              endpoint: 'https://api.firecrawl.dev/v2/scrape',
              auth: 'keyless',
              maxAgeMs: 172800000,
              documentedCreditsPerBasicScrape,
              totalCallsActuallyMade: firecrawlCalls,
              cacheStates,
              creditsUsedReportedByProvider: measuredCredits,
            },
            baselineWithoutSeenRelay: {
              providerCalls: baselineProviderCalls,
              latency: stats(baselineTimes),
            },
            coldStart: {
              checkStatus: cold.check?.status ?? null,
              path: cold.path,
              endToEndMs: round(coldElapsedMs),
              providerCalls: 1,
            },
            shadowMode: {
              paths: shadowPaths,
              checkStatuses: shadowStatuses,
              providerCalls: shadowProviderCalls,
              latency: stats(shadowTimes),
            },
            boundedReuse: {
              paths: reusePaths,
              checkStatuses: reuseStatuses,
              providerCalls: steadyReuseProviderCalls,
              acceptedReuseRate,
              latency: stats(reuseTimes),
              expectedProviderCreditsAvoidedVsBaselineForNCalls: expectedCreditsAvoidedPerNRepeatedValidations,
            },
            negativeControlCheapDirectSource: {
              directGetLatency: stats(directGetTimes),
              seenRelayCheckLatency: stats(checkOnlyTimes),
              checkStatuses: checkOnlyStatuses,
              monetaryProviderCostAvoidedPerDirectGet: 0,
            },
            seenRelayTelemetry: relay.getTelemetry(),
            rawFirecrawlEvents: firecrawlEvents,
            interpretationInputs: {
              firecrawlBasicScrapeCreditModel: '1 credit per successful basic scrape (documented provider pricing); cached scrape still costs the full credit according to Firecrawl documentation.',
              seenRelayPriceToday: 'currently free',
              fixedPlanCaveat: 'Credits avoided do not automatically reduce a fixed monthly invoice unless they prevent overage/upgrade or permit a lower tier.',
            },
          };

          fs.writeFileSync('../step3-firecrawl-benchmark.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));

          if (cold.check?.status !== 'UNKNOWN') throw new Error(`Cold-start falsification failed: expected UNKNOWN, got ${cold.check?.status}`);
          if (shadowStatuses.some((s) => s !== 'SAME_OBSERVED')) throw new Error(`Shadow phase did not stay SAME_OBSERVED: ${shadowStatuses.join(',')}`);
          if (reusePaths.some((p) => p !== 'reused')) throw new Error(`Bounded reuse failed to reuse all eligible calls: ${reusePaths.join(',')}`);
          if (reuseFirecrawlCalls !== 0) throw new Error(`Bounded reuse unexpectedly invoked Firecrawl ${reuseFirecrawlCalls} time(s)`);
          NODE

      - name: Publish benchmark summary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('step3-firecrawl-benchmark.json', 'utf8'));
          console.log('# SeenRelay Step 3 — real Firecrawl benchmark');
          console.log('');
          console.log(`- Baseline Firecrawl calls: ${r.baselineWithoutSeenRelay.providerCalls}`);
          console.log(`- Shadow Firecrawl calls: ${r.shadowMode.providerCalls}`);
          console.log(`- Reuse Firecrawl calls: ${r.boundedReuse.providerCalls}`);
          console.log(`- Accepted reuse rate: ${(100 * r.boundedReuse.acceptedReuseRate).toFixed(1)}%`);
          console.log(`- Provider credits avoided vs ${r.samplesPerSteadyStatePhase} baseline validations: ${r.boundedReuse.expectedProviderCreditsAvoidedVsBaselineForNCalls}`);
          console.log(`- Baseline median latency: ${r.baselineWithoutSeenRelay.latency.medianMs} ms`);
          console.log(`- Reuse median latency: ${r.boundedReuse.latency.medianMs} ms`);
          console.log(`- Direct GET median latency: ${r.negativeControlCheapDirectSource.directGetLatency.medianMs} ms`);
          console.log(`- SeenRelay CHECK median latency: ${r.negativeControlCheapDirectSource.seenRelayCheckLatency.medianMs} ms`);
          console.log('');
          console.log('This is first-party benchmark traffic and is excluded from adoption metrics.');
          NODE

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: step3-firecrawl-benchmark
          path: step3-firecrawl-benchmark.json
          if-no-files-found: error
          retention-days: 30
