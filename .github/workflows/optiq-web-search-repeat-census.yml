name: OptiQ Web Search Repeat Census

on:
  pull_request:
    paths:
      - 'scripts/census-optiq-web-search-repeats.py'
      - 'tests/optiq-web-search-repeat-census.test.mjs'
      - '.github/workflows/optiq-web-search-repeat-census.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optiq-web-search-repeat-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPTIQ_DATASET_REVISION: f0e247006971ebf7d844a4f3ce59f4544aa46f56
    steps:
      - name: Checkout exact SeenRelay commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned download client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub==0.35.3'

      - name: Resolve and download public OptiQ trace revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi, snapshot_download

          requested_revision = os.environ["OPTIQ_DATASET_REVISION"]
          repo_id = "mlx-community/optiq-lab-traces"
          api = HfApi()
          resolved_revision = api.dataset_info(
              repo_id=repo_id,
              revision=requested_revision,
          ).sha

          files = api.list_repo_files(
              repo_id=repo_id,
              repo_type="dataset",
              revision=resolved_revision,
          )
          expected_jsonl = sorted(name for name in files if name.endswith(".jsonl"))

          path = snapshot_download(
              repo_id=repo_id,
              repo_type="dataset",
              revision=resolved_revision,
              allow_patterns=["*.jsonl", "README.md"],
              local_dir="/tmp/optiq-lab-traces",
          )
          observed_jsonl = sorted(
              str(p.relative_to(path))
              for p in Path(path).rglob("*.jsonl")
              if p.is_file()
          )

          manifest = {
              "repo_id": repo_id,
              "requested_revision": requested_revision,
              "revision": resolved_revision,
              "dataset_card_declared_sessions": 866,
              "repo_jsonl_files": len(expected_jsonl),
              "downloaded_jsonl_files": len(observed_jsonl),
              "repo_download_match": expected_jsonl == observed_jsonl,
          }
          Path("/tmp/optiq-source-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"OPTIQ_RESOLVED_REVISION={resolved_revision}\n")

          print(json.dumps(manifest, indent=2))
          if not expected_jsonl or expected_jsonl != observed_jsonl:
              raise SystemExit("resolved Hugging Face repo manifest did not download exactly")
          PY

      - name: Run external trace repeat census
        run: |
          set -euo pipefail
          python scripts/census-optiq-web-search-repeats.py             /tmp/optiq-lab-traces             --out optiq-web-search-repeat-census.json             --dataset-revision "$OPTIQ_RESOLVED_REVISION"             | tee /tmp/optiq-web-search-repeat-census.stdout.json

          python - <<'PY'
          import json
          report = json.load(open("optiq-web-search-repeat-census.json"))
          source_manifest = json.load(open("/tmp/optiq-source-manifest.json"))
          assert report["dataset"]["pinned_revision"] == source_manifest["revision"]
          assert report["population"]["sessions"] == source_manifest["downloaded_jsonl_files"]
          assert report["economics"]["dollar_savings_claim"] is None
          assert report["economics"]["net_savings_claim"] is None
          assert report["interpretation"]["distributed_fleet_overlap_claim"] is False
          print(json.dumps({
              "requested_revision": source_manifest["requested_revision"],
              "resolved_revision": source_manifest["revision"],
              "dataset_card_declared_sessions": source_manifest["dataset_card_declared_sessions"],
              "repo_jsonl_files": source_manifest["repo_jsonl_files"],
              "sessions_parsed": report["population"]["sessions"],
              "web_search_tool_calls": report["population"]["web_search_tool_calls"],
              "within_session_exact_query_extra_calls": report["within_session"]["exact_query_extra_calls"],
              "within_session_normalized_query_extra_calls": report["within_session"]["normalized_query_extra_calls"],
              "same_assistant_message_exact_query_extra_calls": report["within_session"]["same_assistant_message_exact_query_extra_calls"],
              "cross_message_exact_query_extra_calls": report["within_session"]["cross_message_exact_query_extra_calls"],
              "exact_query_keys_seen_in_multiple_sessions": report["whole_corpus"]["exact_query_keys_seen_in_multiple_sessions"],
          }, indent=2))
          PY

      - name: Upload raw census evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optiq-web-search-repeat-census
          path: |
            optiq-web-search-repeat-census.json
            /tmp/optiq-web-search-repeat-census.stdout.json
            /tmp/optiq-source-manifest.json
          if-no-files-found: warn
          retention-days: 30
