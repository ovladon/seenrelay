name: Bootstrap Preview Gate Discovery

on:
  push:
    branches:
      - adoption/discovery-surface-alignment
    paths:
      - .github/workflows/bootstrap-preview-gate-discovery.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adoption/discovery-surface-alignment
      - name: Migrate llms discovery assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/preview-release-gate.sh')
          t=p.read_text()
          old='''grep -q "JavaScript/TypeScript ${client_version} uses" /tmp/llms.txt\ngrep -q "Python ${client_version} remains shadow-first" /tmp/llms.txt'''
          new='''grep -q 'SeenRelay is a reuse layer for repeated read-only validation' /tmp/llms.txt\ngrep -q '## First proof: measure without changing application behavior' /tmp/llms.txt\ngrep -q "JavaScript / TypeScript ${client_version}:" /tmp/llms.txt\ngrep -q "Python ${client_version}:" /tmp/llms.txt\ngrep -q 'ambientMcpClient(rawMcpClient)' /tmp/llms.txt\ngrep -q 'client.seenRelayAmbient.getReport()' /tmp/llms.txt\ngrep -q 'ambient_mcp_client(raw_mcp_client)' /tmp/llms.txt\ngrep -q 'client.get_report()' /tmp/llms.txt\ngrep -q "Python ${client_version} remains shadow-first" /tmp/llms.txt'''
          if old not in t:
              raise SystemExit('legacy llms gate anchor not found')
          p.write_text(t.replace(old,new,1))
          PY
          git config user.name 'SeenRelay CI'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/preview-release-gate.sh
          git diff --cached --check
          git commit -m 'Align preview gate with factual llms onboarding'
          git push origin HEAD:adoption/discovery-surface-alignment
