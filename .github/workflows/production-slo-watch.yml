name: Production SLO Watch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/production-sli-probe.mjs'
      - '.github/workflows/production-slo-watch.yml'
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seenrelay-production-slo-watch
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      - name: Measure production SLI and P99
        run: node scripts/production-sli-probe.mjs

      - name: Publish SLI summary
        if: always()
        shell: bash
        run: |
          if [ -f production-sli-report.json ]; then
            node scripts/production-sli-format.mjs summary >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or close SLO breach issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title='[slo] SeenRelay production SLI breach'
          issue=$(gh issue list --state open --search '"[slo] SeenRelay production SLI breach" in:title' --json number --jq '.[0].number // empty')
          if [ ! -f production-sli-report.json ]; then
            bad=true
            body='Production SLI probe failed before producing a report. Inspect the workflow run.'
          else
            bad=$(node -e "const r=require('./production-sli-report.json');process.stdout.write(String(!r.slo_ok))")
            body="$(node scripts/production-sli-format.mjs issue)"
          fi
          if [ "$bad" = true ]; then
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body 'Latest production SLI probe recovered. Closing automatically.'
            gh issue close "$issue"
          fi

      - name: Upload SLI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: production-sli-${{ github.run_id }}
          path: production-sli-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce SLO probe
        shell: bash
        run: |
          node -e "const r=require('./production-sli-report.json');if(!r.slo_ok)process.exit(1)"
