name: PRIVATE311 Browserbase Render Stability

on:
  push:
    branches:
      - research/browserbase-rendered-state-stability-v1
    paths:
      - 'preregistration/PRIVATE311_BROWSERBASE_RENDERED_STATE_STABILITY_V1.json'
      - 'scripts/private311-browserbase-render-stability.mjs'
      - 'tests/private311-browserbase-render-stability.test.mjs'
      - '.github/workflows/private311-browserbase-render-stability.yml'

permissions:
  contents: read

concurrency:
  group: private311-browserbase-render-stability
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRIVATE311_OUTPUT: private311-browserbase-render-stability.json
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require exact research branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/browserbase-rendered-state-stability-v1'

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Validate preregistration JSON
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('preregistration/PRIVATE311_BROWSERBASE_RENDERED_STATE_STABILITY_V1.json','utf8')); if(p.experiment_id!=='PRIVATE311'||p.thresholds?.exact_stability_pass_numerator!==20||p.thresholds?.exact_stability_pass_denominator!==20||p.thresholds?.fuzzy_or_perceptual_matching_allowed!==false) process.exit(1)"

      - name: Run hostile synthetic tests
        run: node --test tests/private311-browserbase-render-stability.test.mjs

      - name: Install frozen browser client only
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright-core@1.63.0

      - name: Run aggregate-only stability gate
        run: node scripts/private311-browserbase-render-stability.mjs

      - name: Validate aggregate artifact contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateAggregateReport } from './scripts/private311-browserbase-render-stability.mjs';
          const raw = fs.readFileSync(process.env.PRIVATE311_OUTPUT, 'utf8');
          if (Buffer.byteLength(raw, 'utf8') > 8192) process.exit(1);
          if (/connectUrl|sessionId|x-bb-api-key|screenshot\.png|data:image/i.test(raw)) process.exit(1);
          const report = JSON.parse(raw);
          validateAggregateReport(report);
          if (report.status === 'MEASURED' && report.completed_captures !== 20) process.exit(1);
          NODE

      - name: Remove transient dependencies and npm cache references
        if: always()
        shell: bash
        run: |
          rm -rf node_modules
          rm -f package-lock.json.npm-install-backup 2>/dev/null || true

      - name: Upload validated aggregate only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: private311-browserbase-render-stability-${{ github.run_id }}
          path: private311-browserbase-render-stability.json
          if-no-files-found: error
          retention-days: 14
