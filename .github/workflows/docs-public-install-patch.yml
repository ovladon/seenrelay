name: One-off Public Package Docs Patch

on:
  push:
    branches: [docs/public-package-install-live]
    paths:
      - '.github/workflows/docs-public-install-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Remove one-off public package docs patch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/public-package-install-live

      - name: Patch public installation guidance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          replace_exact(
              'README.md',
              '- Fleet economics and concrete cost examples: `https://seenrelay.com/economics`\n- Recommended deterministic application integration: [`clients/README.md`](clients/README.md)',
              '- Public install: `npm install seenrelay` or `pip install seenrelay`\n- Fleet economics and concrete cost examples: `https://seenrelay.com/economics`\n- Recommended deterministic application integration: [`clients/README.md`](clients/README.md)'
          )
          replace_exact(
              'README.md',
              'The client wrappers are separately MIT licensed so applications can integrate them without changing the repository-root license that governs the hosted service implementation. Package metadata is prepared for npm and PyPI publication; registry publication is a separate release step.',
              'The client wrappers are separately MIT licensed so applications can integrate them without changing the repository-root license that governs the hosted service implementation. Version `0.1.0` is publicly installable from both registries: `npm install seenrelay` and `pip install seenrelay`. Public-registry installation is verified in clean GitHub-hosted environments before the documentation claims availability.'
          )

          replace_exact(
              'clients/README.md',
              'The clients have zero third-party runtime dependencies. Package artifacts are continuously build/install validated for npm and PyPI publication, but registry publication is a separate release step and must not be inferred from repository metadata alone.',
              'The clients have zero third-party runtime dependencies and are publicly available as `seenrelay` version `0.1.0` on npm and PyPI. Install with `npm install seenrelay` or `pip install seenrelay`. Public-registry installation and imports were verified in clean GitHub-hosted environments.'
          )
          replace_exact(
              'clients/README.md',
              '## Default behavior',
              '## Install\n\nJavaScript / TypeScript:\n\n```bash\nnpm install seenrelay\n```\n\nPython:\n\n```bash\npip install seenrelay\n```\n\nNo SeenRelay account or API key is required. Access is currently free.\n\n## Default behavior'
          )
          replace_exact('clients/README.md', "import { SeenRelayClient, reuseKnownOnSameObserved } from './seenrelay.js';", "import { SeenRelayClient, reuseKnownOnSameObserved } from 'seenrelay';")
          replace_exact('clients/README.md', "import { SeenRelayClient } from './seenrelay.js';\nimport { SeenRelayShadowProof } from './shadow-proof.js';", "import { SeenRelayClient } from 'seenrelay';\nimport { SeenRelayShadowProof } from 'seenrelay/shadow-proof';")

          replace_exact(
              'docs/QUICKSTART.md',
              'For applications that must run the SeenRelay preflight every time an existing validation path executes, the repository ships zero-third-party-runtime-dependency JavaScript and Python clients:\n\n- JavaScript / TypeScript: [`../clients/typescript/dist/seenrelay.js`](../clients/typescript/dist/seenrelay.js)\n- Python: [`../clients/python/seenrelay.py`](../clients/python/seenrelay.py)\n- Python bind-once helper: [`../clients/python/seenrelay_easy.py`](../clients/python/seenrelay_easy.py)\n- design, safety and examples: [`../clients/README.md`](../clients/README.md)',
              'For applications that must run the SeenRelay preflight every time an existing validation path executes, install the public zero-third-party-runtime-dependency client:\n\n```bash\n# JavaScript / TypeScript\nnpm install seenrelay\n\n# Python\npip install seenrelay\n```\n\nDesign, safety and complete examples: [`../clients/README.md`](../clients/README.md). The exact package version currently published on both registries is `0.1.0`.'
          )
          replace_exact(
              'docs/QUICKSTART.md',
              '### JavaScript / TypeScript\n\n```js\nconst relay = new SeenRelayClient();',
              '### JavaScript / TypeScript\n\n```js\nimport { SeenRelayClient } from \'seenrelay\';\n\nconst relay = new SeenRelayClient();'
          )

          adoption = Path('src/adoption.ts')
          text = adoption.read_text()
          anchor = '<section class="section split decision">\n<div><div class="eyebrow">DETERMINISTIC CLIENTS</div>'
          if text.count(anchor) != 1:
              raise SystemExit('src/adoption.ts deterministic-clients anchor mismatch')
          install_section = '''<section class="section split" id="install">\n<div><div class="eyebrow">PUBLIC INSTALL</div><h2>Two commands. No account or API key.</h2><p>Install the zero-dependency client from the standard registry, then bind SeenRelay around the expensive validator you already have. Version <code>0.1.0</code> is live on both registries and has been clean-install verified from the public indexes.</p></div>\n<div class="terminal"><pre>npm install seenrelay\n\n# or\n\npip install seenrelay</pre></div>\n</section>\n'''
          text = text.replace(anchor, install_section + anchor, 1)
          old_cta = '<div class="cta"><a class="primary" href="https://github.com/ovladon/seenrelay/tree/main/clients">Use a deterministic client</a>'
          new_cta = '<div class="cta"><a class="primary" href="#install">Install SeenRelay</a>'
          if text.count(old_cta) != 1:
              raise SystemExit('src/adoption.ts CTA mismatch')
          text = text.replace(old_cta, new_cta, 1)
          old_machine = '- Deterministic clients: https://github.com/ovladon/seenrelay/tree/main/clients\n- Shadow Proof / Economics Lab:'
          new_machine = '- Public JavaScript / TypeScript install: `npm install seenrelay`\n- Public Python install: `pip install seenrelay`\n- Deterministic client source and examples: https://github.com/ovladon/seenrelay/tree/main/clients\n- Shadow Proof / Economics Lab:'
          if text.count(old_machine) != 1:
              raise SystemExit('src/adoption.ts llms canonical interfaces mismatch')
          text = text.replace(old_machine, new_machine, 1)
          old_integration = 'Use remote MCP when model/tool routing is appropriate. For application code, bind the zero-dependency JavaScript or Python client around one existing fixed-fact validator with protectValidation / protect_validation.'
          new_integration = 'Use remote MCP when model/tool routing is appropriate. For application code, first install `seenrelay` from npm or PyPI, then bind the zero-dependency JavaScript or Python client around one existing fixed-fact validator with protectValidation / protect_validation.'
          if text.count(old_integration) != 1:
              raise SystemExit('src/adoption.ts llms integration mismatch')
          adoption.write_text(text.replace(old_integration, new_integration, 1))

          quick = Path('src/quickstart.ts')
          text = quick.read_text()
          anchor = '<section class="section split decision">\n<div><div class="eyebrow">DETERMINISTIC CALL PATH</div>'
          if text.count(anchor) != 1:
              raise SystemExit('src/quickstart.ts deterministic call-path anchor mismatch')
          install_section = '''<section class="section split" id="install">\n<div><div class="eyebrow">INSTALL</div><h2>Use the normal package manager.</h2><p>No vendoring and no copy-paste client file. Version <code>0.1.0</code> is publicly installable from npm and PyPI.</p></div>\n<div class="terminal"><pre>npm install seenrelay\n\n# or\n\npip install seenrelay</pre></div>\n</section>\n\n'''
          quick.write_text(text.replace(anchor, install_section + anchor, 1))
          PY

      - name: Commit deterministic documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md clients/README.md docs/QUICKSTART.md src/adoption.ts src/quickstart.ts
          git diff --cached --check
          git commit -m 'Document live npm and PyPI client installation'
          git push origin HEAD:docs/public-package-install-live
