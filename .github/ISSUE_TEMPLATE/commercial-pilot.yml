name: Commercial pilot inquiry
description: Public intake for a measured SeenRelay workload pilot. Do not include secrets or customer data.
title: "[Pilot] "
body:
  - type: markdown
    attributes:
      value: |
        SeenRelay pilots begin with measurement, not a savings promise.

        **This issue is public. Do not post credentials, customer data, private URLs, proprietary prompts, device identifiers, access tokens, or other secrets.** Describe the workload at a high level only. If private follow-up is required, state that without adding private material here.

  - type: dropdown
    id: surface
    attributes:
      label: Workload surface
      options:
        - AI agent / MCP tool
        - HTTP / RPC / service read
        - Browser / scraping / extraction
        - CI / test / validation job
        - IoT / edge read-only validation
        - Other read-only execution
    validations:
      required: true

  - type: textarea
    id: workload
    attributes:
      label: What expensive read-only work repeats?
      description: Describe the operation and why you believe independent callers may repeat it.
      placeholder: "Example: multiple workers request the same rendered page extraction while the first job is still running."
    validations:
      required: true

  - type: textarea
    id: callers
    attributes:
      label: Callers and concurrency
      description: Approximate worker/process/service count and whether duplicates can overlap in time.
      placeholder: "Example: 20 workers; usually 2-5 concurrent calls for the same coordinate."
    validations:
      required: true

  - type: textarea
    id: economics
    attributes:
      label: Current cost or constrained capacity
      description: Use approximate public/provider units where possible. Do not disclose confidential invoices.
      placeholder: "Example: 3 provider credits per execution; provider concurrency limit 10; ~50k calls/month."
    validations:
      required: true

  - type: textarea
    id: native
    attributes:
      label: Native/local controls already available
      description: Note caches, ETag/Last-Modified, provider cache, request coalescing, device shadows/subscriptions, build caches, or other controls already in use.
      placeholder: "Example: provider cache enabled; no distributed single-flight."
    validations:
      required: true

  - type: dropdown
    id: side_effect
    attributes:
      label: Side-effect class
      options:
        - Read-only
        - Idempotent read
        - Unsure
        - Mutating / state-changing
    validations:
      required: true

  - type: checkboxes
    id: public_boundary
    attributes:
      label: Public issue boundary
      options:
        - label: I have not included credentials, customer data, private URLs, proprietary prompts, device identifiers, tokens, or other secrets.
          required: true

  - type: textarea
    id: success
    attributes:
      label: What would make a pilot commercially useful?
      description: State the measurable outcome you care about.
      placeholder: "Example: reduce provider jobs without result mismatches and show positive net savings after coordination overhead."
    validations:
      required: true
