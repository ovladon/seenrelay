version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      safe-npm-updates:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - maintenance

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Bucharest
    open-pull-requests-limit: 5
    groups:
      github-actions-maintenance:
        patterns:
          - "*"
    labels:
      - dependencies
      - maintenance
