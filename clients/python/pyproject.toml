[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seenrelay"
version = "0.2.7"
description = "Measure and avoid redundant expensive validation with SeenRelay CHECK/OBSERVE."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Vlad Belciug" }]
keywords = ["ai-agents", "validation", "freshness", "cache", "mcp", "langchain", "pydantic-ai", "openai-agents"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.urls]
Homepage = "https://seenrelay.com/clients"
Repository = "https://github.com/ovladon/seenrelay"
Issues = "https://github.com/ovladon/seenrelay/issues"

[tool.setuptools]
py-modules = ["seenrelay", "seenrelay_shadow", "seenrelay_easy", "seenrelay_ambient", "seenrelay_assurance", "seenrelay_coordinates"]
