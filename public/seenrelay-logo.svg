<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SeenRelay Technical Relay mark</title>
  <desc id="desc">Two rounded relay paths joined by a central blue node on a dark square.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86F5D5"/>
      <stop offset="0.48" stop-color="#65EFCB"/>
      <stop offset="1" stop-color="#43B8FF"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5FAFF"/>
      <stop offset="0.48" stop-color="#EAF4FF"/>
      <stop offset="1" stop-color="#FFD44A"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25B7FF"/>
      <stop offset="1" stop-color="#087BEF"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#0C1C26"/>
      <stop offset="1" stop-color="#071013"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="92" fill="url(#bgGlow)"/>
  <rect x="28" y="28" width="456" height="456" rx="72" fill="none" stroke="#18303B" stroke-width="4"/>
  <path d="M146 158 H322 C354 158 372 177 372 205 V224 C372 247 354 264 330 264 H286"
        fill="none" stroke="url(#top)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M226 252 H192 C158 252 140 270 140 298 V313 C140 340 160 356 193 356 H359"
        fill="none" stroke="url(#bottom)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="146" cy="158" r="31" fill="#86F5D5"/>
  <circle cx="359" cy="356" r="31" fill="#FFD44A"/>
  <circle cx="258" cy="258" r="37" fill="url(#node)" stroke="#071013" stroke-width="10"/>
</svg>
